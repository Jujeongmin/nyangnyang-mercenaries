<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>냥냥 용병단 — 전투 연출 데모</title>
<style>
  :root{ --bg:#0d1117; --panel:#161d2a; --line:#28324a; --txt:#e8edf5; --dim:#8c9ab2; --gold:#ffc94a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
  #wrap{display:flex;height:100%;gap:0}
  #stage{flex:1;position:relative;min-width:0;background:#111823}
  canvas{display:block;width:100%;height:100%}
  #side{width:250px;flex:0 0 250px;background:var(--panel);border-left:1px solid var(--line);
    padding:12px;overflow-y:auto}
  h1{font-size:14px;margin:0 0 4px}
  .sub{font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.5}
  .preset{display:flex;gap:6px;margin-bottom:12px}
  .preset button{flex:1;background:#222c40;border:1px solid var(--line);color:var(--txt);
    border-radius:6px;padding:7px 4px;font-size:11px;font-weight:700;cursor:pointer}
  .preset button.on{background:var(--gold);color:#000;border-color:var(--gold)}
  .grp{font-size:10px;color:var(--dim);letter-spacing:.5px;margin:14px 0 6px;
    border-bottom:1px solid var(--line);padding-bottom:4px}
  label{display:flex;align-items:center;gap:7px;padding:5px 2px;font-size:12px;cursor:pointer;
    border-radius:5px}
  label:hover{background:#1e2636}
  label input{accent-color:var(--gold);width:14px;height:14px}
  label .n{flex:1}
  label .why{font-size:10px;color:var(--dim);display:block;padding:0 2px 6px 23px;line-height:1.45}
  .lg{display:flex;align-items:center;gap:6px;font-size:11px;padding:4px 2px;border-bottom:1px solid #1e2636}
  .lg b{width:56px;color:var(--gold)}
  .lg span{flex:1}
  .lg i{font-style:normal;font-size:10px;color:var(--dim)}
  #fps{position:absolute;top:8px;left:10px;font-size:11px;color:var(--dim);
    background:#0009;padding:3px 7px;border-radius:5px}
  #hint{position:absolute;bottom:8px;left:10px;font-size:11px;color:var(--dim);
    background:#0009;padding:4px 8px;border-radius:5px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="fps">—</div>
    <div id="hint">클릭 = 전원 스킬 / 스페이스 = 일시정지</div>
  </div>
  <div id="side">
    <h1>전투 연출 데모</h1>
    <div class="sub">
      기존 2D 에셋 그대로. 아트 추가 없이 코드만으로 얼마나 올라가는지 비교용.
    </div>
    <div class="preset">
      <button id="p_min">트랜스폼만</button>
      <button id="p_full" class="on">전체</button>
    </div>
    <div class="grp">프레임 캡</div>
    <div class="preset" id="caps">
      <button data-fps="30">30</button>
      <button data-fps="60" class="on">60</button>
      <button data-fps="0">무제한</button>
    </div>
    <div id="opts"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script type="module" src="./src/demo.js"></script>
</body>
</html>
