<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>냥냥 용병단</title>
<link rel="stylesheet" href="/assets/font/fonts.css">
<style>
  :root{
    /* ── 리스킨 v2 (2026-08-23) ───────────────────────────────────
       전 버전은 차가운 청회색(#0e131c 계열)이었다. 게임은 초원·냥이·나무 방패의
       따뜻한 판타지인데 UI 는 SF 대시보드 색이라 그림과 화면이 따로 놀았다.
       기준을 **따뜻한 갈색 목재 + 황동**으로 옮긴다. 구조·레이아웃은 그대로다 —
       토큰 값만 갈면 전 화면이 같이 바뀐다 (그래서 색을 토큰으로 모아 둔 것이다). */
    --bg:#1a1410; --panel:#2a2018; --panel2:#3a2c20; --line:#5a4632;
    --txt:#f5ecdc; --dim:#b09a7e; --gold:#ffc94a; --dia:#5ad8ff; --ore:#ff8a4a;
    --up:#7fd86a; --warn:#ff6b5a;
    /* 파생 토큰 — 아래 셋이 화면의 실질 표면색이다. 하드코딩 51종을 이 셋으로
       정규화했다 (2026-08-23). 새 카드·칸을 만들 때도 이걸 쓴다:
         --card  일반 카드·칸 바탕      --ink  깊은 바탕(캡슐·게이지 홈)
         --ink2  카드 안의 한 단계 깊은 칸 */
    --card:#33261b; --ink:#150f0b; --ink2:#241a12;
    /* 강조 라인 — 황동. 카드 위쪽 하이라이트와 활성 테두리에 쓴다 */
    --brass:#c9a227;
  }
  /* 텍스트 선택·이미지 끌기 차단. 모바일에서 길게 누르면 UI 가 잡혀 끌린다 */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
  button img,#fgObj img{pointer-events:none}
  input,textarea{-webkit-user-select:text;user-select:text}

  /* 숫자는 전부 굵은 디스플레이체(Black Han Sans) — Jua 는 굵기가 하나뿐이라
     힘이 안 실린다. **수량·전투력·가격처럼 "읽고 비교하는 숫자"가 대상**이고,
     문장 안 숫자는 본문체 그대로다. tabular-nums 로 자릿수가 흔들리지 않게 한다 */
  #cp,#timer,#stgNum,.q-prog,#idGold,.er-card .er-d,.er-card b,
  .cur b,#caplv,.gain,.rk-sc,.al-sum b,.al-mem-c,.at-cell em,.at-cum em,
  .sh-price,.sh-cur b,#fgLv,.tw-rw,#bootTitle,#pvGold,#wallNeed,#wallMy{
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400;
    font-variant-numeric:tabular-nums;letter-spacing:.3px}
  html,body{margin:0;height:100%;background:#0f0b08;color:var(--txt);overflow:hidden;
    font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}

  /* 스킬 아이콘 — 22종 중 14종이 **투명 배경 없이 사각 통짜**로 생성됐다.
     **에셋은 전부 원형으로 정리됐다** (사각 14종을 원형으로 클립, 2026-08-22).
     그래서 페이드를 82% 에서 99% 로 좁혔다 — 옛 값은 정상 아이콘의 바깥 18% 까지
     같이 흐려서 아이콘이 실제보다 작아 보였다.
     규칙 자체는 남긴다. 새로 뽑은 아이콘이 또 사각으로 나와도 모서리만 잘리고
     원형 디스크는 그대로 통과한다 — 안전망이 공짜다. */
  img[src*="/skill/"]{
    -webkit-mask-image:radial-gradient(circle closest-side,#000 99%,#0000 100%);
    mask-image:radial-gradient(circle closest-side,#000 99%,#0000 100%)}

  /* 스크롤바 — 전역으로 감춘다.
     OS 기본 스크롤바는 회색 각진 막대라 어느 화면에 떠도 판타지 UI 킷과 안 맞고,
     세로형 모바일 게임이라 실제로는 손가락으로 미는 것이 전제다. 스크롤은 그대로
     되고 막대만 안 보인다. **새 스크롤 영역을 만들 때 여기 규칙을 따른다** —
     개별 화면에서 다시 노출시키지 않는다. */
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{width:0;height:0;display:none}
  /* container 선언 — 아래 좁은화면 규칙이 뷰포트가 아니라 **앱 폭**을 본다 */
  #app{container:app / inline-size;
    position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;
    background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

  /* 상단 12% */
  #top{flex:0 0 10%;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;justify-content:center;padding:6px 10px;gap:5px}
  .row{display:flex;align-items:center;gap:8px}
  #cap{width:36px;height:36px;border-radius:50%;background:#2b3854;object-fit:cover;
    border:2px solid var(--gold)}
  #cp{font-weight:800;font-size:18px;color:var(--gold);line-height:1}
  .sub{font-size:11px;color:var(--dim)}
  /* 재화 캡슐 — 아이콘이 왼쪽에 겹쳐 올라탄 어두운 pill. 숫자가 판 위에 앉는다 */
  .cur{display:flex;align-items:center;gap:0;font-size:12px;color:var(--dim);
    background:#0b0f17c8;border:1px solid #ffffff1c;border-radius:12px;
    padding:2px 10px 2px 2px;box-shadow:inset 0 1px 3px #0008}
  .cur b{color:var(--txt);font-weight:800;margin-left:4px;
    font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
  /* [+] — 재화에서 상점으로 가는 지름길. 키우기 장르 공통 문법 */
  #diaPlus,#goldPlus{width:16px;height:16px;margin-left:6px;padding:0;border-radius:50%;
    border:none;background:linear-gradient(#5ad86a,#2c8a3c);color:#fff;
    font-size:13px;font-weight:900;line-height:15px;cursor:pointer;
    box-shadow:0 1px 3px #0009}
  #diaPlus:active,#goldPlus:active{transform:scale(.9)}
  #goldPlus{background:linear-gradient(#ffd76a,#e8a72c);color:#2a1c05}
  .dot{width:9px;height:9px;border-radius:50%}
  .cui{width:17px;height:17px;object-fit:contain}

  /* 전투 40% */
  #battle{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:#1e1710}
  #cv{display:block;width:100%;height:100%}
  #hud{position:absolute;inset:0;pointer-events:none;padding:6px 9px;
    display:flex;flex-direction:column;justify-content:space-between}
  #hudTop{display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 1px 3px #000}
  /* 진행도는 상단 중앙. 좌우 칸이 같은 폭이라야 가운데가 진짜 가운데다 */
  .hudSide{flex:1 1 0;min-width:0}
  #hudC{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px}
  #hudC #stg{justify-content:center}
  #stg{font-size:13px;font-weight:800;display:flex;align-items:baseline;gap:6px}
  #stg i{font-style:normal;font-size:10px;font-weight:600;color:#cfe0ff;opacity:.85}
  #enc{display:flex;gap:5px;margin-top:2px;justify-content:center}
  /* 지금 진행 중인 조우 위에 작은 화살표. 점만 있으면 "몇 번째를 하는 중"이
     안 읽힌다 — 지나온 것과 남은 것 사이 경계가 보여야 한다 */
  #enc .dotw{position:relative}
  /* 화살표는 점 **가운데** 위에 선다. margin 으로 중앙을 잡고 transform 은
     애니메이션에만 쓴다 — 둘을 섞으면 keyframes 가 정렬을 덮어써서 옆으로 밀린다 */
  #enc .dotw.now::before{content:'▾';position:absolute;left:0;right:0;top:-9px;
    text-align:center;font-size:8px;line-height:1;color:var(--gold);
    text-shadow:0 1px 2px #000;animation:encBob .9s ease-in-out infinite}
  @keyframes encBob{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
  /* 보스에 진 뒤의 잡몹 반복 — 진행도 점은 의미가 없다(보스로 안 가니까).
     점을 감추고 도는 화살표로 "루프 중"임을 말한다. */
  #farmLoop{display:none;align-items:center;justify-content:center;gap:5px;margin-top:2px;
    font-size:10px;font-weight:800;color:#ffd76a;text-shadow:0 1px 3px #000}
  #farmLoop i{font-style:normal;font-size:13px;line-height:1;
    display:inline-block;animation:farmSpin 1.3s linear infinite}
  @keyframes farmSpin{to{transform:rotate(360deg)}}
  #hudC.farm #enc{display:none}
  #hudC.farm #farmLoop{display:flex}
  .dotw{width:9px;height:9px;border-radius:50%;background:#4a5670;border:1px solid #0007}
  .dotw.on{background:var(--gold)}
  .dotw.boss{width:12px;height:12px;background:#6a3040}
  .dotw.boss.on{background:var(--warn)}
  /* 배속은 전투 패널 우상단, 상단 UI 에 붙인다 (사용자 요청) */
  #speed{position:absolute;top:4px;right:6px;z-index:21;pointer-events:auto}
  #timer{margin-top:34px;font-size:22px;font-weight:900;letter-spacing:1px}
  #timer.low{color:var(--warn)}
  #hudBot{display:flex;justify-content:space-between;align-items:flex-end}
  #speed{display:flex;gap:4px;pointer-events:auto;margin-top:5px;justify-content:flex-end}
  .sbtn{background:#0009;border:1px solid var(--line);color:var(--txt);border-radius:6px;
    padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer}
  .sbtn.on{background:var(--gold);color:#000;border-color:var(--gold)}
  /* 출석 — 7일 격자 + 월 누적 줄 */
  /* 전직 줄 — 훈련소 화면 하단 */
  .pm-row{display:flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:6px}
  .pm-t{flex:1;min-width:0}
  .pm-t b{display:block;font-size:13px}
  /* 안내 줄이 좁은 화면에서 "…Lv" / "40" 처럼 접히던 것 — 낱말 유지 + 말줄임 */
  .pm-t i{display:block;font-style:normal;font-size:10px;color:var(--dim);margin-top:1px;
    word-break:keep-all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pm-m{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--gold);
    font-family:"Black Han Sans","Jua",system-ui,sans-serif}
  .pm-row button{flex:0 0 84px;min-height:32px;font-size:11px}

  .at-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
  .at-cell{position:relative;background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:7px 6px;text-align:center;min-height:64px}
  .at-cell b{display:block;font-size:10px;margin-bottom:3px;color:var(--dim)}
  .at-cell em{display:flex;align-items:center;justify-content:center;gap:3px;
    font-style:normal;font-size:11px;font-weight:800;color:#ffe9a8;margin-top:2px}
  .at-cell em img{width:22px;height:22px;object-fit:contain;
    filter:drop-shadow(0 2px 4px #0008)}
  .at-cell.done{opacity:.55}
  .at-cell.done i{position:absolute;right:5px;top:4px;font-style:normal;color:#8cf59a}
  .at-cell.now{border-color:var(--gold);box-shadow:0 0 8px -2px var(--gold)}
  .at-cell.hi{background:linear-gradient(140deg,#2a2412,var(--card) 70%)}
  .at-cum{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:6px 10px;margin-bottom:6px;font-size:11px}
  .at-cum span:first-child{flex:0 0 44px;font-weight:800}
  .at-cum em{display:flex;align-items:center;gap:3px;font-style:normal;font-weight:800;
    color:#ffe9a8;margin-right:6px}
  .at-cum em img{width:19px;height:19px;object-fit:contain}
  .at-cum button{min-height:30px;font-size:11px;flex:0 0 62px;margin-left:auto}
  .at-cum.done{opacity:.55}

  /* ── 부트 로딩 ── */
  #boot{position:fixed;inset:0;z-index:210;display:flex;flex-direction:column;
    align-items:center;
    background:url(/assets/bg/BG-01.png) center/cover}
  /* 배경 그림 위에 어둑한 비네트 — 타이틀이 그림을 이긴다 */
  #boot::before{content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 34%,#150f0b22,#150f0bcc 78%)}
  #boot.hide{opacity:0;pointer-events:none;transition:opacity .4s}
  #bootMain{position:relative;flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px}
  #bootCap{width:150px;filter:drop-shadow(0 12px 30px #000c);
    animation:pvBob 2.6s ease-in-out infinite}
  #bootTitle{font-size:34px;font-weight:900;color:var(--gold);letter-spacing:2px;
    text-shadow:0 3px 0 #7a4a00, 0 6px 14px #000c, 0 0 30px #ffc94a66}
  #bootSub{font-size:10px;letter-spacing:5px;color:#dbe4f2aa;
    text-shadow:0 1px 3px #000}
  #bootBottom{position:relative;flex:0 0 auto;width:100%;display:flex;
    flex-direction:column;align-items:center;gap:7px;padding:0 26px 34px}
  #bootBar{width:100%;max-width:340px;height:12px;background:#0b0f17cc;
    border:1px solid #3a2c12;border-radius:7px;overflow:hidden;
    box-shadow:inset 0 2px 4px #000a}
  #bootFill{display:block;height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#b8860b,var(--gold) 60%,#ffe9a8);
    box-shadow:0 0 10px #ffc94a88;transition:width .3s}
  #bootMsg{font-size:11px;color:#e8d9b0;text-shadow:0 1px 3px #000}
  /* 언어 선택 — 진행이 끝나면 첫 실행에만 뜬다 */
  #bootLang{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:none;flex-direction:column;gap:7px;align-items:center;
    background:var(--card)f2;border:1px solid var(--gold);border-radius:14px;
    padding:16px 22px;box-shadow:0 16px 50px #000c;z-index:2}
  #bootLang.show{display:flex}
  #bootLang>b{font-size:13px}
  #bootLangBtns{display:flex;flex-direction:column;gap:7px}
  #bootLang button{width:170px;padding:9px 0;font:inherit;font-size:13px;font-weight:800;
    background:var(--ink2);border:1px solid #6b543a;border-radius:9px;color:var(--txt);
    cursor:pointer}
  #bootLang button:active{transform:translateY(1px)}
  #bootLang>span{font-size:9px;color:var(--dim)}

  /* 절전 덮개 — AOD 풍. 새카만 바탕에 시계·달만 */
  /* 완전 불투명 검정 — OLED 에서 검은 픽셀은 꺼진 픽셀이다. 캔버스도
     stage.visible=false 로 안 그린다 (scene.setPowerSave) */
  #pwrveil{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:7px;background:#000;
    touch-action:none}
  #pwrveil.show{display:flex}
  /* 자는 단장. **정지 이미지 한 장**이다 — 캔버스는 stage.visible=false 로
     꺼져 있고, 여기서 스프라이트를 돌리면 절전이 절전이 아니게 된다.
     움직이는 것은 transform 과 opacity 뿐이라 컴포지터가 처리하고 리페인트가 없다 */
  .pv-cat{position:relative;width:132px;height:132px;display:flex;
    align-items:flex-end;justify-content:center;margin-bottom:2px}
  /* 달빛 — 이미지가 아니라 정지 그라디언트다. 애니메이션을 걸면 매 프레임
     다시 칠해야 해서 OLED 에서 검은 픽셀을 꺼 두는 이득이 사라진다 */
  .pv-cat::before{content:"";position:absolute;left:50%;top:-6px;
    width:150px;height:150px;transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(circle,#1b2436 0%,transparent 70%)}
  .pv-cat img{width:118px;height:auto;object-fit:contain;opacity:.72;
    filter:grayscale(.35) brightness(.78);
    animation:pvBreathe 5.4s ease-in-out infinite}
  @keyframes pvBreathe{0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-4px) scale(1.015)}}
  /* 전용 취침 에셋(captain_sleep)이 없어 전투 포즈로 떨어졌을 때만 기울인다.
     조는 자세로라도 읽히게 하는 대역이고, 에셋이 들어오면 저절로 안 걸린다 */
  .pv-cat img.fallback{animation-name:pvBreatheTilt}
  @keyframes pvBreatheTilt{0%,100%{transform:rotate(7deg) translateY(0) scale(1)}
    50%{transform:rotate(7deg) translateY(-4px) scale(1.015)}}
  .pv-z{position:absolute;right:6px;top:4px;display:flex;align-items:flex-start;gap:2px}
  .pv-z i{font-style:normal;font-weight:800;color:#7d8ba8;opacity:0;
    animation:pvZ 3.6s ease-in-out infinite}
  .pv-z i:nth-child(1){font-size:11px;animation-delay:0s}
  .pv-z i:nth-child(2){font-size:14px;animation-delay:.5s}
  .pv-z i:nth-child(3){font-size:18px;animation-delay:1s}
  @keyframes pvZ{0%{opacity:0;transform:translateY(6px)}
    25%{opacity:.85}60%{opacity:.5}100%{opacity:0;transform:translateY(-16px)}}
  @media (prefers-reduced-motion:reduce){
    .pv-cat img,.pv-z i{animation:none}
    .pv-z i{opacity:.55}
  }
  .pv-clock{font-size:34px;font-weight:200;letter-spacing:3px;color:#dbe4f2}
  #pwrveil b{font-size:13px;color:#8b98ad;font-weight:700}
  #pwrveil>span{font-size:11px;color:#556077}
  .pv-stats{display:flex;gap:14px;font-size:11px;color:#66738c;margin-top:2px}
  /* 밀어서 해제 트랙 */
  #pvTrack{position:relative;width:200px;height:44px;margin-top:16px;border-radius:22px;
    background:var(--ink2);border:1px solid var(--line);overflow:hidden}
  #pvTrack i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-style:normal;font-size:11px;color:#556077;letter-spacing:1px;
    animation:pvHint 2.2s ease-in-out infinite}
  @keyframes pvHint{0%,100%{opacity:.45}50%{opacity:.95}}
  #pvHandle{position:absolute;left:3px;top:3px;width:38px;height:38px;border-radius:50%;
    background:#3a2c20;border:1px solid #6b543a;display:flex;align-items:center;
    justify-content:center;font-size:16px;cursor:grab;z-index:2;
    transition:left .18s ease;touch-action:none}
  #pvHandle.drag{transition:none;cursor:grabbing}
  #pwrSave.on{background:#2b3650;border-color:#7d8ba8;color:var(--txt)}

  /* 잠긴 배속 — 숨기지 않는다. 안 보이면 해금이 보상으로 안 읽힌다 */
  .sbtn.lock{opacity:.45;border-style:dashed}
  .sbtn.lock::after{content:'🔒';font-size:9px;margin-left:3px}

  /* 월드 — 뷰포트보다 크다. 카메라(updateCamera)가 transform 으로 민다.
     배경은 월드에 깐다 — 카메라와 같이 움직여야 마을이 "넓다"로 읽힌다 */
  /* AL-BG 가 세로형(1024x1536)이라 월드도 세로로 길다. cover 로 꽉 채운다 */
  #alWorld{position:absolute;left:0;top:0;width:150%;height:175%;

  /* 하늘과 땅을 가르는 어둑한 그라데 — 건물·글자가 배경에서 분리된다 */
  #alField::before{content:"";position:absolute;inset:0;

  /* 길·광장·덤불은 AL-BG 배경에 그려져 있다 — CSS 로 덧그리지 않는다 */

  /* 건물 — 마을의 주인공이라 크게. big 은 뒷줄 랜드마크 */
  .al-bd{position:absolute;width:158px;text-align:center;cursor:pointer;
    filter:drop-shadow(0 10px 22px #000b)}
  .al-bd img{width:152px;height:152px;object-fit:contain;pointer-events:none}
  .al-bd.big{width:200px}
  .al-bd.big img{width:196px;height:196px}
  .al-bd b{display:block;font-size:11px;background:#0b0f17d8;border:1px solid #ffffff22;
    border-radius:8px;padding:3px 0;margin-top:-10px;position:relative}
  /* 건물 발밑 접지 그림자 — 배경에 붙어 보인다 */
  .al-bd::after{content:"";position:absolute;left:12%;right:12%;bottom:14px;height:12px;
    border-radius:50%;background:#00000038;z-index:-1}
  .al-bd:active{transform:scale(.96)}
  #alCap{position:absolute;width:62px;margin-left:-31px;pointer-events:none;
    filter:drop-shadow(0 4px 8px #0009)}
  #alCap img{width:100%;display:block}
  #alCap.flip img{transform:scaleX(-1)}
  #alCap.walk img{animation:alWalk .34s ease-in-out infinite}
  @keyframes alWalk{0%,100%{transform:translateY(0) scaleX(var(--fx,1))}
    50%{transform:translateY(-5px) scaleX(var(--fx,1))}}
  #alCap.walk.flip img{--fx:-1}
  #alCap.flip img{transform:scaleX(-1)}
  .al-bot{position:absolute;width:40px;margin-left:-20px;pointer-events:none;opacity:.92}
  .al-bot img{width:100%;display:block}
  .al-bot.flip img{transform:scaleX(-1)}
  .al-bot i{display:block;font-style:normal;font-size:8px;text-align:center;
    color:#dbe4f2;text-shadow:0 1px 3px #000;margin-top:-3px}
  #alDemoNote{position:absolute;right:8px;bottom:6px;font-size:9px;color:#ffffff77;
    pointer-events:none}

  /* 연합 홈 — 길드 카드 */
  .al-hero{display:flex;gap:11px;align-items:center;background:var(--card);

  /* 소환 레벨 창 — 상점(z70) 위 */
  #smPop{position:absolute;inset:0;z-index:74;display:none;align-items:center;
    justify-content:center;background:#060a12c8;padding:16px}

  .er-card img{width:52px;height:52px;object-fit:contain}
  .er-card b{display:block;font-size:13px;font-weight:900;margin-top:3px}
  .er-card .er-cp{font-size:11px;color:var(--dim);margin-top:3px}
  .er-card .er-cp em{font-style:normal;font-weight:900}
  .er-card .er-cp img{width:13px;height:13px;object-fit:contain;vertical-align:-2px;margin-right:2px}
  .er-d{font-size:14px;font-weight:900;margin-top:4px;letter-spacing:.3px}
  .er-card.up{border-color:var(--up);box-shadow:0 0 14px #5ad86a33}
  .er-card.down{opacity:.72}
  .er-vs{align-self:center;font-size:11px;font-weight:900;color:var(--dim);flex:0 0 auto}
  .er-pick{width:100%;margin-top:6px;border-radius:8px;padding:8px;font-size:11px;
    font-weight:800;cursor:pointer;font-family:inherit;border:1px solid #4a6fc0;
    background:linear-gradient(#3c5ea8,#2c4680);color:var(--txt)}
  .er-pick.scrap{background:var(--panel2);border-color:var(--line);color:var(--dim)}
  .er-note{font-size:10px;color:var(--dim);text-align:center;margin-top:9px;line-height:1.5}

  /* 제작대 도크 — 인벤토리 아래 가운데. 탭이 곧 소환이다 */
  /* 제작대 줄 — 왼쪽 퀘스트 / 오른쪽 제작대. 둘 다 "지금 할 일"이다 */
  /* 제작대는 **원래 자리(가운데)** 그대로다. 퀘스트는 그 왼쪽 빈 공간에
     절대배치로 얹는다 — 흐름에 넣으면 제작대가 오른쪽으로 밀린다 */
  #fgRow{position:relative;margin-top:auto;padding:4px 2px 12px}
  #fgDock{position:relative;display:flex;flex-direction:column;align-items:center}
  #fgObj{border:none;background:none;padding:0;cursor:pointer;position:relative;
    width:104px;height:74px;transition:transform .12s}
  #foAnim{filter:drop-shadow(0 4px 10px #000a) drop-shadow(0 0 14px #ffb04a55)}
  #fgObj:active{transform:translateY(2px) scale(.97)}
  @keyframes fgBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  /* 보유 소환권 — 제작대 그림 아래에 겹쳐 붙는다 */
  #fgTicket{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);z-index:3;
    display:flex;align-items:center;gap:5px;padding:3px 12px;min-width:74px;
    justify-content:center;border-radius:13px;
    background:var(--ink)e8;border:1px solid var(--gold);box-shadow:0 2px 8px #000a}
  #fgTicket .tk-bg{position:absolute;inset:0;width:100%;height:100%;
    object-fit:fill;border-radius:13px}
  #fgTicket .tk-ic{position:relative;width:15px;height:15px;object-fit:contain}
  #fgTicket b{position:relative;font-size:12px;font-weight:900;color:var(--gold)}
  /* UI-PILL 이 들어오면 CSS 배경을 지우고 그림만 쓴다 */
  #fgTicket:has(.tk-bg){background:none;border:none;box-shadow:none}


  /* 1단계 — 4프레임 시트 재생. 프레임: 들림 / 45° / 타격+불똥 / 휴지.
     bg-size 400% 에서 프레임 위치는 0 / 33.334 / 66.667 / 100% 다
     (백분율 배치는 이미지의 p% 를 컨테이너의 p% 에 맞추는 규칙이라 이렇게 나온다).
     평소에는 마지막 프레임(휴지)을 그대로 보여 준다 — 정지 화면이 곧 4번 프레임이라
     연출이 끝나도 튀지 않는다. */
  /* 스트립은 renderForgeDock 이 단계에 맞춰 --strip 으로 끼운다 */
  #foAnim{position:absolute;inset:0;pointer-events:none;
    background:var(--strip,url(/assets/ui/FO-01-STRIP.png)) 100% 0/400% 100% no-repeat}
  #fgObj.ready #foAnim{animation:fgBob 1.5s ease-in-out infinite}
  #fgObj.empty #foAnim{filter:grayscale(.7) brightness(.65)}
  /* 자동이 잡아 둔 장비가 있다 — 모루가 금빛으로 맥동한다.
     창을 띄워 화면을 가로채는 대신 여기만 빛내고 유저가 누를 때 보여 준다 */
  #fgObj.pend #foAnim{filter:drop-shadow(0 0 6px var(--gold)) drop-shadow(0 0 14px #ffd76a88);
    animation:fgPend 1.25s ease-in-out infinite}
  @keyframes fgPend{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #fgObj.pend::after{content:"";position:absolute;right:2px;top:2px;width:9px;height:9px;
    border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);z-index:4;
    animation:fgPendDot 1.25s ease-in-out infinite}
  @keyframes fgPendDot{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    #fgObj.pend #foAnim,#fgObj.pend::after{animation:none}
  }
  /* 재생: 들림(0~20%) → 낙하(→42%) → 타격 유지(→78%) → 휴지.
     42% = 0.244s — 불똥(fgSpk .25s)·모루 눌림(fgShake 42%)과 맞물린다. */
  @keyframes foPlay{
    0%,20%{background-position:0 0}
    20.1%,42%{background-position:33.334% 0}
    42.1%,78%{background-position:66.667% 0}
    78.1%,100%{background-position:100% 0}}
  #fgSpark{position:absolute;left:50%;top:52%;width:8px;height:8px;margin:-4px 0 0 -4px;
    border-radius:50%;opacity:0;pointer-events:none;z-index:3;
    background:radial-gradient(circle,#fff,#ffd76a 40%,#ff8a2a00 70%)}
  #fgObj.hit #fgSpark{animation:fgSpk .4s ease-out .25s both}
  @keyframes fgSpk{0%{opacity:0;transform:scale(.3)}
    30%{opacity:1;transform:scale(3.4)}100%{opacity:0;transform:scale(5.2)}}
  /* 모루가 눌렸다 튄다 */
  /* 모루 눌림 — 시트 프레임과 같은 층(foAnim)에 건다. 착지 42% 타이밍 동기 */
  #fgObj.hit #foAnim{animation:foPlay .58s linear both,
    fgShake .58s cubic-bezier(.3,1.4,.5,1) both}
  @keyframes fgShake{0%,42%{transform:none}
    50%{transform:translateY(4px) scaleY(.93) scaleX(1.05)}
    66%{transform:translateY(-2px) scaleY(1.03) scaleX(.98)}
    100%{transform:none}}

  #fgLv{position:absolute;left:calc(50% + 56px);top:10px;z-index:2;
    min-height:32px;display:flex;align-items:center;
    background:var(--ink)e6;border:1px solid var(--gold);color:var(--gold);
    border-radius:11px;padding:2px 9px;font-size:10px;font-weight:900;
    cursor:pointer;font-family:inherit}
  #fgLv.busy{border-color:var(--dia);color:var(--dia)}

  /* 자동소환 토글 — 인벤토리 라벨 줄 좌상단 */
  /* 자동 소환 — 제작대 오른쪽. 참고 화면의 AUTO 배지 자리다 */
  /* 자동 소환 — 톱니 하나로 상태를 말한다. 돌면 켜짐, 멈춰 있으면 꺼짐. */
  #b_auto{position:absolute;left:calc(50% + 58px);top:48px;z-index:3;
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    background:var(--panel2);border:1px solid var(--line);border-radius:50%;
    padding:0;cursor:pointer;font-family:inherit;color:var(--dim)}
  #b_auto img,#b_auto .gear{width:24px;height:24px;font-size:22px;line-height:24px;
    object-fit:contain;pointer-events:none;display:block;text-align:center}
  #b_auto.on{background:linear-gradient(#3f8a4f,#2c6a3c);border-color:#5ad86a;color:#fff;
    box-shadow:0 0 10px #5ad86a66}
  #b_auto.on img,#b_auto.on .gear{animation:autoSpin 2.4s linear infinite}
  @keyframes autoSpin{to{transform:rotate(360deg)}}
  #b_auto:disabled{opacity:.35;cursor:default}
  #b_auto:disabled img,#b_auto:disabled .gear{filter:grayscale(1)}

  /* 자동소환 설정 패널 */
  .as-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .as-row>span{font-size:11px;color:var(--dim);width:100%}
  .as-g{flex:1 1 auto;min-width:52px;background:var(--card);border:1px solid var(--line);
    color:var(--txt);border-radius:8px;padding:7px 4px;font-size:11px;font-weight:800;
    cursor:pointer;font-family:inherit}
  .as-g.on{border-color:var(--gold);background:#221c0c}
  .as-g:disabled{opacity:.3;cursor:default}

  /* 좌 3x2 = 해금된 장비 6부위 / 우 3x2 = 미구현 시스템. 참고작(버섯커)과 같은 독법 —
     왼쪽은 지금 내 것, 오른쪽은 앞으로 생길 것. */
  #eq{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #eqL,#eqR{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .slot{height:54px;background:var(--panel2);border:2px solid var(--line);border-radius:7px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:9px;color:var(--dim);position:relative;overflow:hidden;cursor:pointer}
  .slot b{font-size:12px;color:var(--txt);line-height:1.1}
  .slot img{width:74%;height:74%;object-fit:contain}
  .slot.up{box-shadow:0 0 0 2px var(--up) inset}
  .slot .arrow{position:absolute;top:1px;right:2px;color:var(--up);font-size:10px;font-weight:900}


  /* 던전 — 용병·스킬과 같은 시트. 던전 하나가 **한 줄**이다.
     2열 카드로 두면 이름·층·열쇠·요구 CP 가 좁은 칸에 접혀서 어디를 돌지 못 고른다.
     한 줄이면 층·열쇠가 같은 x 좌표에 세로로 정렬돼 눈이 한 번만 움직인다. */
  /* 던전 — 한 줄이 곧 **가로로 꽉 찬 배너**다. 그림을 줄 배경으로 깔고 글자를 위에
     얹는다. 작은 썸네일로는 어디로 들어가는지가 안 읽히고, 6줄이 아이콘 목록처럼
     보여 "고르는 화면"이라는 느낌이 안 난다.
     --dg-art 는 [던전 그림, 폴백 배경] 2겹이다. 던전 그림이 없으면 아래 배경이 비친다. */
  #dungeons{display:flex;flex-direction:column;gap:8px}
  .dg{position:relative;isolation:isolate;overflow:hidden;
    border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;display:flex;align-items:center;gap:11px;min-height:78px;
    font-size:10px;color:var(--dim);cursor:pointer;background:var(--panel)}
  .dg::before{content:"";position:absolute;inset:0;z-index:-2;
    background-image:var(--dg-art);background-size:cover,cover;
    background-position:center 38%,center 42%}
  /* 글자가 그림 위에서 읽히도록 왼쪽을 짙게. **오른쪽은 완전히 걷는다** —
     배너 그림이 초점을 오른쪽에 두고 그려져 있어(STEP 6-B) 거기까지 덮으면
     그림을 넣은 의미가 없다. 왼쪽은 원화 자체가 어둡게 그려져 있어서
     그라디언트를 빼도 흰 글자 대비가 9 이상 나온다 (AA 기준 4.5). */
  .dg::after{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(90deg,#070b12eb 0%,#070b12b8 40%,#070b1238 72%,#070b1200 100%)}
  .dg .nm{flex:1;min-width:0}
  .dg b{display:block;font-size:15px;color:var(--txt);font-weight:800;
    text-shadow:0 2px 5px #000d}
  .dg .why{display:block;font-size:10px;color:#c3ccdb;margin-top:3px;
    text-shadow:0 1px 4px #000d;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 층은 오른쪽 끝. 폭을 고정해야 여러 줄이 한 줄기로 정렬된다 */
  .dg .ent{flex:0 0 auto;text-align:right;font-size:15px;font-weight:900;color:var(--gold);
    text-shadow:0 2px 5px #000d}
  /* 열쇠 — 상단바 재화와 같은 알약 칩. 보유량이 곧 입장 가능 횟수다 */
  .dg .keys{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
    background:var(--ink)e0;border:1px solid var(--gold);border-radius:12px;padding:3px 9px}
  .dg .keys img{width:16px;height:16px;object-fit:contain}
  .dg .keys b{display:inline;font-size:12px;font-weight:900;color:var(--gold)}
  .dg .keys i{font-style:normal;font-size:10px;font-weight:700;color:var(--dim)}
  /* 잠긴 줄은 그림도 죽인다. 투명도만 낮추면 배너가 여전히 화려해 열린 줄과 안 갈린다 */
  .dg.lock{opacity:.62}
  .dg.lock::before{filter:grayscale(1) brightness(.5)}
  /* 잠긴 줄은 층·열쇠 대신 자물쇠 + 요구 CP 한 덩어리 */
  .dg .ent.lockv{flex:0 0 auto;color:var(--dim);font-size:11px}
  .dg .ent.lockv .lockIc{display:block;width:15px;height:15px;margin:0 0 2px auto;
    vertical-align:0}
  .dg .ent.lockv i{display:block;font-style:normal;font-size:10px;font-weight:700}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .icell.new{animation:pop .26s ease-out}

  /* 퀘스트 + 채팅 — 전투 화면 좌측 하단 */
  /* 퀘스트 — 전투 화면 좌하단 HUD */
  /* 퀘스트 배너 — 전투 화면을 가리는 물건이라 필요한 만큼만 차지한다.
     56%/200px 은 캐릭터 절반을 덮었다. */
  #bottom{position:relative}

  /* 채팅 — 하단 패널과 네비 사이 독립 바. 가로 전체를 쓴다 */
  #chat{flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:10px 12px;background:var(--ink);border-top:1px solid var(--line);
    font-size:13px;color:#b9c6dc;white-space:nowrap;overflow:hidden}
  #chat .who{flex:0 0 auto;color:var(--gold);font-weight:800;font-size:12px;
    background:#1a2233;border:1px solid var(--line);border-radius:7px;padding:3px 8px}
  #chat #chatline{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis}
  /* 퀘스트 — 제작대 왼쪽. 전투 영역의 얇은 띠가 아니라 **카드**다.
     세로로 [이름/진행] → [게이지] → [보상] 을 쌓아 한눈에 읽힌다 */
  /* 제작대(가운데 104px) 왼쪽 여백. 카드 안에 [이름] [진행] [게이지] [보상]이
     전부 들어가야 한다 — 하나라도 빠지면 "뭘 하는 퀘스트인지"가 안 읽힌다 */
  #quest{position:absolute;left:6px;top:50%;transform:translateY(-50%);
    width:calc(50% - 62px);background:var(--card);
    border:1px solid var(--line);border-radius:11px;
    padding:7px 9px;display:flex;flex-direction:column;justify-content:center;gap:5px;
    font-size:10px;cursor:pointer;pointer-events:auto;z-index:4}
  /* 이름은 두 줄까지 허용한다 — "Q14 용병 소환" 이 한 줄에 안 들어가면
     말줄임으로 잘려서 무슨 퀘스트인지 사라진다 */
  #qtop{display:flex;align-items:baseline;gap:5px}
  #qname{color:var(--txt);font-size:10px;font-weight:800;flex:1;min-width:0;
    line-height:1.25;word-break:keep-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #qprog{color:var(--gold);flex:0 0 auto;font-size:11px;font-weight:800;
    font-family:"Black Han Sans","Jua",system-ui,sans-serif}
  #qbar{height:5px;background:#0007;border-radius:3px;overflow:hidden;width:100%;margin:0}
  /* 완료 — 카드가 금색으로 반짝인다. 받으라는 신호가 화면에서 가장 세야 한다 */
  #quest.done{border-color:var(--gold);background:linear-gradient(160deg,#3a2c12,var(--card) 70%);
    animation:qDone 1.15s ease-in-out infinite}
  #quest.done #qname{color:var(--gold)}
  /* 완료했으면 게이지는 뺀다 — 다 찬 막대는 정보가 0 이고 보상 아이콘만 남으면
     "받아라"가 더 또렷해진다 */
  #quest.done #qbar{display:none}
  /* 완료 배지가 넓어지면 이름 자리가 줄어 잘린다 — 완료 시엔 이름/배지를
     위아래로 쌓아 각자 한 줄을 다 쓰게 한다 */
  #quest.done #qtop{flex-direction:column;align-items:stretch;gap:3px}
  #quest.done #qprog{background:var(--gold);color:#2a1c05;text-align:center;
    border-radius:6px;padding:2px 7px;font-size:10px}
  @keyframes qDone{0%,100%{box-shadow:0 0 0 0 #ffc94a00}
    50%{box-shadow:0 0 14px 2px #ffc94a66}}
  #qfill{height:100%;width:0;background:linear-gradient(90deg,#4a6fc0,#5ad8ff)}
  /* 보상 칩 — 아이콘 위에 개수를 얹는다. 가로가 좁아 글자를 옆에 못 둔다 */
  /* 보상 — 카드 안에서 줄바꿈된다. 넘치면 감추지 말고 접어서 다 보여준다 */
  #qrw{display:flex;gap:5px;flex:0 0 auto;align-items:center;flex-wrap:wrap}
  #qrw span{position:relative;width:21px;height:21px;flex:0 0 auto}
  #qrw img{width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 1px 2px #000a)}
  #qrw b{position:absolute;right:-3px;bottom:-3px;font-size:8px;font-weight:400;
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;color:#fff;
    text-shadow:0 0 3px #000,0 1px 2px #000,-1px 0 2px #000,1px 0 2px #000}

  /* 액션 */
  #acts{display:grid;grid-template-columns:1fr 1fr 1fr 52px;gap:5px;margin-top:auto}
  .act{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;
    padding:8px 2px;font-size:11px;font-weight:700;cursor:pointer;position:relative}
  .act.primary{background:linear-gradient(#3c5ea8,#2c4680);border-color:#4a6fc0}
  .act.on{background:var(--gold);color:#000;border-color:var(--gold)}
  .act:disabled{opacity:.4}
  #b_forge{font-size:20px;padding:4px;transition:box-shadow .2s}
  @keyframes forgeGlow{
    0%,100%{box-shadow:0 0 0 0 #5ad86a00,0 0 8px 0 #5ad86a55}
    50%{box-shadow:0 0 0 2px #5ad86a88,0 0 18px 3px #5ad86a99}
  }
  #b_forge.ready{animation:forgeGlow 1.1s ease-in-out infinite;border-color:var(--up)}
  .badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;
    background:var(--warn);color:#fff;font-size:10px;line-height:17px;text-align:center;padding:0 4px;
    font-weight:800}

  /* 네비 8% */
  #nav{flex:0 0 8%;display:grid;grid-template-columns:repeat(5,1fr);
    background:#241a12;border-top:1px solid var(--line)}
  /* 아이콘 위 · 글자 아래. 아이콘이 없으면(onerror 로 제거) 글자만 가운데 남는다 */
  /* 아이콘을 네비 높이가 허용하는 만큼 키운다. 글자는 이름표 역할만 하므로
     아이콘이 주인공이고 글자는 그 아래 작게 붙는다. */
  .nv{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:0;font-size:9px;color:var(--dim);cursor:pointer;position:relative;overflow:hidden}
  .nv img{width:min(44px,10.5vw);height:min(44px,10.5vw);object-fit:contain;
    margin-bottom:-1px;
    filter:grayscale(.5) brightness(.8);opacity:.82;
    transition:filter .12s,opacity .12s,transform .12s}
  .nv.on{color:var(--gold)}

  /* 오버레이 — 화면을 다 덮지 않는다. 가운데 카드만 띄운다 */
  /* .over-alli — 연합 마을(fullscr z70) 위에서 열릴 때만 붙는다. 안 붙이면
     패널이 마을 뒤에 깔려 "눌렀는데 아무 일도 없다"가 된다 (실제로 그랬다) */
  #ov.over-alli{z-index:82}
  #ov{position:absolute;inset:0;z-index:60;background:#060a12b0;display:none;
    align-items:center;justify-content:center;padding:16px}
  #ov.show{display:flex;animation:ovDim .18s ease-out}
  #ov.show #ovcard{animation:ovPop .18s ease-out}
  @keyframes ovDim{from{background:#060a1200}}
  @keyframes ovPop{from{transform:scale(.94);opacity:.4}}
  #ovcard{width:100%;max-width:330px;max-height:76%;background:var(--bg);
    border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px #000a;
    display:flex;flex-direction:column;overflow:hidden}
  #ovh{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  #ovt{font-size:15px;font-weight:800;flex:1}
  #ovi{background:none;border:1px solid var(--line);color:var(--dim);border-radius:50%;
    width:26px;height:26px;font-size:13px;font-weight:800;cursor:pointer;padding:0}
  #ovi.on{border-color:var(--gold);color:var(--gold)}
  #ovx{background:none;border:1px solid var(--line);color:var(--txt);border-radius:6px;
    padding:4px 10px;cursor:pointer;font-size:12px}
  #ovb{flex:1;overflow-y:auto;overflow-x:hidden;font-size:13px;padding:12px}
  /* 훈장 상점 — 아레나 화면 안의 작은 아이콘. 버는 곳과 쓰는 곳을 붙여 둔다 */
  #aShop{width:22px;height:22px;margin-left:6px;padding:0;vertical-align:-5px;
    background:var(--ink);border:1px solid var(--gold);border-radius:6px;cursor:pointer;
    font-size:12px;line-height:1;color:var(--gold)}
  #aShop img{width:14px;height:14px;object-fit:contain;display:block;margin:auto}
  #aShop:active{transform:translateY(1px)}
  .mdBuy{min-width:66px;padding:6px 10px;border-radius:8px;cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:800;color:#1a1408;
    background:linear-gradient(180deg,#ffd76a,#e8a72c);border:1px solid #ffe9a8}
  .mdBuy.off{background:#232c3c;border-color:var(--line);color:var(--dim)}
  .mdBack{width:100%;margin-top:12px;padding:10px;border-radius:9px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);color:var(--dim);
    font-family:inherit;font-size:12px}
  #ovinfo{display:none;border-top:1px solid var(--line);padding:10px 12px;
    max-height:44%;overflow-y:auto;background:var(--ink)}
  #ovinfo.show{display:block}
  .frow{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .frow .k{color:var(--dim);font-size:12px}
  .frow .v{font-weight:800;display:flex;align-items:center;gap:5px}
  .frow .v img{width:16px;height:16px;object-fit:contain}

  /* 제작대 화면 */
  #fgHero{position:relative;display:flex;flex-direction:column;align-items:center;
    padding:6px 0 10px}
  #fgHero > img{width:82%;max-width:190px;object-fit:contain;border-radius:10px;
    filter:drop-shadow(0 6px 18px #ff8a4a55);cursor:pointer;transition:transform .1s}
  #fgHero > img:active{transform:scale(.96)}
  #fgTap{margin-top:6px;font-size:11px;font-weight:800;color:var(--gold);
    display:flex;align-items:center;gap:4px}
  #fgTap img{width:14px;height:14px}
  /* 제작대 확률창 — 한 번에 한 레벨만 보여 주고 ‹ › 로 넘긴다.
     화살표는 flex 로 자리를 잡는다. 절대배치로 얹으면 좁은 화면에서 글자를 밟는다 */
  /* 제작대 소환 버튼 두 개. 그리드라 글자 길이가 달라도 폭이 안 흔들린다 */
  /* 절전 버튼 — 그림이 없으면 이모지로 떨어진다 */
  #pwrSave img{display:block;width:20px;height:20px;object-fit:contain;margin:0 auto;
    filter:drop-shadow(0 1px 2px #000a)}

  /* ── 임무(일일·주간) ──
     참고한 방치형들의 배치를 따른다: 위에 포인트 게이지와 보상 상자, 아래 퀘스트 줄.
     상자를 게이지 위 제 위치에 얹어야 "얼마 남았나"가 한눈에 읽힌다 */
  .mq-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .mq-t{font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;padding:8px 0;
    color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:9px}
  .mq-t.on{color:#2a1c05;background:linear-gradient(180deg,#ffd76a,#e8a72c);
    border-color:var(--gold)}
  .mq-track{position:relative;height:34px;margin:0 16px 2px}
  .mq-gauge{position:absolute;left:0;right:0;top:13px;height:8px;border-radius:5px;
    background:var(--ink);overflow:hidden}
  .mq-gauge i{display:block;height:100%;background:linear-gradient(90deg,#e8a72c,var(--gold))}
  .mq-box{position:absolute;top:0;transform:translateX(-50%);width:32px;height:32px;
    border-radius:9px;cursor:default;font-family:inherit;
    background:var(--panel);border:2px solid var(--line);color:var(--dim)}
  .mq-box{overflow:hidden}
  .mq-box i{font-style:normal;font-size:10px;font-weight:800}
  .mq-box.can{background:linear-gradient(180deg,#ffd76a,#e8a72c);border-color:var(--gold);
    color:#2a1c05;cursor:pointer;animation:mqBox 1.1s ease-in-out infinite}
  @keyframes mqBox{0%,100%{transform:translateX(-50%) scale(1)}
    50%{transform:translateX(-50%) scale(1.12)}}
  .mq-box.done{border-color:var(--up);color:var(--up)}
  .mq-sum{display:flex;align-items:baseline;gap:6px;font-size:11px;color:var(--dim);
    margin:6px 2px 10px}
  .mq-sum b{font-size:16px;color:var(--gold);
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400}
  .mq-sum span{margin-left:auto}
  .mq-rw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .mq-rwc{background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:7px 5px;text-align:center;font-size:10px}
  .mq-rwc.done{opacity:.45}
  .mq-rwc u{display:block;text-decoration:none;color:var(--gold);font-weight:800;
    font-size:11px;margin-bottom:3px}
  .mq-rwc em{font-style:normal;display:inline-flex;align-items:center;gap:2px;margin:0 3px}
  .mq-rwc em img{width:13px;height:13px;object-fit:contain}
  .mq-row{position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:8px 44px 9px 10px;margin-bottom:5px}
  .mq-row.done{border-color:var(--up);opacity:.72}
  .mq-h{display:flex;align-items:baseline;gap:8px;font-size:12px;margin-bottom:5px}
  .mq-h b{font-weight:700}
  .mq-h span{margin-left:auto;font-size:11px;color:var(--dim);
    font-variant-numeric:tabular-nums}
  .mq-bar{height:6px;border-radius:4px;background:var(--ink);overflow:hidden}
  .mq-bar i{display:block;height:100%;background:linear-gradient(90deg,#e8a72c,var(--gold))}
  .mq-row.done .mq-bar i{background:var(--up)}
  .mq-p{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;
    font-weight:800;color:var(--gold)}
  .mq-row.done .mq-p{color:var(--up)}

  /* ── 전직 카드 ──
     직군 카드 3장. 단장 직군 변신 그림이 주인공이고, 현재 단계 색(--au)이
     테두리·발광·이름을 함께 물들인다 — 1차 무채 / 2차 청 / 3차 금 */
  .pr-note{font-size:11px;color:var(--dim);text-align:center;margin:2px 0 10px}
  .pr-card{position:relative;background:var(--card);border:2px solid var(--au);
    border-radius:13px;padding:14px 12px 12px;margin-bottom:9px;text-align:center;
    box-shadow:0 0 14px color-mix(in srgb, var(--au) 30%, transparent),
      inset 0 0 22px color-mix(in srgb, var(--au) 12%, transparent)}
  .pr-card.t3{box-shadow:0 0 22px color-mix(in srgb, var(--au) 55%, transparent),
      inset 0 0 30px color-mix(in srgb, var(--au) 18%, transparent)}
  .pr-img{display:inline-block;width:96px;height:96px}
  .pr-img img{width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 4px 8px #000a) drop-shadow(0 0 10px color-mix(in srgb, var(--au) 45%, transparent))}
  /* 단계 여정 — 미니 초상 3개를 화살표로 잇는다. 다음 단계 그림은 실루엣이다:
     "저게 뭐지"가 다음 목표를 만든다 */
  .pj-path{display:flex;align-items:flex-start;justify-content:center;gap:4px;
    margin:10px 0 10px;padding:9px 4px 7px;background:var(--ink);border-radius:11px}
  .pj-node{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px}
  .pj-ic{position:relative;width:44px;height:44px;border-radius:10px;background:var(--ink2);
    border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
    overflow:hidden}
  .pj-ic img{width:38px;height:38px;object-fit:contain}
  .pj-node b{font-size:10px;font-weight:800;line-height:1.2;text-align:center;
    word-break:keep-all;margin-top:3px}
  .pj-node>span{font-size:9px;color:var(--dim)}
  .pj-node u{text-decoration:none;font-size:9px;color:var(--dim)}
  .pj-node.now .pj-ic{border-color:var(--c);box-shadow:0 0 9px var(--c)}
  .pj-node.now b{color:var(--c)}
  .pj-node.past{opacity:.62}
  .pj-node.past .pj-ic i{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-style:normal;color:var(--up);font-size:17px;
    background:#0009}
  /* 다음 단계 — 38px 에서는 실루엣이 그냥 얼룩이라, 어둡게 가라앉힌 실그림이 낫다.
     전용 단계 아트(PR-*)가 들어오면 여기가 진짜 예고편이 된다 */
  .pj-node.next .pj-ic img{filter:grayscale(1) brightness(.5);opacity:.75}
  .pj-node.next b{color:var(--dim)}
  .pj-arrow{align-self:center;color:var(--line);font-size:15px;font-weight:800;
    flex:0 0 auto;margin-top:-14px}
  .pr-pips{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:4px}
  .pr-pips i{width:10px;height:10px;border-radius:50%;background:var(--ink);
    border:1px solid var(--line)}
  .pr-pips i.on{background:var(--c);border-color:var(--c);box-shadow:0 0 6px var(--c)}
  .pr-name{display:block;font-size:16px;margin-top:4px;
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400}
  .pr-cls{display:block;font-size:11px;color:var(--dim);margin:2px 0 8px}
  .pr-next{display:block;font-size:11px;color:var(--dim);margin-bottom:8px}
  .pr-next b{color:var(--txt)}
  .pr-next.done{color:var(--gold);margin-bottom:2px}
  .pr-btn{width:100%;min-height:38px}
  /* 다른 길을 고른 뒤의 직군 — 잠긴 게 아니라 "안 간 길"이다. 흐리게만 */
  .pr-card.out{opacity:.45;filter:grayscale(.55)}
  .pr-chosen{position:absolute;right:10px;top:10px;font-size:10px;font-weight:800;
    color:#2a1c05;background:linear-gradient(180deg,#ffd76a,#e8a72c);
    border-radius:6px;padding:2px 8px}
  .pr-btn img{width:14px;height:14px;vertical-align:-2px}

  .fg-pull{display:grid;gap:6px;margin:6px 0 2px}
  .fg-pull .fgbtn{display:flex;flex-direction:column;align-items:center;gap:2px;
    min-height:46px;justify-content:center;padding:6px 4px;line-height:1.15}
  .fg-pull em{font-style:normal;font-size:11px;font-weight:800;display:inline-flex;
    align-items:center;gap:3px;opacity:.9}
  .fg-pull em img{width:13px;height:13px;object-fit:contain}
  .fg-pull i{font-style:normal;font-size:10px;color:var(--dim)}
  .fr-nav{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .fr-a{flex:0 0 38px;height:38px;font-family:inherit;font-size:20px;line-height:1;
    color:var(--gold);background:var(--panel);border:1px solid var(--line);
    border-radius:10px;cursor:pointer}
  .fr-a:disabled{opacity:.3;cursor:default}
  .fr-a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .fr-lv{flex:1;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:6px}
  .fr-lv b{font-size:19px;color:var(--gold);
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400}
  .fr-lv i{font-style:normal;font-size:10px;font-weight:800;color:#2a1c05;
    background:var(--gold);border-radius:5px;padding:1px 6px}
  .fr-unlock{font-size:11px;color:var(--dim);background:var(--panel);
    border:1px dashed var(--c);border-radius:9px;padding:7px 10px;margin-bottom:8px}
  .fr-unlock b{font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400}
  .fr-rows{margin-bottom:8px}
  .fr-rows .sm-g b{flex:0 0 46px}
  .fr-jump{display:block;width:100%;margin-bottom:6px;padding:8px;cursor:pointer;
    font-family:inherit;font-size:11px;font-weight:800;color:var(--dim);
    background:var(--panel);border:1px solid var(--line);border-radius:9px}
  .fr-jump b{font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400}
  #smBody .sm-band .rates{gap:5px 9px}
  /* "영웅 해금" 이 62px 칸에서 두 줄로 깨졌다. 레벨과 해금 표시를 위아래로 쌓고
     칸을 넓힌다 — 가로로 붙이면 어느 해상도에서든 다시 깨진다 */
  #smBody .sm-band .lv{flex:0 0 84px;display:flex;flex-direction:column;gap:1px;
    align-items:flex-start}
  #smBody .sm-band .lv em{margin:0;white-space:nowrap}
  #fgLvBadge{position:absolute;top:0;right:2%;background:var(--ink);border:2px solid var(--ore);
    border-radius:9px;padding:3px 9px;font-size:13px;font-weight:900;color:var(--ore);
    font-family:inherit;cursor:pointer;z-index:4;display:inline-flex;align-items:center;gap:3px}
  #fgLvBadge i{font-style:normal;font-size:10px;opacity:.75}
  #fgLvBadge:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  /* 탭 히어로 — 망치 오버레이는 폐기. 타격의 주역은 하단 독의 스트립이고,
     탭은 불똥 + 흔들림만 받는다 */
  /* 대기 상태에서도 폭을 차지해 패널에 가로 스크롤이 생겼다. translate 로 미리 당겨 둔다 */
  #fgHeroSpark{position:absolute;left:50%;top:46%;width:14px;height:14px;
    margin:-7px 0 0 -7px;border-radius:50%;opacity:0;pointer-events:none;z-index:2;
    background:radial-gradient(circle,#fff,#ffd76a 40%,#ff8a2a00 70%)}
  #fgHero.hit #fgHeroSpark{animation:fgSpk .4s ease-out .25s both}
  #fgHero.hit img#fgSummon{animation:fgShake .58s cubic-bezier(.3,1.4,.5,1) both}
  #fgStage{font-size:11px;color:var(--dim);margin-top:4px}
  #fgProg{height:9px;background:#0006;border-radius:5px;margin:8px 0 4px;overflow:hidden}
  #fgProgFill{height:100%;width:0;background:linear-gradient(90deg,var(--ore),var(--gold))}
  .fgbtn{width:100%;padding:11px;font-size:13px;border-radius:9px;font-weight:800;
    border:1px solid #4a6fc0;background:linear-gradient(#3c5ea8,#2c4680);color:var(--txt);cursor:pointer}
  .fgbtn:disabled{opacity:.4;cursor:default}
  /* 패널 헤더의 재화 — 그 화면에서만 쓰는 것만 올린다 */
  #ovcur{display:none;align-items:center;gap:5px;margin-left:10px;
    background:var(--ink);border:1px solid var(--line);border-radius:11px;padding:3px 10px}
  #ovh.has-cur #ovcur{display:flex}
  #ovcur img{width:16px;height:16px;object-fit:contain}
  #ovcur b{font-size:12px;font-weight:900;color:var(--gold)}

  /* 남은 시간 옆 단축 버튼 */
  .hg-open{flex:0 0 auto;margin-left:8px;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);border-radius:9px;padding:5px 9px;font-size:11px;font-weight:800;
    cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px}
  .hg-open.on{border-color:var(--gold);background:#221c0c;color:var(--gold)}
  .hg-open img{width:14px;height:14px;object-fit:contain}
  .hg-open:disabled{opacity:.35;cursor:default}

  /* 모래시계 사용 개수 선택 */
  /* 모래시계 개수 스테퍼 */
  .hg-row{display:flex;align-items:center;gap:5px;margin:8px 0 7px}
  .hg-step{flex:0 0 auto;width:38px;background:var(--card);border:1px solid var(--line);
    color:var(--txt);border-radius:8px;padding:8px 0;font-size:13px;font-weight:900;
    cursor:pointer;font-family:inherit}
  .hg-step:active{background:var(--panel2)}
  .hg-val{flex:1 1 auto;text-align:center;font-size:16px;font-weight:900;color:var(--gold);
    font-family:"Black Han Sans",system-ui,sans-serif}
  .hg-val i{font-style:normal;font-size:11px;font-weight:400;color:var(--dim);margin-left:4px}
  .hg-max{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer;
    font-family:inherit;letter-spacing:.5px}
  .hg-max.on{border-color:var(--gold);background:#221c0c;color:var(--gold)}

  /* 골드 투입 칸 게이지 — 1/4 면 네 칸 중 한 칸 */
  .fg-cells{display:inline-flex;gap:3px;vertical-align:-2px}
  .fg-cells i{display:block;width:16px;height:9px;border-radius:3px;
    background:var(--ink);border:1px solid var(--line)}
  .fg-cells i.on{background:linear-gradient(#ffd76a,#c8922e);border-color:#ffd76a;
    box-shadow:0 0 6px #ffc94a66}

  /* 버튼 안 재화 아이콘 — 크기를 안 주면 원본 1024px 로 떠서 패널을 덮는다 */
  .fgbtn img{width:15px;height:15px;object-fit:contain;vertical-align:-3px;margin-right:3px}
  /* 패널 행 안의 재화 아이콘도 같은 규칙. 크기를 안 주면 원본(1024px)이 그대로 떠
     패널을 덮는다 — 제작대의 모래시계에서 실제로 났다. */
  #ovb .frow img, #ovb .lbl img, #ovinfo .frow img{width:15px;height:15px;
    object-fit:contain;vertical-align:-3px;margin-right:3px}
  .fgbtn.warn{background:linear-gradient(#a8683c,#804a2c);border-color:#c08a4a}
  /* 소환 연출 */
  #reveal{position:absolute;inset:0;z-index:80;display:none;overflow:hidden}
  #reveal.show{display:block}
  /* 소환진을 그대로 두면 폭발(screen 합성)과 겹쳐 화면이 하얗게 날아간다.
     배경을 눌러야 폭발과 캐릭터가 읽힌다. */
  .rv-alt{position:absolute;inset:0;background-size:cover;background-position:center;
    filter:brightness(.42) saturate(.85);animation:rvAlt .5s ease-out both}
  .rv-veil{position:absolute;inset:0;
    background:radial-gradient(circle at 50% 40%,#0006 0%,#040711e8 68%)}
  @keyframes rvAlt{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:scale(1)}}
  .rv-stage{position:absolute;left:0;right:0;top:6%;height:62%;
    display:flex;align-items:center;justify-content:center}
  .rv-burst{position:absolute;width:118%;max-width:none;opacity:0;
    mix-blend-mode:screen;pointer-events:none}
  .rv-burst.go{animation:rvBurst 1.1s cubic-bezier(.16,1,.3,1) both}
  @keyframes rvBurst{
    0%{opacity:0;transform:scale(.35) rotate(-8deg)}
    18%{opacity:.95;transform:scale(1.04) rotate(0deg)}
    100%{opacity:.28;transform:scale(1.3) rotate(4deg)}}
  .rv-char{position:relative;z-index:2;max-height:100%;max-width:78%;object-fit:contain;
    opacity:0;filter:drop-shadow(0 8px 22px #000c) drop-shadow(0 0 14px #0008)}
  .rv-char.go{animation:rvChar .62s cubic-bezier(.16,1.3,.3,1) both}
  @keyframes rvChar{
    0%{opacity:0;transform:translateY(34px) scale(.72)}
    100%{opacity:1;transform:translateY(0) scale(1)}}
  .rv-info{position:absolute;left:0;right:0;top:66%;display:flex;align-items:center;
    justify-content:center;gap:9px;opacity:0}
  .rv-info.go{animation:rvInfo .4s ease-out both}
  @keyframes rvInfo{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .rv-grade{font-size:15px;font-weight:900;color:var(--ink);padding:3px 12px;border-radius:7px}
  .rv-name{font-size:16px;font-weight:800;text-shadow:0 2px 6px #000}
  .rv-grid{position:absolute;left:0;right:0;top:74%;display:flex;flex-wrap:wrap;gap:6px;
    justify-content:center;padding:0 14px}
  .rv-cell{position:relative;width:50px;height:50px;border:2px solid var(--line);
    border-radius:9px;background:var(--ink)cc;display:flex;align-items:center;
    justify-content:center;font-size:10px;font-weight:800;opacity:0;overflow:hidden;
    animation:rvCell .34s cubic-bezier(.16,1.4,.3,1) both}
  .rv-cell img{width:100%;height:100%;object-fit:contain;object-position:center 30%}
  .rv-cell span{position:absolute;bottom:1px;font-size:9px;text-shadow:0 1px 3px #000}
  @keyframes rvCell{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  .rv-hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:11px;
    color:#ffffff88;animation:rvHint 1.6s ease-in-out infinite}
  @keyframes rvHint{0%,100%{opacity:.4}50%{opacity:1}}

  /* 상점 — 전체 화면 (ui.json > navBar.behavior: full_screen_overlay) */
  #shop{position:absolute;inset:0;z-index:70;background:#150f0b;display:none;
    flex-direction:column;transform:translateY(100%);
    transition:transform .26s cubic-bezier(.2,.9,.3,1)}
  #shop.show{display:flex;transform:none}
  .sh-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px;
    background:linear-gradient(#1b2434,#141b28);border-bottom:1px solid var(--line)}
  .sh-back{background:none;border:none;color:var(--txt);font-size:26px;line-height:1;
    cursor:pointer;padding:0 6px;font-family:inherit}
  .sh-title{flex:1;font-size:16px;font-weight:800}
  .sh-cur{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;
    background:var(--ink);border:1px solid var(--line);border-radius:20px;padding:4px 12px}
  .sh-cur img{width:15px;height:15px}
  .sh-tabs{flex:0 0 auto;display:flex;gap:4px;padding:8px 10px;overflow-x:auto;
    background:var(--ink2);border-bottom:1px solid var(--line)}
  .sh-tabs button{flex:0 0 auto;background:none;border:1px solid transparent;color:var(--dim);
    border-radius:18px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;
    font-family:inherit;white-space:nowrap}
  .sh-tabs button.on{background:var(--gold);color:#000}
  .sh-body{flex:1;overflow-y:auto;padding:12px}
  .sh-empty{color:var(--dim);text-align:center;padding:40px 0;font-size:13px}
  /* 안내문은 낱말이 쪼개지지 않게. 마지막 줄에 한 글자만 남는 꼴을 막는다 */
  .sh-note,.sh-desc{word-break:keep-all;overflow-wrap:break-word;text-wrap:pretty}
  .sh-note{font-size:10px;color:var(--dim);line-height:1.6;margin-top:12px;
    background:var(--ink2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .sh-note b{color:var(--gold)}
  .sh-h2{font-size:11px;color:var(--dim);letter-spacing:.5px;margin:14px 0 7px}

  /* 소환 카드 */
  .sh-summon{position:relative;border-radius:14px;overflow:hidden;margin-bottom:12px;
    border:1px solid var(--line);box-shadow:0 6px 20px #0007}
  .sh-art{position:absolute;inset:0;background-size:cover;background-position:center 28%;
    filter:brightness(.6) saturate(1.1)}
  .sh-sgrad{position:absolute;inset:0;
    background:linear-gradient(180deg,#150f0b00 0%,#150f0bcc 52%,#150f0bf2 100%)}
  .sh-sbody{position:relative;padding:64px 12px 12px}
  .sh-srow{display:flex;align-items:baseline;gap:8px}
  .sh-srow b{font-size:17px;font-weight:900;text-shadow:0 2px 8px #000}
  .sh-lv{margin-left:6px;font-size:11px;font-weight:800;color:var(--tint);
    background:#0b0f17cc;border:1px solid var(--tint);border-radius:14px;padding:3px 10px}
  .sh-lv i{font-style:normal;color:var(--dim);font-weight:600}
  .sh-desc{font-size:11px;color:var(--dim);margin-top:2px}
  .sh-bar{height:5px;background:#0008;border-radius:3px;margin:9px 0 4px;overflow:hidden}
  .sh-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--tint),#fff8)}
  .sh-barTx{display:flex;justify-content:space-between;font-size:10px;color:var(--dim)}
  .sh-btns{display:grid;grid-template-columns:1fr 1.25fr;gap:7px;margin-top:11px}
  .sh-b{position:relative;background:#1c2536;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:9px 4px;font-size:12px;font-weight:800;cursor:pointer;
    font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
  .sh-b em{font-style:normal;font-size:11px;font-weight:700;color:var(--dim);
    display:flex;align-items:center;gap:3px}
  .sh-b em img{width:12px;height:12px}
  .sh-b.hot{background:linear-gradient(#3c5ea8,#2c4680);border-color:#5b83d6}
  .sh-b.hot em{color:#dbe6ff}
  .sh-tag{position:absolute;top:-7px;right:-4px;background:var(--warn);color:#fff;
    font-size:9px;font-weight:900;padding:2px 6px;border-radius:8px}

  /* 패키지 */
  .sh-grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .sh-pack{position:relative;background:linear-gradient(#1a2434,#131a27);
    border:1px solid var(--line);border-radius:12px;padding:14px 8px 10px;
    display:flex;flex-direction:column;align-items:center;gap:4px;overflow:hidden}
  .sh-pack.first{border-color:var(--gold);box-shadow:0 0 16px #ffc94a33}
  .sh-pack img{width:36px;height:36px;object-fit:contain}
  .sh-pack b{font-size:15px;font-weight:900}
  .sh-bonus{font-size:11px;font-weight:800;color:var(--up)}
  .sh-ribbon{position:absolute;top:8px;left:-24px;transform:rotate(-38deg);
    background:var(--gold);color:#000;font-size:9px;font-weight:900;padding:2px 26px}
  .sh-price{margin-top:5px;background:linear-gradient(#3f8a4f,#2c6a3c);border:1px solid #5ad86a;
    color:#fff;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:800;cursor:pointer;
    font-family:inherit;display:flex;align-items:center;gap:4px}
  .sh-price img{width:13px;height:13px}
  .sh-price.big{padding:9px 22px;font-size:13px}

  .sh-card{background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .sh-card b{font-size:13px}
  .sh-card .sh-desc{flex:1;margin:0}
  .sh-card.deal{border-left:3px solid var(--gold)}
  /* 3배속 해금 — 다이아 탭에서 유일한 "성능" 상품이라 눈에 띄게 */
  .sh-card.speed3{border:1px solid var(--gold);
    background:linear-gradient(120deg,#2a2412,var(--card) 60%)}
  .sh-card.speed3.owned{border-color:var(--line);background:var(--card)}

  .sh-hero{position:relative;background:linear-gradient(120deg,#3b2a6b,#1d2a52);
    border:1px solid #6a5ac0;border-radius:14px;padding:16px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    box-shadow:0 8px 26px #0008}
  .sh-hero b{font-size:18px;font-weight:900}
  .sh-hero span{font-size:11px;color:#c9d2e8}
  .sh-benefit{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
  .sh-benefit div{background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;display:flex;justify-content:space-between;font-size:11px}
  .sh-benefit span{color:var(--dim)}
  .sh-benefit b{font-weight:800}
  .sh-timer{font-size:11px;color:var(--gold);background:#1a1508;border:1px solid #4a3a12;
    border-radius:9px;padding:8px 11px;margin-bottom:10px;text-align:center}

  /* 전투력 상승 플로팅 — ui.json > criticalUiRules[0]
     "전투력 증가는 항상 즉시 화면에 뜬다. 이 게임 최대 도파민 지점" */
  #cpwrap{position:relative;display:inline-block}
  .cpup{position:absolute;left:100%;top:-2px;margin-left:7px;white-space:nowrap;
    font-size:13px;font-weight:900;color:var(--up);text-shadow:0 2px 6px #000;
    pointer-events:none;animation:cpUp 1.25s cubic-bezier(.2,.9,.3,1) both}
  @keyframes cpUp{
    0%{opacity:0;transform:translateY(6px) scale(.7)}
    18%{opacity:1;transform:translateY(0) scale(1.25)}
    32%{transform:translateY(0) scale(1)}
    100%{opacity:0;transform:translateY(-22px) scale(1)}}
  #cp.bump{animation:cpBump .34s ease-out}
  @keyframes cpBump{0%{transform:scale(1)}40%{transform:scale(1.16);color:#fff}100%{transform:scale(1)}}

  /* AUTO 진행 토글 */
  #auto.on{border-color:var(--up);color:var(--up);box-shadow:0 0 10px #5ad86a55}

  /* 방치 보상 */
  #idle{position:absolute;inset:0;z-index:75;background:#060a12dd;display:none;
    align-items:center;justify-content:center;padding:18px}
  #idle.show{display:flex}
  .id-card{width:100%;max-width:310px;background:linear-gradient(#1b2434,#121926);
    border:1px solid var(--gold);border-radius:16px;padding:18px 16px;text-align:center;
    box-shadow:0 14px 46px #000b}
  .id-card h3{margin:0 0 4px;font-size:17px;font-weight:900;color:var(--gold)}
  .id-time{font-size:11px;color:var(--dim);margin-bottom:14px}
  .id-row{display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--ink);border:1px solid var(--line);border-radius:11px;
    padding:11px;margin-bottom:8px}
  .id-row img{width:26px;height:26px}
  .id-row b{font-size:17px;font-weight:900}
  .id-btns{display:grid;grid-template-columns:1fr 1.3fr;gap:7px;margin-top:12px}
  .id-btns button{border-radius:10px;padding:11px 4px;font-size:12px;font-weight:800;
    cursor:pointer;font-family:inherit;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt)}
  .id-btns .ad{background:linear-gradient(#3f8a4f,#2c6a3c);border-color:#5ad86a}

  /* 단장 프로필 — 레벨 + 경험치 바 */
  #capbox{position:relative;flex:0 0 auto}
  #caplv{position:absolute;left:-3px;bottom:-3px;background:var(--ink);border:1.5px solid var(--gold);
    border-radius:8px;padding:0 5px;font-size:9px;font-weight:900;color:var(--gold);line-height:14px}
  #xpbar{height:4px;background:#0006;border-radius:2px;overflow:hidden;margin-top:3px}
  #xpfill{height:100%;width:0;background:linear-gradient(90deg,#ffc94a,#ffe9a8);
    transition:width .3s ease-out}
  #xptx{font-size:9px;color:var(--dim);margin-top:1px}

  /* 재화 획득 플로팅 */
  .cur{position:relative}
  .curup{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
    white-space:nowrap;font-size:11px;font-weight:900;color:var(--up);
    text-shadow:0 2px 5px #000;pointer-events:none;
    animation:curUp 1.1s cubic-bezier(.2,.9,.3,1) both}
  @keyframes curUp{
    0%{opacity:0;transform:translate(-50%,4px) scale(.7)}
    20%{opacity:1;transform:translate(-50%,-2px) scale(1.15)}
    100%{opacity:0;transform:translate(-50%,-20px) scale(1)}}

  /* 레벨업 배너 */
  #lvup{position:absolute;left:0;right:0;top:26%;z-index:78;display:none;
    justify-content:center;pointer-events:none}
  #lvup.show{display:flex}
  #lvup div{background:linear-gradient(#3b2a6b,#1d2a52);border:1px solid var(--gold);
    border-radius:14px;padding:12px 22px;text-align:center;box-shadow:0 10px 30px #000a;
    animation:lvPop .5s cubic-bezier(.16,1.4,.3,1) both}
  #lvup b{display:block;font-size:16px;font-weight:900;color:var(--gold)}
  #lvup span{font-size:11px;color:#cfd8ee}
  @keyframes lvPop{0%{opacity:0;transform:scale(.6) translateY(14px)}
    100%{opacity:1;transform:none}}

  /* 전체 화면 공통 (상점/도감) */
  .fullscr{position:absolute;inset:0;z-index:70;background:#150f0b;display:none;
    flex-direction:column;transform:translateY(100%);
    transition:transform .26s cubic-bezier(.2,.9,.3,1)}
  .fullscr.show{display:flex;transform:none}

  /* 도감 */
  .cx-h{display:flex;align-items:baseline;gap:8px;margin:14px 0 7px;font-size:13px;font-weight:900}
  .cx-h .cx-cnt{font-size:11px;color:var(--txt);font-weight:800}
  .cx-h .cx-sub{margin-left:auto;font-size:10px;color:var(--dim);font-weight:600}
  /* 한 줄 5칸. 4칸이면 칸은 크지만 한 화면에 11칸뿐이라 32종을 훑는 데
     스크롤이 길다. 5칸이면 375 기준 칸이 65px 로 줄고 한 화면에 20칸이 들어온다 */
  .cx-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px 8px}
  .cx-cell{position:relative;aspect-ratio:.86;background:var(--card);border:2px solid var(--line);
    border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end}
  .cx-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    object-position:center 28%}
  .cx-cell span{position:relative;width:100%;text-align:center;font-size:9px;font-weight:700;
    padding:2px 1px;background:linear-gradient(#0000,#0b0f17e8 40%);text-shadow:0 1px 3px #000}
  .cx-cell i{position:absolute;top:3px;left:3px;font-style:normal;font-size:8px;font-weight:900;
    color:var(--ink);padding:1px 5px;border-radius:5px}
  .cx-cell.lock img{filter:brightness(0) invert(.18)}
  .cx-cell.lock span{color:var(--dim)}
  /* 미보유 칸에는 **프레임을 주지 않는다.**
     보유 칸은 등급 액자(FR-*)라 border:0 인데 미보유 칸만 9-slice 소켓 10px 을
     쓰고 있었다. 한 그리드 안에서 미보유 쪽이 시각적으로 더 무거워져 — 못 가진
     칸이 가진 칸보다 튀었다. 미보유는 배경으로 물러나야 액자가 상이 된다.
     기하(9px 라운드)는 액자 칸과 같게 맞춰 격자가 흔들리지 않게 한다 */
  /* 등급을 모르는 미보유 칸 — 스킬은 뽑을 때 등급을 굴리므로 아직 등급이 없다.
     그렇다고 액자를 빼면 스킬 탭만 테두리 없는 판이 돼 그리드가 무너진다.
     N 액자를 회색으로 깐다 — 회색이라 등급이 아니라 "아직 없음"으로 읽힌다 */
  .cx-cell.lock:not([class*="g-"]){--fr-img:url(/assets/ui/FR-N.png);
    border-image:none;border:0;border-radius:9px;overflow:visible;background:#0f141d}
  .cx-cell.lock:not([class*="g-"])::after{content:"";position:absolute;inset:-4px;
    pointer-events:none;z-index:3;
    background:var(--fr-img) center/100% 100% no-repeat;
    filter:grayscale(1) brightness(.62)}

  /* 훈련소 */
  .tc-hero{text-align:center;padding:6px 0 12px}
  .tc-lv{font-size:30px;font-weight:900;color:var(--gold);line-height:1}
  .tc-max{font-size:11px;color:var(--dim)}
  .tc-bonus{margin-top:8px;font-size:14px;font-weight:900;color:var(--up)}
  .tc-bar{height:7px;background:#0006;border-radius:4px;margin:10px 0 4px;overflow:hidden}
  .tc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe9a8)}

  /* 랭킹 */
  #rkMine{flex:0 0 auto;padding:8px 12px 12px;background:var(--ink2);border-top:1px solid var(--line)}
  .rk-row{display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:5px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:12px}
  .rk-row.top{background:linear-gradient(90deg,#1e2740,var(--card))}
  .rk-row.mine{margin:0;border-color:var(--gold);background:linear-gradient(90deg,#2a2412,var(--card))}
  .rk-n{flex:0 0 30px;text-align:center;font-weight:900;color:var(--dim)}
  .rk-1{color:#ffd24a}.rk-2{color:#d7dde8}.rk-3{color:#d4915a}
  /* 1~3위는 숫자 대신 메달. 색 글자보다 한눈에 읽힌다 */
  .rk-1::before{content:'🥇'}.rk-2::before{content:'🥈'}.rk-3::before{content:'🥉'}
  .rk-1,.rk-2,.rk-3{font-size:0}
  .rk-1::before,.rk-2::before,.rk-3::before{font-size:17px}
  .rk-row.top:first-of-type{border-color:#ffd24a66;
    box-shadow:0 0 12px -4px #ffd24a88}
  .rk-ava{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);
    overflow:hidden;background:radial-gradient(circle at 50% 35%,#33405a,#1a2233)}
  .rk-ava img{width:150%;height:150%;object-fit:contain;object-position:center 22%;margin:-25%}
  .rk-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .rk-who b{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rk-who i{font-style:normal;font-size:9px;color:var(--gold);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .rk-row.top .rk-ava{width:38px;height:38px}
  .rk-sc{font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
  .rk-season{background:linear-gradient(120deg,#3b2a6b,#1d2a52);border:1px solid #6a5ac0;
    border-radius:12px;padding:12px;margin-bottom:11px}
  .rk-srow{display:flex;justify-content:space-between;align-items:baseline;font-size:12px}
  .rk-srow b{font-size:15px;font-weight:900}
  .rk-srow span{color:#c9d2e8;font-size:11px}
  .rk-pred{margin-top:7px;font-size:11px;color:#dbe4f8;line-height:1.5}
  .rk-pred b{color:var(--gold);font-weight:900}

  /* 설정 */
  .st-h{font-size:10px;color:var(--dim);letter-spacing:.5px;margin:16px 0 7px}
  .st-row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:12px}
  .st-row > span:first-child{flex:1}
  .st-row.link{cursor:pointer}
  .st-row.link b{color:var(--dim);font-weight:700}
  .st-seg{display:flex;gap:4px}
  .st-seg button{background:#1c2536;border:1px solid var(--line);color:var(--dim);
    border-radius:7px;padding:5px 12px;font-size:11px;font-weight:800;cursor:pointer;
    font-family:inherit}
  .st-seg button.on{background:var(--gold);color:#000;border-color:var(--gold)}
  .st-rng{width:130px;accent-color:var(--gold)}
  .st-danger{width:100%;margin-top:14px;background:#2a1418;border:1px solid #7a3b46;
    color:#ffb3bd;border-radius:10px;padding:11px;font-size:12px;font-weight:800;
    cursor:pointer;font-family:inherit}

  /* 우편함 */
  .ml-all{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:6px 12px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit}
  .ml-all:disabled{opacity:.35}
  .ml-row{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:7px;
    background:var(--card);border:1px solid var(--line);border-radius:11px}
  .ml-info{flex:1;min-width:0}
  .ml-info b{font-size:13px;display:block}
  .ml-grants{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px}
  .ml-grants span{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:800;
    color:var(--gold)}
  .ml-grants img{width:14px;height:14px}

  /* 프로필 */
  /* 프로필 카드 — 전투력이 주인공이다 */
  .pf-card{position:relative;text-align:center;padding:18px 14px 14px;border-radius:16px;
    background:linear-gradient(160deg,#243050,#141a28 60%);
    border:2px solid var(--fr);box-shadow:0 10px 30px #0009,0 0 22px -8px var(--fr)}
  .pf-card::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
    background:radial-gradient(120% 60% at 50% 0%,#ffffff14,#0000 70%)}
  .pf-ava{width:86px;height:86px;margin:0 auto;border-radius:50%;overflow:hidden;
    border:3px solid var(--fr);background:radial-gradient(circle at 50% 35%,#33405a,#1a2233)}
  .pf-ava img{width:150%;height:150%;object-fit:contain;object-position:center 22%;margin:-25%}
  .pf-nick{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:9px}
  .pf-nick b{font-size:19px;font-weight:900}
  #pfEdit{width:24px;height:24px;flex:0 0 auto;border-radius:50%;cursor:pointer;
    background:var(--ink);border:1px solid var(--line);color:var(--dim);font-size:12px;
    font-family:inherit;padding:0}
  #pfEdit:active{transform:translateY(1px)}
  .pf-title{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;color:var(--gold);
    background:var(--ink);border:1px solid var(--gold);border-radius:12px;padding:2px 12px}
  .pf-cp{margin-top:12px;padding-top:11px;border-top:1px solid #ffffff14}
  .pf-cp span{display:block;font-size:10px;color:var(--dim);letter-spacing:2px}
  .pf-cp b{font-family:"Black Han Sans",system-ui,sans-serif;font-size:30px;color:var(--gold);
    text-shadow:0 2px 10px #ffc94a55}
  .pf-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
  .pf-stats div{background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;display:flex;justify-content:space-between;font-size:11px}
  .pf-stats span{color:var(--dim)}
  .pf-stats b{font-weight:900;color:var(--txt)}
  .pf-titles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pf-t{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 9px;
    text-align:left;cursor:pointer;font-family:inherit;color:var(--txt)}
  .pf-t b{display:block;font-size:12px;font-weight:800}
  .pf-t span{font-size:9px;color:var(--dim)}
  .pf-t.on{border-color:var(--gold);background:#221c0c}
  .pf-t.lock{opacity:.4;cursor:default}
  .pf-mercs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .pf-m{aspect-ratio:1;border:2px solid var(--line);border-radius:9px;overflow:hidden;
    background:var(--card);cursor:pointer;padding:0}
  .pf-m img{width:130%;height:130%;object-fit:contain;object-position:center 25%;margin:-15%}
  .pf-m.on{box-shadow:0 0 0 2px var(--gold) inset}

  /* 퀘스트 화면 */
  .q-hero{background:linear-gradient(#1e2740,var(--card));border:1px solid #4a6fc0;
    border-radius:14px;padding:16px;text-align:center;box-shadow:0 8px 26px #0008}
  .q-no{font-size:11px;font-weight:900;color:var(--dia);letter-spacing:1px}
  .q-name{font-size:19px;font-weight:900;margin-top:2px}
  .q-prog{font-size:26px;font-weight:900;color:var(--gold);margin-top:8px}
  .q-prog span{font-size:14px;color:var(--dim);font-weight:700}
  .q-bar{height:7px;background:#0006;border-radius:4px;margin:9px 0 12px;overflow:hidden}
  .q-bar i{display:block;height:100%;background:linear-gradient(90deg,#4a6fc0,#5ad8ff)}
  .q-rewards{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:12px}
  .q-rw{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--gold);
    background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:3px 10px}
  .q-rw img{width:14px;height:14px}
  .q-go{width:100%;padding:12px;border-radius:10px;font-size:13px;font-weight:800;
    cursor:pointer;font-family:inherit;border:1px solid #4a6fc0;
    background:linear-gradient(#3c5ea8,#2c4680);color:var(--txt)}
  .q-go.done{background:linear-gradient(#3f8a4f,#2c6a3c);border-color:#5ad86a;
    animation:qPulse 1.2s ease-in-out infinite}
  @keyframes qPulse{0%,100%{box-shadow:0 0 0 0 #5ad86a00}50%{box-shadow:0 0 16px 2px #5ad86a66}}

  /* 메인 화면 퀘스트 바 — 누를 수 있다 */
  #quest{cursor:pointer;pointer-events:auto;transition:border-color .2s}
  #quest.done{border-color:var(--up);box-shadow:0 0 10px #5ad86a55}
  #quest.done #qname{color:var(--up)}

  /* 방치 보상 보물상자 — 접속 팝업 대신 메인에 상시 노출 */
  /* 스킬바가 bottom:6 에 높이 58 이라 위쪽 경계가 64px 이다. 상자는 그 위에 서야
     하는데, 남은 시간 배지(#chestT)가 상자보다 4px 더 내려오므로 그만큼 더 띄운다.
     62px 이면 배지가 마지막 스킬 아이콘을 덮는다 — 실제로 그랬다. */
  #chest{position:absolute;right:6px;bottom:78px;z-index:19;pointer-events:auto;
    width:52px;height:52px;border:none;background:none;cursor:pointer;padding:0}
  #chest img{width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 3px 8px #000a)}
  #chest.full img{animation:chBob 1.4s ease-in-out infinite}
  #chest.full::after{content:'';position:absolute;inset:-6px;border-radius:50%;
    background:radial-gradient(circle,#ffc94a55,#ffc94a00 70%);animation:chGlow 1.4s ease-in-out infinite}
  @keyframes chBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
  @keyframes chGlow{0%,100%{opacity:.35}50%{opacity:.9}}
  #chestT{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);
    background:var(--ink);border:1px solid var(--gold);border-radius:9px;padding:0 6px;
    font-size:9px;font-weight:900;color:var(--gold);white-space:nowrap;line-height:15px}

  .id-alt{display:flex;align-items:center;gap:8px;background:var(--ink);border:1px solid var(--line);
    border-radius:11px;padding:9px 11px;margin-top:9px;font-size:11px;text-align:left}
  .id-alt b{color:var(--txt);font-size:12px;display:block}
  .id-alt span{color:var(--dim);font-size:10px}
  .id-alt button{margin-left:auto;border-radius:9px;padding:8px 13px;font-size:11px;
    font-weight:800;cursor:pointer;font-family:inherit;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);flex:0 0 auto}
  .id-alt button.ad{background:linear-gradient(#3f8a4f,#2c6a3c);border-color:#5ad86a}
  .id-alt button:disabled{opacity:.35;cursor:default}

  /* 보스 도전 버튼 — 진행도 바로 아래 */
  /* 보스 도전 — hudC 아래에 절대배치로 매단다. flex 줄에 두면 나타날 때
     진행도 배너가 옆으로 밀렸다. 전용 에셋(UI-BOSSBTN)이 오면 --f-bossbtn 만 채운다. */
  #hudC{position:relative}
  #bossGo{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);
    pointer-events:auto;display:none;white-space:nowrap;
    background:none;border-style:solid;border-width:11px 22px;border-radius:0;
    border-image:var(--f-bossbtn) 152 220 fill stretch;
    color:#ffe9e2;padding:1px 4px;font-size:11px;font-weight:900;min-height:38px;
    cursor:pointer;font-family:inherit;letter-spacing:.5px;text-shadow:0 1px 2px #000c;
    filter:drop-shadow(0 3px 8px #000a);animation:bossPulse 1.3s ease-in-out infinite}
  #bossGo.show{display:block}
  @keyframes bossPulse{0%,100%{filter:drop-shadow(0 3px 8px #000a)}
    50%{filter:drop-shadow(0 3px 8px #000a) drop-shadow(0 0 10px #ff5a4a)}}

  /* VS 연출 — 단장 좌하단, 보스 우상단 */
  /* 대각선으로 갈린 두 진영. 보스는 붉은 쪽(우상), 단장은 푸른 쪽(좌하). */
  /* 전투 패널 안 연출이다. 상점·도감 같은 전체화면(z 70)이 뜨면 그 아래로 간다. */
  #vs{position:absolute;inset:0;z-index:30;display:none;overflow:hidden;
    background:
      linear-gradient(202deg,#3a0f12 0%,#25090f 38%,#0a0c18 38.6%,#0d1830 100%)}
  #vs.show{display:block}

  /* 중앙에서 뻗는 집중선 — 시선을 가운데 VS 로 모은다 */
  #vs::before{content:"";position:absolute;inset:-30%;pointer-events:none;
    background:repeating-conic-gradient(from 0deg at 50% 50%,
      #ffffff14 0deg 1.1deg,#0000 1.1deg 4deg);
    -webkit-mask-image:radial-gradient(circle at 50% 50%,#0000 16%,#000 62%);
    mask-image:radial-gradient(circle at 50% 50%,#0000 16%,#000 62%);
    animation:vsSpin 26s linear infinite}
  @keyframes vsSpin{to{transform:rotate(360deg)}}

  /* 경계선을 지나가는 섬광 + 비네트 */
  #vs::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(202deg,#0000 46%,#ffd9a855 49.4%,#fff9 50%,#ffd9a855 50.6%,#0000 54%),
      radial-gradient(ellipse at 50% 50%,#0000 40%,#000000cc 100%);
    animation:vsFlash .7s ease-out .18s both}
  @keyframes vsFlash{0%{opacity:0;transform:translate(-40%,40%)}
    45%{opacity:1}100%{opacity:.5;transform:none}}
  #vsBoss,#vsCap{position:absolute;width:56%;display:flex;
    align-items:center;justify-content:center}
  #vsBoss{right:2%;top:5%;animation:vsInR .5s cubic-bezier(.2,1.3,.4,1) both}
  #vsCap{left:2%;bottom:3%;animation:vsInL .5s cubic-bezier(.2,1.3,.4,1) .12s both}
  #vsBoss img,#vsCap img{width:100%;object-fit:contain;
    filter:drop-shadow(0 8px 22px #000c)}
  #vsCap img{transform:scaleX(1)}
  @keyframes vsInL{from{opacity:0;transform:translateX(-60%)}to{opacity:1;transform:none}}
  @keyframes vsInR{from{opacity:0;transform:translateX(60%)}to{opacity:1;transform:none}}
  #vsMark{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
    font-family:"Black Han Sans",system-ui,sans-serif;font-size:64px;color:#fff;
    text-shadow:0 0 18px #ff5a4a,0 4px 0 #8e2119,0 6px 16px #000;
    animation:vsPop .45s cubic-bezier(.2,1.6,.4,1) .34s both}
  @keyframes vsPop{from{opacity:0;transform:translate(-50%,-50%) scale(2.4) rotate(-14deg)}
    to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}}

  /* ── 세로형 반응형 ──
     이 게임은 모바일 세로형이다. 폭보다 **높이**가 먼저 모자란다 —
     위에서 내려오는 사이드 열과 아래에서 올라오는 퀘스트·상자가 가운데서 만난다. */
  @media (max-height: 720px){
    /* 아이콘 크기는 변수로 준다. UI 킷 블록이 뒤에 오므로 여기서 px 로 박으면
       나중 규칙이 이겨서 34px 버튼에 26px 아이콘이 들어가 2px 씩 삐져나온다 */
    /* 사이드 열 축소는 UI 킷 뒤(파일 끝)에서 한다 — 여기서 하면 킷 규칙이 덮는다 */
    /* 가로로 겹치지 않게 퀘스트 배너와 상자를 사이드 열 안쪽으로 민다 */
    #chest{right:46px}
    #chest{width:44px;height:44px;bottom:78px}
    #auto,#bossGo{font-size:10px}
    #timer{font-size:19px}
    #fgObj{width:88px;height:62px}
    #fgLv{left:calc(50% + 48px)}
    #b_auto{left:calc(50% + 50px);top:46px;width:34px;height:34px}
  }
  /* 아주 좁은 폭(360)에서는 퀘스트 바를 더 줄여 사이드와 겹치지 않게 */
  @media (max-width: 375px){
    #skills{gap:4px}
  }

  /* 던전 목록 맨 위의 탑 진입 카드 */
  #twCard{display:flex;align-items:center;gap:11px;padding:12px 13px;margin-bottom:10px;
    background:linear-gradient(100deg,#2a1840,#161022);border:1px solid #7a4ac0;
    border-radius:13px;cursor:pointer}
  #twCard .tw-ico{width:42px;height:42px;flex:0 0 auto;border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:24px;
    background:#0b0716;border:1px solid #a06ae0}
  #twCard .tw-ico img{width:30px;height:30px;object-fit:contain}
  #twCard b{display:block;font-size:14px;font-weight:900}
  #twCard span{display:block;font-size:11px;color:var(--dim);margin-top:2px}
  #twCard i{margin-left:auto;font-style:normal;font-size:12px;font-weight:900;color:var(--gold)}

  /* 무한의 탑 */
  .tw-hero{background:linear-gradient(#2a1840,#161022);border:1px solid #7a4ac0;
    border-radius:14px;padding:16px;text-align:center;box-shadow:0 8px 26px #0008}
  .tw-best{font-size:11px;font-weight:900;color:#c9a6ff;letter-spacing:1px}
  .tw-now{font-family:"Black Han Sans",system-ui,sans-serif;font-size:38px;color:#fff;line-height:1.1}
  .tw-now span{font-size:14px;color:var(--dim);margin-left:4px}
  .tw-need{font-size:12px;color:var(--dim);margin:6px 0 12px}
  .tw-need b.ok{color:var(--up)} .tw-need b.no{color:var(--warn)}
  .tw-need span{display:block;font-size:11px;opacity:.8;margin-top:2px}
  .tw-go{width:100%;padding:12px;border-radius:10px;font-size:13px;font-weight:800;
    cursor:pointer;font-family:inherit;border:1px solid #a06ae0;
    background:linear-gradient(#7a4ac0,#4a2a80);color:#fff}
  .tw-go:disabled{opacity:.4;cursor:default}
  .tw-reach{font-size:11px;color:var(--dim);margin-top:9px}
  .tw-reach b{color:var(--gold)}
  .tw-row{display:flex;align-items:center;gap:8px;padding:9px 11px;margin-bottom:6px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:12px}
  .tw-row.now{border-color:#a06ae0;background:#1e1630}
  .tw-row.lock{opacity:.45}
  .tw-f{font-weight:900;width:46px;flex:0 0 auto}
  .tw-cp{color:var(--dim);flex:1 1 auto}
  .tw-rw-box{display:flex;gap:7px;flex:0 0 auto}
  .tw-rw{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--gold)}
  .tw-rw img{width:13px;height:13px;object-fit:contain}

  /* 안내 pill — 화면 중하단. 시선(전투·버튼)과 겹치지 않는 자리다.
     중앙 상단 큰 토스트는 전부 여기로 왔다 — 그 자리는 연출(레벨업·VS)의 것 */
  #toast{position:absolute;left:50%;bottom:33%;transform:translateX(-50%) translateY(6px);
    z-index:99;background:#0b0f17e6;border:1px solid #ffffff2a;border-radius:18px;
    padding:8px 16px;font-size:12px;font-weight:700;color:#e8eef8;
    opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;
    max-width:82%;text-align:center;box-shadow:0 4px 14px #0009}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 획득 스택 — 상단에서 내려와 쌓이는 줄들. 실게임 표준 문법:
     [아이콘] 이름 +수량. 겹치지 않고 아래로 쌓이며 각자 사라진다 */
  #gains{position:absolute;left:50%;top:15%;transform:translateX(-50%);z-index:98;
    display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
