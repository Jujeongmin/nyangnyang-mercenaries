    text-shadow:0 1px 0 #ffe9a880}
  .rt-b:disabled{opacity:.4;cursor:default}
  /* 액션바의 두 버튼만 예외다 — 할 일이 없을 때 **갈색으로 또렷하게** 남아야
     한다. 흐려 놓으면 갈색인지 꺼진 것인지 구별이 안 되고, 그 둘이 여기서는
     같은 뜻이 아니다 (금색 = 할 일 있음 / 갈색 = 없음) */
  #shAct .rt-b:disabled{opacity:1}

  /* 던전 모드 — 장착 줄·이월·액션바가 없다. 시트 껍데기만 같이 쓴다 */
  #sheet.mode-dg #shEq,#sheet.mode-dg #shSum,#sheet.mode-dg #shAct,
  #sheet.mode-dg #shPre{display:none}
  #sheet.mode-dg #shBody{padding-bottom:12px}


  /* ── 연합 탭 ────────────────────────────────────────────────── */
  .al-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
  .al-t{padding:1px 2px;min-height:34px;font-size:12px;font-weight:800;cursor:pointer;
    font-family:inherit;color:var(--txt);text-shadow:0 1px 2px #0009;
    background:none;border-style:solid;border-width:9px;border-radius:0;
    border-image:var(--f-btn) 127 163 fill stretch}
  .al-t.on{border-image:var(--f-go) 159 209 fill stretch;color:#2a1c05;
    text-shadow:0 1px 0 #ffe9a880}
  #ovb .frow .v img{width:14px;height:14px;object-fit:contain;vertical-align:-2px}


  /* ── 패스 화면 ─────────────────────────────────────────────────
     사이드 열에 5번째 버튼이 생겼다. 좁은 세로(640)에서 5개가 스킬바까지 내려오므로
     열을 더 올리고 버튼을 33px 로 줄인다. 5*33 + 4*3 = 177px → 120~297. */
  .ps-hero{position:relative;text-align:center;padding:16px 12px 14px;
    background:linear-gradient(150deg,#3b2a6b,#524236);border-radius:14px;
    border:1px solid #7a6ad6;box-shadow:0 8px 26px #0008}
  .ps-hero b{display:block;font-size:18px;font-weight:900}
  .ps-hero span{display:block;font-size:11px;color:#ffe4cf;margin:3px 0 10px}
  .ps-hero .fgbtn{width:auto;padding:2px 18px;min-height:40px}


  /* ── 패널 마감 ─────────────────────────────────────────────────
     이 블록은 UI 킷 뒤에 온다. 앞에 두면 킷 규칙이 나중에 나와서 덮는다. */

  /* 사이드 아이콘 — 네모 판을 걷어낸다.
     42px 짜리 칸에 프레임까지 두르면 아이콘이 26px 로 쪼그라들어 무슨 그림인지 안 읽힌다.
     판을 빼면 그 공간이 전부 아이콘 몫이 되고, 글자는 아이콘 아래에 겹쳐 얹는다. */
  /* --sb 는 좁은 앱(@container app max-width:400)에서 화면 높이에 맞춰 다시
     정해진다. 여기 44px 은 넓은 화면의 기본값이고, 점 크기가 이 값을 읽는다 */
  .side{--sb:44px}
  /* 아이콘 **위**, 글자 **그 아래**, 둘 다 가운데다 (단장 확정 2026-08-25).
     예전에는 글자를 absolute 로 버튼 바닥(bottom:-2px)에 얹어 아이콘 하단
     7px 을 덮었다. 흐름에 넣으면 겹칠 일이 구조적으로 없다.
     --sb 는 이제 **버튼 한 칸 전체**(아이콘 + 글자)의 높이다 — 아이콘은 남는
     만큼 차지한다(flex:1, min-height:0). 세로 예산은 이 값으로 계산돼 있다 */
  .side button{background:none;border:0;border-image:none;border-radius:0;
    box-shadow:none;padding:0;width:var(--sb);height:var(--sb);position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:1px;overflow:visible}
  /* 위 UI 킷의 `.side button:has(img){padding:4px 0 3px}` 는 여기서 걷는다 —
     네모 판이 있던 시절 그림을 판 안쪽으로 들이려던 여백이고, 판을 걷어낸
     지금은 아이콘만 7px 깎아 먹는다 */
  .side button:has(img){padding:0}
  .side button img{width:auto;height:auto;margin:0;
    flex:1 1 auto;min-height:0;max-width:100%;object-fit:contain;
    filter:drop-shadow(0 2px 4px #000c) drop-shadow(0 0 2px #000a)}
  /* 글자는 버튼보다 넓어도 된다 — 좌우로 4px 씩 번지되 자리는 안 차지한다.
     그래서 폭은 margin 음수로 벌리고 흐름 높이는 글자 한 줄 그대로 둔다 */
  /* 글자는 아이콘 **아래**에 서되 하단을 5px 쯤 올라탄다 (단장 확정 2026-08-25).
     완전히 아래로 내리면 한 칸 안에서 글자가 바닥에 몰려 다음 버튼과 붙고,
     아이콘도 그만큼 깎인다. 살짝 겹치면 글자는 아이콘의 어두운 부분 위에
     앉아 (두꺼운 외곽선 덕에) 읽히고, 아이콘은 5px 을 돌려받는다 */
  /* 아이콘 **위**에 그린다. 겹치는 쪽이 글자라야 읽힌다 — 그림이 위로 오면
     겹친 5px 만큼 글자 윗변이 잘려 보인다 (단장 지적 2026-08-25) */
  .side button span{position:relative;z-index:1;
    flex:0 0 auto;margin:-5px -4px 0;align-self:stretch;text-align:center;
    font-size:9px;font-weight:800;line-height:1.1;letter-spacing:-.3px;
    color:#fff;text-shadow:0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000,
      0 2px 5px #000;pointer-events:none}
  .side button:active img{transform:translateY(1px) scale(.94)}
  /* 그림이 아직 없으면 onerror 가 img 를 지운다 — 그러면 글자만 허공에 뜬다.
     받침을 깔아 버튼이라는 걸 남긴다. */
  .side button:not(:has(img)){background:radial-gradient(circle at 50% 40%,#544437,#131a28);
    border:1px solid #ffffff26;border-radius:11px}
  .side button:not(:has(img)) span{position:absolute;inset:0;font-size:10px;
    display:flex;align-items:center;justify-content:center;line-height:1}
  /* 알림 점 — **버튼 크기에 비례한다.** 9px 로 못 박아 두면 버튼이 21px 까지
     줄어드는 낮은 화면에서 점이 버튼 폭의 43% 를 덮어 아이콘이 안 읽힌다
     (단장 지적 2026-08-25, 1024x600 실측 버튼 21px · 점 9px).
     자리도 **모서리 바깥**이다 — 안쪽(top:0)에 두면 크기와 무관하게 그림 위에
     올라탄다. .side button 이 overflow:visible 이라 밖으로 나가도 안 잘린다 */
  .side button.hasnew::after{top:-2px;right:-2px;
    width:clamp(6px, calc(var(--sb) * .21), 9px);
    height:clamp(6px, calc(var(--sb) * .21), 9px)}

  /* 상단 패널 — 프레임 띠를 깐다. 재화 알약은 이미 UI-PILL 이라 겹치지 않게 얇게. */
  #top{background:none;border-bottom:none;border-style:solid;
    border-width:8px 12px 10px;border-image:var(--f-nav) 39 fill stretch;
    padding:2px 4px;gap:4px}
  #capbox{filter:drop-shadow(0 2px 5px #0009)}
  #cp{text-shadow:0 2px 6px #000a}

  /* 하단 패널 — 장비 칸과 제작대가 올라앉는 판.
     UI 킷의 남색 판은 위쪽 전투 화면(초원·하늘)과 아래 네비(나무)의 따뜻한 색
     사이에서 혼자 차갑게 떠 있었다. 새 에셋을 만드는 대신 **제작대를 광원으로**
     삼는다 — 판 아래 가운데에서 불빛이 번지고 가장자리로 갈수록 어두워진다.
     제작대가 이 판의 주인공이라는 것도 빛이 대신 말해 준다. */
  /* 액자 두께도 화면 높이에 매단다. 위아래 22px 은 1024x600 하단 패널(217px)의
     10% 였다 — 안쪽 내용은 다 줄여 놨는데 테두리만 그대로면 그만큼이 고스란히
     전투 화면에서 나온다 (단장 지적 2026-08-25). 좌우는 앱 폭이 바뀌지 않으니
     그대로 12px 이다 */
  #bottom{position:relative;isolation:isolate;
    background:none;border-top:none;border-style:solid;
    border-width:clamp(7px, 1.23vh, 10px) 12px clamp(8px, 1.48vh, 12px);
    border-image:var(--f-panel) 86 fill stretch;
    padding:2px 4px 4px}
  #bottom::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:
      /* 가장자리 감쇠 — 먼저 깔아 바닥을 눌러 둔다 */
      radial-gradient(150% 130% at 50% 72%, #0000 34%, #05080e 100%),
      /* 제작대 화덕 불빛 — 중심을 제작대 오브젝트 높이에 맞춘다 */
      radial-gradient(76% 58% at 50% 86%, #ff9a3c3d 0%, #d9541a1f 42%, #0000 76%)}
  /* 불빛은 배경층이므로 내용은 그 위로 올린다 */
  #bottom > *{position:relative;z-index:0}

  /* 스테이지 진행도 — 전용 에셋(UI-STAGE)이 나오면 배경으로 깐다.
     그때까지는 UI-PILL 로 대비만 확보한다. 에셋이 오면 --f-stage 만 바꾸면 된다. */
  /* 판 없음 — 사용자 확정. 글자는 외곽선+그림자로만 배경에서 분리한다.
     (UI-STAGE 에셋 보류. 점은 UI-PIP 3종이 오면 .dotw 규칙이 자동으로 입는다) */
  #hudC{padding:2px 4px;border:0;pointer-events:none}
  #stg{text-shadow:0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 2px 8px #000}
  #stg{font-size:13px;text-shadow:0 1px 3px #000}
  /* 지역명이 스테이지 번호에 붙어 보인다 (영어처럼 긴 라벨에서 특히) — 간격은 CSS 몫 */
  #stg i{color:var(--gold);opacity:1;font-weight:800;margin-left:6px}
  /* 화살표(점 위 12px)가 스테이지 이름을 파고들지 않게 띄운다 */
  #enc{margin-top:11px}
  /* 진행도 점 — UI-PIP 3종이 생기면 첫 배경층(그림)이 그라디언트를 덮는다.
     404 면 그림 층만 조용히 비어 아래 그라디언트가 그대로 보인다 — 폴백 공짜. */
  /* 그림이 실제로 들어왔으므로 CSS 테두리는 뺀다 — 점 원화에 금테가 이미 있다.
     1px 어두운 링을 얹으면 11px 에서 금테가 절반 죽는다. */
  .dotw{width:12px;height:12px;border:0;border-radius:50%;
    background:url(/assets/ui/UI-PIP.png) center/contain no-repeat,#5c4a3c;
    box-shadow:none}
  .dotw.on{background:url(/assets/ui/UI-PIP-ON.png) center/contain no-repeat,
    radial-gradient(circle at 40% 35%,#ffe9a8,#e8a72c);
    border:0;box-shadow:0 0 6px #ffc94a99}
  .dotw.boss{width:16px;height:16px;
    background:url(/assets/ui/UI-PIP-BOSS.png) center/contain no-repeat,#5a2634;
    border:0}
  .dotw.boss.on{background:url(/assets/ui/UI-PIP-BOSS-ON.png) center/contain no-repeat,
    radial-gradient(circle at 40% 35%,#ffb0b8,#d63a4c);
    border:0;box-shadow:0 0 8px #ff5a6aaa}


  /* 자동 소환 — 톱니만 있으면 무슨 버튼인지 안 읽힌다. 사이드 아이콘과 같은 방식으로
     그림 아래에 글자를 겹쳐 얹는다. 판을 걷어내 톱니가 칸을 다 쓰게 한다. */
  #b_auto{background:none;border:0;box-shadow:none;overflow:visible}
  #b_auto img,#b_auto .gear{width:34px;height:34px;font-size:30px;line-height:34px;
    filter:drop-shadow(0 2px 4px #000c)}
  .au-lb{position:absolute;left:-6px;right:-6px;bottom:-3px;font-size:9px;font-weight:800;
    line-height:1.1;color:#fff;pointer-events:none;text-align:center;
    text-shadow:0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 2px 5px #000}
  #b_auto.on{background:none;box-shadow:none}
  #b_auto.on img,#b_auto.on .gear{filter:drop-shadow(0 0 7px #5ad86aaa) drop-shadow(0 2px 4px #000c)}
  #b_auto.on .au-lb{color:#8cf59a}

  /* 상단바 설정 버튼 — 스테이지 텍스트 자리를 물려받았다.
     같은 정보(스테이지)가 전투 화면 진행도에 이미 크게 떠 있어 두 번 적을 이유가 없다. */
  /* 우편도 같은 규격으로 옆에 선다 */
  /* 우편·설정 아이콘도 화면 높이에 매단다 (#cap·.cui·.slot·네비와 같은 이유) */
  .topIc{position:relative;flex:0 0 auto;
    width:clamp(26px, 4.19vh, 34px);height:clamp(26px, 4.19vh, 34px);
    padding:0;cursor:pointer;
    background:none;border:0;border-radius:9px;font-size:18px;color:var(--dim);
    line-height:1;text-align:center}
  .topIc img{width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 2px 4px #000a)}
  .topIc:active{transform:translateY(1px) scale(.94)}
  /* 안 읽은 우편 빨간 점. 사이드 버튼의 .hasnew 와 같은 규칙이다 */
  .topIc.hasnew::after{content:'';position:absolute;top:0;right:0;
    width:9px;height:9px;border-radius:50%;background:var(--warn);
    box-shadow:0 0 6px var(--warn)}

  /* ── 시즌 패스 ─────────────────────────────────────────────────
     한 줄에 [티어][무료][프리미엄]. 유료를 오른쪽에 두는 이유 — 무료를 누르러 오면
     시선이 자연히 옆으로 간다. 위아래로 나누면 유료가 화면 밖으로 밀린다. */
  .ps-top{display:flex;align-items:baseline;gap:10px;padding:2px 4px 8px}
  .ps-tinfo b{font-family:"Black Han Sans",system-ui,sans-serif;font-size:26px;color:var(--gold)}
  .ps-tinfo span{font-size:11px;color:var(--dim);margin-left:4px}
  .ps-tnext{margin-left:auto;font-size:11px;color:var(--dim)}
  .ps-buy{display:flex;gap:6px;margin-bottom:10px}
  .ps-buy .fgbtn{flex:1;min-height:42px}
  .ps-buy .mdBuy{flex:0 0 auto;min-height:42px;padding:1px 12px}
  .ps-own{flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;
    font-weight:800;color:var(--gold);background:var(--card);border:1px solid var(--gold);
    border-radius:9px;min-height:42px}
  .ps-head{display:grid;grid-template-columns:44px 1fr 1fr;gap:5px;
    font-size:10px;color:var(--dim);text-align:center;padding-bottom:4px}
  .ps-row{display:grid;grid-template-columns:44px 1fr 1fr;gap:5px;margin-bottom:5px;
    align-items:stretch}
  .ps-row.now .ps-tier{border-color:var(--gold);color:var(--gold)}
  .ps-tier{display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 0}
  .ps-tier b{font-size:14px;font-weight:900;line-height:1}
  .ps-tier span{font-size:9px;color:var(--dim)}
  .ps-cell{position:relative;display:flex;flex-wrap:wrap;align-items:center;
    justify-content:center;gap:3px 4px;padding:6px 6px 14px;cursor:pointer;font-family:inherit;
    background:none;border-style:solid;border-width:10px;border-radius:0;
    border-image:var(--f-card) 122 fill stretch;color:var(--txt);min-height:78px}
  .ps-cell.off{opacity:.45;cursor:default}
  /* 이미 받은 칸은 **색으로 구분한다.** 흐리게만 하면(opacity) 잠긴 칸과
     구별이 안 돼서 "받은 것"과 "못 받는 것"이 같아 보였다 (단장 지적 2026-08-25) */
  .ps-cell.done{opacity:.62;background:#16301c;border-color:#3f8a4f}
  .ps-cell.done .ps-mark{color:#8cf59a}
  .ps-cell.done .ps-c{color:#a9d9b3}
  .ps-c{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:800;
    line-height:1}
  .ps-c img{width:12px;height:12px;object-fit:contain}
  .ps-deco{color:var(--gold);font-size:10px}
  .ps-mark img{width:11px;height:11px;object-fit:contain;vertical-align:-1px}
  .ps-mark{position:absolute;left:0;right:0;bottom:1px;font-style:normal;
    font-size:9px;font-weight:800;color:var(--dim)}
  .ps-mark.ps-go{color:#2a1c05;background:linear-gradient(180deg,#ffd76a,#e8a72c);
    border-radius:0 0 4px 4px;padding:1px 0}


  /* ── 좁은 세로(≤720px) 최종 조정 ───────────────────────────────
     반드시 파일 끝. 패널 마감 블록이 .side button 을 44px 로 다시 키우므로
     그보다 뒤에서 줄여야 이긴다 — 한 번 당한 특이도/순서 함정이다.
     좌 3개 x 34px + 2 x 3px = 108px. 우 2개 = 71px. 배속(≈120~140)과 겹치지 않게
     우측 열을 배속 아래에서 시작한다. */
  @media (max-height: 720px){
    /* 전투 패널이 205px 까지 줄어든다. 사이드가 9개에서 5개로 줄어 26px 상한은
       필요 없어졌다 */
    .side{top:3px;gap:2px}
    /* 우측은 배속(4)·타이머(34~56) 아래서 시작해야 한다 */
    #sideR{top:44px}
    #timer{position:absolute;top:18px;right:8px;font-size:17px;
      margin:var(--bleed) 0 0}   /* 상단 패널 뒤로 파고든 몫만큼 내린다 */
    .side button{width:26px;height:26px}
    /* 글자는 **안 접는다.** 아이콘만 남으면 무슨 버튼인지 그림으로만 알아야 하고,
       임무·출석·이벤트·패스는 그림이 서로 비슷해서 실제로 안 읽힌다.
       라벨 폭은 38px 로 고정(left/right:-4px)이라 320x568 까지 재도 넘치지
       않았고(scrollWidth == clientWidth), 버튼 간격 안에 들어가 서로 겹치지도
       않는다 (단장 확정 2026-08-25) */
    /* 배속 크기는 .sbtn 의 vh clamp 가 정한다 — 여기서 px 로 박으면 안 준다 */
    /* 오른쪽 6칸(미구현 시스템)을 여기서 지우던 규칙을 뺐다 (2026-08-25).
       **세로를 아끼려던 규칙인데 세로가 1px 도 안 줄었다** — 장비는 어차피
       2행이고, eqR 을 지우면 그 2행이 가로로 넓어질 뿐이다. 1024x600 에서
       장비가 6칸만 보이던 원인이 이것이다 (단장 지적 2026-08-25).
       세로는 아래 .slot 높이를 화면에 매다는 쪽으로 줄인다 */
    /* 폭은 .sk 와 같은 식(clamp)이 정한다 — 여기서 다시 못 박으면 AUTO 만
       작아져 줄 끝이 어긋난다. 글자 크기만 줄인다 */
    #skAuto{font-size:8px}
    /* 스킬 줄이 사이드 열(우측 26px 폭) 밑으로 들어가지 않게 더 줄인다.
       30+6+8*26+7*6 = 286px → 좌우 여백 37px, 열(34px)과 안 만난다.
       **AUTO 도 같이 적는다** — 한쪽만 고정하면 둘 크기가 갈린다 */
    #skRow{--sk-cell:30px;gap:5px}
  }

  /* ── 참고 배치 (버섯커 스크린샷) ──────────────────────────────────
     스킬바 왼쪽 AUTO · 인벤토리 2줄(아랫줄 = 추후 시스템 잠금 칸). */
  #skRow{display:flex;align-items:center;justify-content:center;gap:6px;pointer-events:auto}
  /* **스킬 칸과 같은 식으로 큰다.** 40px 고정이면 PC 에서 칸만 64px 로 커지고
     AUTO 는 그대로라 줄 끝이 어긋난다 (단장 지적 2026-08-25).
     .sk 와 같은 clamp 를 쓰되 글자가 들어가야 해서 하한만 조금 높다 */
  #skAuto{flex:0 0 auto;border-radius:50%;cursor:pointer;
    width:var(--sk-cell);aspect-ratio:1;height:auto;
    font-family:inherit;font-size:9px;font-weight:900;line-height:1.1;color:var(--dim);
    background:var(--card)cc;border:2px solid var(--line);padding:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  #skAuto i{font-style:normal;font-size:8px}
  #skAuto.on{color:#3a2a08;background:radial-gradient(circle at 40% 35%,#ffe9a8,#e8a72c);
    border-color:#ffd76a;box-shadow:0 0 8px #ffc94a88}
  /* 꺼짐 — **갈색 목재 톤.** 예전에는 켜짐만 색이 있고 꺼짐은 회색 카드색이라
     "비활성 UI" 처럼 보였다. 꺼짐도 눌러서 켜는 살아 있는 버튼이다 */
  #skAuto:not(.on){color:#e3cfa8;
    background:radial-gradient(circle at 40% 35%,#6b4a2a,#3a2718);
    border-color:#8a6636;box-shadow:inset 0 2px 5px #0007}
  #skAuto:not(.on) i{color:#b99a6a}
  /* 쿨타임 와이프 — 시전 직후 어두운 원뿔이 시계 방향으로 걷힌다.
     --cd 는 남은 각도(360deg → 0). rAF 가 깎는다 */
  .sk .cdwipe{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    display:none;background:conic-gradient(#0009 var(--cd,0deg),#0000 0)}
  .sk.cool .cdwipe{display:block}
  .sk.flash{box-shadow:0 0 12px #ffe9a8cc!important;border-color:#ffe9a8!important}

  /* 수동 모드에서 준비된 스킬 — 눌러 달라고 빛난다 */
  .sk.ready{cursor:pointer;box-shadow:0 0 10px #ffc94aaa!important;border-color:var(--gold)!important}

  /* 인벤토리 아랫줄 — 추후 시스템. 잠긴 칸도 격자를 유지해야 "생길 자리"로 읽힌다 */
  .slot.future{cursor:default;opacity:.55}
  .slot.future img.lk{width:16px;height:16px;opacity:.8;
    filter:grayscale(.3) brightness(.9)}
  .slot.future span{position:absolute;bottom:2px;font-size:8px;color:var(--dim)}

  /* 장비 확대(정보) 패널 — 아이콘의 등급 액자(fre-)가 카드 프레임과 겹쳐
     지저분했다. 정보 화면에서는 액자 없이 아이콘만 크게. */
  .ei-top{padding:6px 0 14px;justify-content:center}
  .ei-ic{width:86px;height:86px;border-width:2px;overflow:hidden;border-radius:15px;
    box-shadow:0 0 14px -2px var(--au)}
  .ei-ic img{width:64px;height:64px}


  /* ══ 좁은 화면(360×640) 최종 보정 ═════════════════════════════
     UI 킷 규칙 **뒤**라야 이긴다 — 앞에 두면 킷이 덮어써서 겹침이 남는다.
     360 에서 실측으로 잡힌 것: 사이드열 x 퀘스트/스킬바/보물상자,
     스테이지 텍스트 x 배속 버튼, 스킬 행이 스킬바 밖으로 39px.

     **@media 가 아니라 @container 다.** 게임은 #app 안에서 살고 데스크톱에서는
     뷰포트가 넓어도 앱이 480px 로 잘린다 — 뷰포트를 재면 정작 좁은 건 앱인데
     규칙이 안 걸린다 (검사기가 그래서 같은 겹침을 계속 뱉었다). */
  /* 문턱은 **400px** 이다. 440 으로 두면 430(iPhone Pro Max 급)·414 까지
     좁은 화면 보정을 물어서, 넓은 화면인데도 사이드 아이콘이 작아지고 글자가
     사라진다 (단장 지적 2026-08-25). 이 블록이 실측으로 잡은 것은 360~390 이다 */
  @container app (max-width: 400px){
    /* 사이드 열 — 더 작게 + 위로. 전투 중앙을 비운다.
       문턱이 440 인 이유: 앱 최대폭이 480 이고 412(픽셀7 계열)에서도 같은
       겹침이 났다. 480 미만은 사실상 전부 "좁은 폰"이다 */
    /* 버튼 크기를 **전투 패널 높이에 매단다.** 30px 로 못 박아 두면 좌측 열
       5개가 어느 화면에서나 162px 을 먹는데, 전투 패널은 앱 높이의 40% 라
       360x640 에서 216px 까지 줄어든다 — 열이 스킬바를 뚫고 내려갔다
       (단장 지적 2026-08-25). 앱이 세로 9:16 로 고정이라 vh 가 곧 전투 높이다.

       **비례식(Nvh)이 아니라 1차식이다.** 열 위아래의 고정 여백(HUD·스킬바)은
       화면이 커져도 그대로라, 쓸 수 있는 세로는 vh 보다 빠르게 는다. 실측한
       빈 세로(좌측 열 top ↔ 스킬바 top)와 그것을 5로 나눈 한 변:
         812 → 292px / 55   ·   700 → 186px / 35   ·   640 → 136px / 24
       두 점을 지나는 선을 쓴다. **하단 UI 를 화면에 매단 뒤 다시 쟀다**
       (2026-08-25) — 하단·네비가 줄면서 전투 패널이 커져 여유가 통째로 늘었다:
         vh 600 → 24.0   640 → 29.7   700 → 38.6   812 → 55.2  (쓸 수 있는 한 변)
       (600,22)·(812,50) 을 지나는 `13.2vh − 57px` 이 어디서나 8~12% 를 남긴다.
       비례식(Nvh)으로 두면 가장 좁은 화면이 모든 화면을 붙잡아, 640 을 맞추는
       순간 812 가 30px 에 묶인다 (단장 지적 2026-08-25: 더 커도 된다).

       44px 상한은 넓은 화면(#app > 400px)에서 쓰던 원래 크기고, 21px 하한은
       라벨(9px)이 아직 읽히는 크기다:
         812 → 44(상한) · 700 → 35 · 640 → 27 · 600 → 22 */
    /* 선택자 없이 `--sb:...` 만 적으면 무효 선언이라 통째로 버려진다 —
       열에 매달아야 버튼이 물려받는다 */
    .side{--sb:clamp(21px, calc(13.2vh - 57px), 44px)}
    .side button{width:var(--sb);height:var(--sb)}
    /* 아이콘 크기를 여기서 다시 정하지 않는다. 73% 로 줄이면 그림이 버튼
       **왼쪽에 붙어** 서고(블록 요소라 가운데 정렬이 없다), 글자와 알림 점은
       버튼 기준으로 가운데·오른쪽 모서리에 앉는다 — 셋이 6px 씩 어긋난다
       (단장 지적 2026-08-25, 실측 아이콘 중심 22 · 글자와 점 중심 28).
       위 UI 킷 규칙의 `width:100%`(파일 3412행) 가 그대로 이기게 두면
       아이콘이 버튼을 꽉 채우고, 그러면 셋의 기준이 하나가 된다 */
    /* 글자는 여기서도 안 접는다 — 위 max-height 블록과 같은 이유다.
       라벨은 버튼보다 넓은 38px 이지만 사이드 열은 화면 가장자리에
       붙어 있어 안쪽으로만 번지고, 전투 중앙까지는 닿지 않는다 */
    #sideL,#sideR{gap:clamp(2px, .45vh, 3px)}
    /* 우측 열을 **타이머 바로 밑까지** 올린다. 52px 이면 열이 149~245 에 서고
       방치 상자(#chest)가 237 에서 시작해 [절전] 버튼과 8px 겹쳤다
       (단장 지적 2026-08-25, 394x700).

       올릴 자리는 있었다 — HUD 상단의 우측 칸(#hudSide)은 높이가 0 이고
       스테이지 글자는 가운데(x 575~617)에 있어서, 타이머(y 99~119) 아래
       우측 30px 폭은 통째로 비어 있다. 28px 이면 열이 125~221 로 내려앉아
       상자(237~279)와 16px, 스킬바(286~)와 7px 를 띄운다.
       **타이머 밑**이 하한이다 — 더 올리면 시:분 글자와 부딪힌다 */
    #sideR{top:16px}
    /* 퀘스트·상자를 사이드 안쪽으로 더 밀고 낮춘다 */
    /* 전투 영역 **우측 하단 모서리**, 스킬바 바로 위. 예전 값(right 40 · bottom 100)은
       사이드 열도 스킬바도 아닌 허공에 떠 있어 어디에 속한 물건인지 안 읽혔다 */
    /* 크기·높이는 위(#chest 기본 규칙)의 vh clamp 가 정한다 — 여기서 px 로
       다시 박으면 화면 대응이 통째로 죽는다. 좁은 앱에서는 안쪽으로만 민다 */
    #chest{right:8px}
    /* HUD 상단 — 스테이지 글자와 배속 줄을 세로로 분리 */
    #hudTop{align-items:flex-start}
    #stg{font-size:10px;max-width:40cqw}
    #enc{font-size:9px}
    /* 배속 자리를 잡아 주던 규칙들(left/top/max-width)은 전부 지웠다 —
       배속이 상단 재화 줄로 나가면서 전투 HUD 와 다툴 일이 없어졌다 */
    #speed{gap:2px}
    /* 배속이 빠져 보스 도전 버튼 위가 비었다 — 원래 자리로 되돌린다 */
    #speed .sbtn{flex:0 0 auto}
    #timer{position:absolute;top:2px;right:44px;font-size:15px;
      margin:var(--bleed) 0 0}   /* 상단 패널 뒤로 파고든 몫만큼 내린다 */
    /* 중앙 HUD 는 배속 줄(≈96px)과 사이드(40px)를 뺀 폭 안에서만 산다.
       안 그러면 스테이지 글자가 배속 버튼 밑으로 파고든다 */
    /* 중앙 HUD 는 좌(배속 96px)·우(타이머+사이드 80px)를 뺀 폭 안에서만 산다 */
    #hudC{max-width:calc(100cqw - 200px);margin:0 auto}
    #stg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
    /* 퀘스트 이름이 37px 폭에서 잘렸다 — 배너를 넓히고 글자를 줄인다 */
    /* 조우 아이콘 줄이 아래로 자라 퀘스트 배너와 부딪힌다 — 크기와 간격을 줄여
       HUD 상단 안에 가둔다 (360 실측) */
    #enc{margin-top:9px;gap:3px;transform:scale(.72);transform-origin:top center}
    /* 640 높이에서는 전투 패널이 ~205px 라 HUD(위)와 퀘스트 배너(아래)가
       어디에 두든 부딪힌다. 배너를 **전투 영역 밖(하단 패널 위)** 로 옮겨
       충돌원 자체를 없앤다 — 세로가 모자랄 때는 자리를 옮기는 게 답이다 */
    #quest{padding:3px 8px}
    #qbar{height:4px}
    /* 퀘스트 배너가 하단 패널(#fgRow)로 옮겨져 이 자리가 비었다 — 스킬바를
       하단에 붙인다. 34px 는 배너가 여기 있던 시절의 유령 여백이었다 */
    #skillbar{bottom:6px}
    #qname{max-width:none}
    /* 진행 숫자가 보상 줄로 내려가 이름이 배너 폭을 통째로 쓴다 — 9px 말줄임
       대신 10px 두 줄이다. 말줄임은 "무슨 퀘스트인지"를 지워 버린다 */
    #qname{font-size:10px;flex:1 1 auto;min-width:0;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    #qtop{display:flex;gap:4px;align-items:baseline}
    #qprog{flex:0 0 auto}
    /* 스킬바는 폭을 줄이면 8칸이 안쪽에서 넘친다. 대신 **사이드 열을 위로**
       끌어올려 스킬바 높이대(하단)와 안 겹치게 한다 */
    #sideL,#sideR{max-height:52cqh;overflow:visible}
    /* 스킬바가 우측 사이드 아래를 스친다 — 스킬 행만 안쪽으로 (바 자체는 그대로) */
    /* 스킬 8칸 + AUTO. 칸 폭 계산이 max-width 와 어긋나면 마지막 칸이 삐져나온다
       — 둘을 같은 식으로 묶는다 (여백 96px = 사이드 2 x 30 + 간격) */
    /* 스킬 8칸이 이 폭 안에서 최대한 커진다. 96px 을 뺄 이유가 없었다 —
       이 높이에는 좌우 사이드 아이콘 열이 안 내려온다(실측). 56px 이면
       좌우 12px 여백이 남는다 */
    #skills{max-width:calc(100cqw - 56px);flex-wrap:nowrap}
    /* 네비 아이콘이 빨간 점 배지 상자를 넘던 것 */
    .nv.hasnew{overflow:visible}
    /* 스킬바 — 8칸이 가로로 안 넘치게. bottom 은 위(배너 자리 확보)에서 정한다 */
    #skRow{max-width:100%;flex-wrap:nowrap}
    #skills{gap:2px}
    /* 8칸이 #skills(max 100cqw-96px) 안에서 최대한 커지도록. 375 폭에서 32px */
    /* 칸 하나만 정하면 .sk 와 #skAuto 가 같이 따라온다 */
    #skRow{--sk-cell:clamp(26px,calc((100cqw - 80px)/8),40px)}
    #skRow:has(#csChip:not([hidden])) :is(.sk,#csChip,#csChip2){
      width:clamp(24px,calc((100cqw - 80px)/9),36px)}
    #skRow:has(#csChip2:not([hidden])) :is(.sk,#csChip,#csChip2){
      width:clamp(16px,calc((100cqw - 158px)/10),25px)}
    /* VS 연출 — 그림이 세로 공간을 넘지 않게 높이로도 묶는다. 폭 56% 는
       360x640(전투 영역 ~205px)에서 세로로 터졌다.

       **`22cqh` 는 여기서 아무것도 안 했다.** #app 은 `container-type:inline-size`
       라 세로축 컨테이너 단위를 못 푼다 — cqh 는 작은 뷰포트(svh)로 떨어져서
       640 화면에서 141px, 곧 상한이 아니라 무제한이었다. 세로 상한은 부모
       (#vsBoss/#vsCap 의 max-height:42%)가 이미 쥐고 있고 그 42% 는 전투 상자를
       따라간다 — img 는 그 안에 맞추기만 하면 된다 (2026-08-25) */
    #vsBoss,#vsCap{width:42%;height:34%}
    /* 글자 크기는 위 기본 규칙의 vh clamp 가 정한다 — 여기서 px 로 다시 박으면
       600 과 812 가 같은 44px 이 된다 */
    /* 벽 안내 카드 — 좁은 화면은 글자도 한 단계 줄인다 */
    #wallCard{padding:10px 11px}
    #wallCard>b{font-size:12px}
    .w-row{font-size:11px}
    #skAuto{font-size:7px}   /* 폭은 .sk 와 같은 clamp 가 정한다 */
    #dpsInfo{font-size:9px}
  }

  /* ── 아주 낮은 화면 (≤660px) ────────────────────────────────────
     전투 패널이 220px 안팎밖에 안 된다. 우측 가장자리 하나에 타이머·사이드
     3개·방치 상자·스킬바가 줄줄이 서는데, 버튼을 줄여도(24px) 3개 + 상자 =
     121px 이라 쓸 수 있는 111px 을 넘는다 — **하나를 덜어내야 맞는다.**

     덜어낼 것은 [절전]이다. 아레나·랭킹은 매일 누르는 자리지만 절전은 잘 때
     한 번 켜는 것이고, 설정에 같은 줄이 있어 여기서 빠져도 길이 남는다
     (view/rank.js > SettingsScreen, data-a="pwrsave"). 단장 확정 2026-08-25 */
  @media (max-height: 660px){
    #pwrSave{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="row">
      <span id="capbox"><img id="cap" alt=""><span id="caplv">1</span></span>
      <div style="flex:1">
        <div class="sub" id="topNick">단장</div>
        <div id="cpwrap"><span id="cp">0</span></div>
        <div id="xpbar"><div id="xpfill"></div></div>
      </div>
      <!-- 우편은 사이드가 아니라 프로필 줄이다. 사이드는 "지금 눌러야 하는 것"만
           남기고, 우편처럼 언제 봐도 되는 수령함은 프로필 옆에 둔다 -->
      <button id="topMail" class="topIc" data-s="mail" title="우편"><img
        src="/assets/ui/IC-MAIL.png" alt=""
        onerror="this.replaceWith(document.createTextNode('✉'))"></button>
      <button id="topSet" class="topIc" title="설정"><img src="/assets/ui/IC-SETTINGS.png" alt=""
        onerror="this.replaceWith(document.createTextNode('⚙'))"></button>
    </div>
    <!-- 배속이 이 줄에 들어오면서 폭이 빠듯해졌다 — 간격 13 → 8 -->
    <div class="row" style="gap:8px">
      <span class="cur"><img class="cui" src="/assets/ui/CU-01.png" alt=""><b id="c_dia">0</b><button
        id="diaPlus" title="다이아 충전" aria-label="다이아 충전"></button></span>
      <span class="cur"><img class="cui" src="/assets/ui/CU-04.png" alt=""><b id="c_gold">0</b><button
        id="goldPlus" title="골드 획득" aria-label="골드 획득"></button></span>
      <!-- 배속 — 이 줄의 맨 오른쪽 (단장 확정 2026-08-25). 전투 HUD 우상단에서
           옮겨 왔다: 거기서는 타이머·사이드 열·보물상자와 자리를 다퉜다 -->
      <div id="speed">
        <button class="sbtn on" data-sp="1">1x</button>
        <button class="sbtn" data-sp="2">2x</button>
        <button class="sbtn" data-sp="3">3x</button>
      </div>
    </div>
  </div>

  <div id="battle">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div id="hudTop">
        <div class="hudSide"></div>
        <div id="hudC"><div id="stg">스테이지 1</div><div id="enc"></div>
          <button id="bossGo">보스 도전</button></div>
        <!-- 배속은 여기 있었는데 상단 재화 줄로 옮겼다 (2026-08-25) -->
        <div class="hudSide" style="text-align:right">
          <div id="timer">60</div>
        </div>
      </div>
      <div id="hudBot"></div>
    </div>
    <!-- 보스 도전 VS 연출 -->
    <div id="vs">
    <!-- src 는 **비워 두지 않는다.** 빈 문자열은 문서 URL 을 그림으로 요청해
         콘솔에 "Failed to load img: <사이트 주소>" 를 남긴다. 그림은 코드가
         채우므로 여기서는 속성 자체를 안 쓴다 -->
    <div id="vsBoss"><img id="vsBossImg" alt=""></div>
    <div id="vsCap"><img id="vsCapImg" src="/assets/captain/captain_warrior.png" alt=""></div>
    <div id="vsMark">VS</div>
    </div>
    <!-- 퀘스트 배너는 하단 제작대 줄로 옮겼다 (#fgRow 안).
         전투 영역에 두면 사이드 열·조우 점과 자리를 다퉜고, 좁은 화면에서는
         어디에 놓아도 부딪혔다.
         **옛 마크업은 지웠다** — hidden 으로만 두면 #qname·#qrw 가 문서에 둘이 되고
         querySelector 가 숨은 쪽을 먼저 잡아 화면이 영영 안 갱신된다 (실제로 났다) -->
    <!-- 사이드는 축으로 가른다. 좌 = 기간이 있는 것(놓치면 사라진다 → 빨간 점이
         의미를 갖는다), 우 = 경쟁·수령. 훈련소·도감은 성장 시스템이라 용병 시트
         안으로, 우편은 프로필 줄로 옮겼다. 9개 → 5개 -->
    <div class="side" id="sideL">
      <button data-s="mission"><img src="/assets/ui/IC-QUEST.png" alt=""
        onerror="this.onerror=null;this.src='/assets/ui/IC-ATTEND.png'"><span>임무</span></button>
      <button data-s="attend"><img src="/assets/ui/IC-ATTEND.png" alt="" onerror="this.remove()"><span>출석</span></button>
      <button data-s="event"><img src="/assets/ui/IC-EVENT.png" alt="" onerror="this.remove()"><span>이벤트</span></button>
      <button data-s="pass"><img src="/assets/ui/IC-PASS.png" alt="" onerror="this.remove()"><span>패스</span></button>
      <button data-s="friend"><img src="/assets/ui/IC-FRIEND.png" alt=""
        onerror="this.onerror=null;this.src='/assets/ui/IC-MAIL.png'"><span>친구</span></button>
    </div>
    <div class="side" id="sideR">
      <button data-s="arena"><img src="/assets/ui/IC-ARENA.png" alt="" onerror="this.remove()"><span>아레나</span></button>
      <button data-s="rank"><img src="/assets/ui/IC-RANK.png" alt="" onerror="this.remove()"><span>랭킹</span></button>
      <!-- 절전 — 배속 줄에 끼어 있던 것을 옮겼다. 배속과 절전은 하는 일이 달라
           같은 줄에 있으면 네 번째 배속처럼 읽힌다 (실제로 오터치 버그도 났었다) -->
      <button id="pwrSave" title="절전 모드"><img src="/assets/ui/IC-POWERSAVE.png" alt=""
        onerror="this.remove()"><span>절전</span></button>
    </div>
    <button id="chest"><img id="chestImg" src="/assets/ui/CH-01.png" alt=""><span id="chestT">0분</span></button>
    <div id="skillbar"><div id="skRow"><button id="skAuto" class="on" title="스킬 자동 사용">AUTO<i>ON</i></button><div id="skills"></div><button id="csChip" hidden title="전직 스킬"></button><button id="csChip2" hidden title="전직 스킬 2"></button></div></div>
    <div id="result"></div>
    <!-- 던전 층 간판 — 입장하면 위에서 떨어져 박히고, 돌파하면 숫자가 뒤집힌다.
         골드 액수보다 "한 층 올라갔다" 가 진행 실감을 만든다 (연출 기획서 2-2) -->
    <div id="dgSign"><b></b><i></i></div>
    <!-- 탭 유도 — 퀘스트가 가리키는 버튼 위에 고양이 발이 톡톡 두드린다.
         그림(UI-PAW)이 없으면 .nopaw 로 떨어져 링만 두드린다 (main.js showTapHint) -->
    <div id="tapHint" aria-hidden="true">
      <i class="th-ring"></i>
      <img src="/assets/ui/UI-PAW.webp" alt=""
        onerror="this.closest('#tapHint').classList.add('nopaw');this.remove()">
    </div>
    <!-- 던전 포기. 간판이 떠 있는 동안(=던전 전투 중)에만 보인다.
         실수로 누르면 열쇠가 날아가므로 두 번 눌러야 나간다 (main.js dgGiveUp) -->
    <button id="dgQuit">포기</button>
    <!-- 아레나 양측 체력바 — arena.json > presentation.uiRequirement
         "유저가 왜 이겼는지/졌는지를 HP바로 납득해야 한다" -->
    <div id="arBars">
      <div class="ar-me"><b></b><span><i></i></span></div>
      <div class="ar-foe"><b></b><span><i></i></span></div>
    </div>
    <!-- 아레나 점수 카운트업 -->
    <div id="arScore"></div>
    <!-- 벽 안내 — 보스 실패 뒤 요구/현재 CP 와 탈출구. 탭하면 닫힌다 -->
    <div id="wall">
      <div id="wallCard">
        <b>전투력이 부족합니다</b>
        <div class="w-row"><span>요구</span><i id="wallNeed"></i></div>
        <div class="w-row"><span>현재</span><i id="wallMy"></i></div>
        <div class="w-barbox"><div id="wallBar"></div></div>
        <div id="wallGate"></div>
        <div class="lbl" style="margin:8px 0 4px">추천</div>
        <div id="wallGo"></div>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div class="lbl"><span>장비</span><span id="eqInfo"></span></div>
    <div id="eq"><div id="eqL"></div><div id="eqR"></div></div>

    <!-- 퀘스트 — 제작대 왼쪽. 둘 다 "지금 할 일"이라 같은 줄이 제자리다 -->
    <div id="fgRow">
    <div id="quest">
      <!-- 이름이 한 줄을 통째로 쓴다. 진행 숫자를 같은 줄에 두면 이름 자리가
           30% 넘게 깎여 글자가 9px 로 줄고 말줄임이 난다 — 아래 보상 줄로 내렸다 -->
      <div id="qtop"><span id="qname">퀘스트 1</span></div>
      <div id="qbar"><div id="qfill"></div></div>
      <div id="qfoot"><div id="qrw"></div><span id="qprog">0 / 0</span></div>
    </div>
    <div id="fgDock">
      <button id="fgObj" title="탭하여 장비 소환">
        <!-- 전 단계가 4프레임 시트(FO-0N-STRIP) 재생이다. 유휴 = 마지막(휴지) 프레임.
             컷아웃 회전·FG-HAMMER 오버레이는 폐기했다. -->
        <div id="foAnim"></div>
        <span class="badge" id="fgBadge" style="display:none">!</span>
        <span id="fgSpark"></span>
      </button>
      <button id="fgLv">Lv 1</button>
      <button id="b_auto" title="자동 소환"><img src="/assets/ui/UI-GEAR.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'gear',textContent:'⚙'}))"><span class="au-lb">자동</span></button>
      <div id="fgTicket">
        <img class="tk-bg" src="/assets/ui/UI-PILL.png" alt="" onerror="this.remove()">
        <img class="tk-ic" src="/assets/ui/CU-07.png" alt="">
        <b id="fgTicketN">0</b>
      </div>
    </div>
    </div><!-- /#fgRow -->
  </div>

  <!-- 채팅 — 제작대 패널 밖. 가로로 길게 한 줄 -->
  <!-- 처음엔 비어 있다. 진짜 대화가 들어오면 chatBarSync 가 채운다 —
       가짜 공지를 돌리던 것을 걷어냈다 (단장 지시 2026-08-26) -->
  <div id="chat"><span class="who"></span><span id="chatline"></span></div>


  <div id="nav">
    <!-- 아이콘이 아직 없으면 onerror 로 스스로 사라지고 글자만 남는다.
         에셋을 넣으면 코드 수정 없이 붙는다 (에셋_생성_프롬프트.md 9-5) -->
    <div class="nv on" data-tab="merc"><img src="/assets/ui/IC-MERC.png" alt="" onerror="this.remove()"><span>용병</span></div>
    <div class="nv" data-tab="skill"><img src="/assets/ui/IC-SKILL.png" alt="" onerror="this.remove()"><span>스킬</span></div>
    <div class="nv" data-tab="dungeon"><img src="/assets/ui/IC-DUNGEON.png" alt="" onerror="this.remove()"><span>던전</span></div>
    <div class="nv" data-tab="alliance"><img src="/assets/ui/IC-ALLIANCE.png" alt="" onerror="this.remove()"><span>연합</span></div>
    <div class="nv" data-tab="shop"><img src="/assets/ui/IC-SHOP.png" alt="" onerror="this.remove()"><span>상점</span></div>
  </div>

  <!-- 편성 시트 — 용병/스킬 탭. 아래에서 올라와 화면 60% 를 덮는다 -->
  <div id="sheetBg"></div>
  <div id="sheet">
    <div id="shHead">
      <!-- 제목과 요약은 한 덩어리다. 요약을 독립 줄로 두면 22px 를 통째로 먹는데
           담는 건 회색 한 줄이라, 그만큼 목록에서 빠진다 -->
      <div id="shHeadL"><span id="shT"></span><div id="shSum"></div></div>
      <!-- 훈련소·도감은 사이드에서 여기로 왔다. 둘 다 용병·스킬 성장이라
           편성 화면이 제자리다. 글자 대신 사이드와 같은 아이콘 — 같은 그림이
           자리만 옮겼다는 게 읽힌다 -->
      <button class="sh-go" data-go="training" title="훈련소"><img
        src="/assets/ui/IC-TRAIN.png" alt="훈련소" onerror="this.replaceWith(document.createTextNode('훈련소'))"></button>
      <button class="sh-go" data-go="codex" title="도감"><img
        src="/assets/ui/IC-CODEX.png" alt="도감" onerror="this.replaceWith(document.createTextNode('도감'))"></button>
      <button class="sh-go" data-go="promo" title="전직"><img
        src="/assets/ui/IC-PROMO.png" alt="전직"
        onerror="this.onerror=null;this.src='/assets/ui/IC-TRAIN.png'"></button>
      <button id="shX">닫기</button>
    </div>
    <!-- 프리셋 3칸 — 탭하면 불러오고 [저장]으로 현재 편성을 기록한다 -->
    <div id="shPre"></div>
    <div id="shEq"></div>
    <div id="shBody"></div>
    <div id="shAct">
      <!-- 금/갈은 roster.js 가 매 렌더마다 정한다 — 할 일이 있으면 .go(금색),
           없으면 갈색이다. 여기 class 는 첫 프레임의 폴백일 뿐이다 -->
      <button class="rt-b" id="shEqBtn">자동장착</button>
      <button class="rt-b" id="shUp">자동강화</button>
    </div>
  </div>

  <!-- 소환 레벨 상세 — 확률표 + 레벨 보상 수령. 상점(z70) 위에 뜬다 -->
  <div id="smPop">
    <div id="smCard">
      <div id="smHead"><b id="smTitle">소환 레벨</b><button id="smX">✕</button></div>
      <div id="smBody"></div>
    </div>
  </div>

  <!-- 모래시계 사용 — 제작대 패널(#ov z60) **위**에 뜨는 별도 창.
       인라인으로 펼치면 제작대 카드가 늘었다 줄었다 하며 아래 내용이 밀린다 -->
  <div id="hgPop">
    <div id="hgCard">
      <div id="hgHead"><b>시간 단축</b><button id="hgX">✕</button></div>
      <div id="hgBody"></div>
    </div>
  </div>

  <!-- 유닛 상세 — 용병은 도감 일러(-ART)를 배경으로 크게. 시트(z65) 위 -->
  <div id="unit">
    <div id="unitCard">
      <button id="unitX">✕</button>
      <!-- src 를 비우면 문서 URL 을 그림으로 요청한다 (vsBossImg 주석 참고) -->
      <div id="unitArt"><img id="unitImg" alt=""></div>
      <div id="unitBody">
        <div id="unitHead"><b id="unitName"></b><i id="unitGrade"></i></div>
        <div id="unitTags"></div>
        <!-- 스킬 설명 문장. 용병은 비워 두고 display:none 으로 접는다 -->
        <div id="unitDesc"></div>
        <div id="unitRows"></div>
        <div id="unitAct"></div>
      </div>
    </div>
  </div>

  <div id="ov">
    <div id="ovcard">
      <i id="ovskin"></i>
      <!-- 닫기는 헤더 밖, 카드 직속이다 — #ovh 가 position:relative 라 안에 두면
           absolute 가 헤더 안쪽 여백 기준으로 앉아 모서리에서 23px 떴다 (실측) -->
      <button id="ovx">닫기</button>
      <div id="ovh">
        <span id="ovt"></span>
        <span id="ovcur"></span>
        <button id="ovi" title="해금 정보">i</button>
      </div>
      <div id="ovb"></div>
      <div id="ovinfo"></div>
    </div>
  </div>
  <div id="idle"><div class="id-card">
    <h3>방치 보상</h3>
    <div class="id-time" id="idTime"></div>
    <div class="id-row"><img src="/assets/ui/CU-04.png" alt=""><b id="idGold">0</b></div>
    <div class="id-btns">
      <button id="idOk">수령</button>
      <button id="idAd" class="ad">광고 보고 2배</button>
    </div>
    <div class="id-alt">
      <span><b>2시간 보상 즉시 수령</b><span id="idFreeN"></span></span>
      <button id="idFree">받기</button>
    </div>
    <div class="id-alt">
      <span><b>광고 보고 2시간 더</b><span id="idAdN"></span></span>
      <button id="idAdInstant" class="ad">광고</button>
    </div>
    <button id="idClose" style="margin-top:10px;width:100%;background:none;border:none;
      color:var(--dim);font-size:11px;cursor:pointer;font-family:inherit">닫기</button>
  </div></div>
  <div id="lvup"><div><b></b><span></span></div></div>
</div><!-- /#app — 아래 넷은 **app 밖**이다. 절전이 #app 을 display:none 하므로
     안에 두면 덮개까지 같이 사라진다 (실제로 그랬다) -->

  <!-- 부트 로딩 — 데이터·씬이 서기 전까지 이게 화면의 전부다.
     첫 실행이면 진행이 끝난 뒤 언어 선택이 겹쳐 뜬다 -->
<div id="boot">
  <!-- 타이틀 레이어 (에셋 문서 21절 `TT-*`). 전부 장식이므로 그림이 없으면
       스스로 빠진다 — 배경은 CSS 가 BG-01 로 떨어진다.
       fetchpriority=low: 이 그림들이 data/*.json 보다 먼저 받아지면
       로딩 화면을 꾸미느라 로딩이 늦어진다 -->
  <div id="bootFx" aria-hidden="true">
    <img id="ttRay" src="/assets/ui/TT-RAY.webp" alt="" fetchpriority="low"
      onerror="this.remove()">
    <!-- 구름 두 벌. 한 벌이 왼쪽으로 다 빠질 때 다른 벌이 이어 들어온다 -->
    <div id="ttClouds">
      <img src="/assets/ui/TT-CLOUD.webp" alt="" fetchpriority="low"
        onerror="this.parentElement.remove()">
      <img src="/assets/ui/TT-CLOUD.webp" alt="" fetchpriority="low">
    </div>
    <img id="ttFore" src="/assets/ui/TT-FORE.webp" alt="" fetchpriority="low"
      onerror="this.remove()">
  </div>
  <!-- 표준 모바일 로딩 구도: 중앙 = 타이틀(간판), 하단 = 진행바.
       바를 중앙에 두면 타이틀과 싸운다 -->
  <div id="bootMain">
    <!-- 간판 — 제목은 그림 **안쪽 나무판 위**에 앉는다. 그림이 안 뜨면
         .nologo 로 떨어져서 제목만 글자로 남는다 (이름이 사라지면 안 된다) -->
    <div id="bootSign">
      <img id="bootLogo" src="/assets/ui/GT-LOGO.webp" alt=""
        onerror="this.parentElement.classList.add('nologo');this.remove()">
      <b id="bootTitle">냥냥 용병단</b>
    </div>
    <!-- 영문 부제(NYANG NYANG MERCENARIES)는 뺐다 (2026-08-25). 간판이 이미
         이름을 크게 말하고 있어서 같은 말을 두 번 하는 줄이었다 -->
  </div>
  <div id="bootBottom">
    <div id="bootBar"><i id="bootFill"></i></div>
    <span id="bootMsg">냥이들을 깨우는 중…</span>
    <!-- 로딩이 끝나면 진행바 자리를 이게 대신한다 (#boot.ready).
         문구는 main.js 가 t() 로 다시 쓴다 — 여기 한국어는 폴백이다 -->
    <b id="bootStart">화면을 눌러 시작</b>
  </div>
  <div id="bootLang">
    <b>언어 / Language</b>
    <!-- 버튼은 i18n.js > LANGS 가 만든다 -->
    <div id="bootLangBtns"></div>
  </div>
</div>

<!-- 절전 덮개 — #app **밖**이다. 안에 두면 VS(z30)·상단바·네비가 덮개 위로
     새고, #app 을 통째로 숨기는 것도 불가능해진다. 밀어서 해제 -->
<div id="pwrveil">
  <div class="pv-cat">
    <img src="/assets/captain/captain_sleep.png" alt=""
      onerror="this.onerror=null;this.src='/assets/captain/captain_warrior.png';this.classList.add('fallback')">
    <span class="pv-z"><i>z</i><i>z</i><i>Z</i></span>
  </div>
  <div class="pv-clock">00:00</div>
  <b>절전 중</b>
  <span>전투·보상은 계속 진행됩니다</span>
  <div class="pv-stats"><span id="pvStage"></span><span id="pvGold"></span></div>
  <!-- 손잡이는 절전 아이콘 그림이다. 없으면 onerror 가 지우고 예전 이모지가
       남는다 — 손잡이가 통째로 비면 무엇을 미는지가 안 보인다 -->
  <div id="pvTrack">
    <div id="pvHandle"><img src="/assets/ui/IC-POWERSAVE.png" alt=""
      onerror="this.replaceWith('\u{1F4A4}')"></div><i>밀어서 해제</i></div>
</div>
<div id="toast"></div>
<div id="gains"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script type="module" src="./src/main.js"></script>
<div id="txtDlg"><div class="td-box">
  <b id="tdTitle"></b>
  <input id="tdIn" maxlength="15" autocomplete="off">
  <div class="td-row"><button id="tdNo"></button><button id="tdOk" class="ok"></button></div>
</div></div>
</body>
</html>
