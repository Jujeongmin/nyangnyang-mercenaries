<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>냥냥 용병단</title>
<link rel="stylesheet" href="/assets/font/fonts.css">
<style>
  :root{
    /* ── 리스킨 v2 (2026-08-23) ───────────────────────────────────
       전 버전은 차가운 청회색(#1c1612 계열)이었다. 게임은 초원·냥이·나무 방패의
       따뜻한 판타지인데 UI 는 SF 대시보드 색이라 그림과 화면이 따로 놀았다.
       기준을 **따뜻한 갈색 목재 + 황동**으로 옮긴다. 구조·레이아웃은 그대로다 —
       토큰 값만 갈면 전 화면이 같이 바뀐다 (그래서 색을 토큰으로 모아 둔 것이다). */
    --bg:#1a1410; --panel:#2a2018; --panel2:#3a2c20; --line:#5a4632;
    --txt:#f5ecdc; --dim:#b09a7e; --gold:#ffc94a; --dia:#5ad8ff; --ore:#ff8a4a;
    --up:#7fd86a; --warn:#ff6b5a;
    /* 파생 토큰 — 아래 셋이 화면의 실질 표면색이다. 하드코딩 51종을 이 셋으로
       정규화했다 (2026-08-23). 새 카드·칸을 만들 때도 이걸 쓴다:
         --card  일반 카드·칸 바탕      --ink  깊은 바탕(캡슐·게이지 홈)
         --ink2  카드 안의 한 단계 깊은 칸 */
    /* --card 는 9-slice 프레임 그림의 속색과 **같아야** 한다 (실측 49,34,22).
       2 씩만 어긋나도 프레임 안쪽에 사각 테가 보인다 */
    --card:#312216; --ink:#150f0b; --ink2:#241a12;
    /* 강조 라인 — 황동. 카드 위쪽 하이라이트와 활성 테두리에 쓴다 */
    --brass:#c9a227;
  }
  /* 텍스트 선택·이미지 끌기 차단. 모바일에서 길게 누르면 UI 가 잡혀 끌린다 */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
  button img,#fgObj img{pointer-events:none}
  input,textarea{-webkit-user-select:text;user-select:text}

  /* 숫자 서체. Black Han Sans 로 두면 획이 두껍고 속공간이 좁아 11~13px 에서
     6·8·9 가 서로 뭉갠다 — "굵다"와 "읽힌다"는 다른 문제다. 숫자는 시스템
     굵은 산세리프로 뽑는다(속공간이 넓다). 게임 제목만 디스플레이체로 남긴다. */
  #timer,#stgNum,.q-prog,#idGold,.er-card .er-d,.er-card b,
  .gain,.rk-sc,.al-sum b,.al-mem-c,.at-cell em,.at-cum em,
  .sh-price,.sh-cur b,#fgLv,.tw-rw,#pvGold,#wallNeed,#wallMy{
    font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",
      "Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.2px}
  /* 상단 재화는 **가장 오래 보는 숫자**다. 시스템 산세리프는 읽히긴 해도
     이 화면(둥근 카툰 냥이)과 톤이 안 맞아 사무적으로 보였다.
     본문체(Jua)로 되돌리되, 얇은 획을 stroke 로 메워 가독성을 지킨다 —
     Jua 는 굵기가 하나뿐이라 이 방법이 아니면 힘이 안 실린다 */
  #cp,.cur b,#caplv{
    font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.4px;
    -webkit-text-stroke:.45px currentColor;paint-order:stroke fill;
    text-shadow:0 1px 2px #000a}
  #bootTitle{font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400;
    letter-spacing:.3px}
  /* PC 에서는 앱(세로 화면)이 창을 다 못 채운다 — 남는 좌우를 **검정으로 두면
     게임이 작아 보인다.** 타이틀 배경을 흐리게 깔아 화면 전체가 한 장면으로
     읽히게 한다 (단장 지적 2026-08-25). 폰에서는 앱이 100% 라 안 보인다 */
  html,body{margin:0;height:100%;background:#0f0b08;color:var(--txt);overflow:hidden;
    font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  body{background:
    linear-gradient(#0f0b08cc,#0f0b08cc),
    url(/assets/ui/TT-BG.webp) center/cover no-repeat #0f0b08}

  /* 스킬 아이콘 — 22종 중 14종이 **투명 배경 없이 사각 통짜**로 생성됐다.
     **에셋은 전부 원형으로 정리됐다** (사각 14종을 원형으로 클립, 2026-08-22).
     그래서 페이드를 82% 에서 99% 로 좁혔다 — 옛 값은 정상 아이콘의 바깥 18% 까지
     같이 흐려서 아이콘이 실제보다 작아 보였다.
     규칙 자체는 남긴다. 새로 뽑은 아이콘이 또 사각으로 나와도 모서리만 잘리고
     원형 디스크는 그대로 통과한다 — 안전망이 공짜다. */
  img[src*="/skill/"]{
    -webkit-mask-image:radial-gradient(circle closest-side,#000 99%,#0000 100%);
    mask-image:radial-gradient(circle closest-side,#000 99%,#0000 100%)}

  /* 스크롤바 — 전역으로 감춘다.
     OS 기본 스크롤바는 회색 각진 막대라 어느 화면에 떠도 판타지 UI 킷과 안 맞고,
     세로형 모바일 게임이라 실제로는 손가락으로 미는 것이 전제다. 스크롤은 그대로
     되고 막대만 안 보인다. **새 스크롤 영역을 만들 때 여기 규칙을 따른다** —
     개별 화면에서 다시 노출시키지 않는다. */
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{width:0;height:0;display:none}
  /* container 선언 — 아래 좁은화면 규칙이 뷰포트가 아니라 **앱 폭**을 본다 */
  /* 이 게임은 **세로형 모바일이 기준**이고 PC 는 그 화면을 창에 맞춰 키워 보여
     주는 것뿐이다. 그러니 폭은 비율 하나로 정해진다 — 9:16, 곧 높이의 56.25%.
     `--aspect` 하나만 고치면 #app 과 #boot 이 같이 따라온다.

     예전에는 `max(62vh, 52vw)` 였다. PC 에서 좌우가 검다는 지적에 vw 항을
     넣었는데, **vw 항에는 비율 상한이 없다.** 창이 넓고 낮을수록 앱이 정사각에
     가까워져서 1190x700 에디터 창에서 619x700(0.88)이 나왔다 — 전투 패널이
     2.29:1 로 퍼져 세로 게임이 아니게 됐다 (단장 지적 2026-08-25, 9:16 확정).

     좌우 검은 띠는 **버그가 아니라 세로 게임의 레터박스**다. 비율을 지키는
     값이지 없애야 할 낭비가 아니다. 폰에서는 100% 가 이겨 그대로 꽉 찬다.
     900px 상한은 그 위로 가면 글자·아이콘이 태블릿처럼 커져서 둔다
     (높이 1600px 이 넘는 창에서만 걸린다) */
  :root{--aspect:.5625}   /* 9:16 */
  /* **높이 기준은 --vhpx 다** (없으면 100vh). 키보드가 올라오면 브라우저가
     뷰포트를 줄이는데, 그때 100vh 로 다시 재면 게임이 통째로 압축된다 —
     입력 중에는 JS 가 --vhpx 갱신을 멈춰 직전 크기를 픽셀로 붙잡는다
     (단장 지적 2026-08-27, main.js > vhpx 관리자) */
  #app{container:app / inline-size;
    position:relative;width:min(100%, calc(var(--vhpx, 100vh) * var(--aspect)), 900px);
    height:100%;margin:0 auto;
    background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

  /* 상단 12% */
  #top{flex:0 0 10%;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;justify-content:center;padding:6px 10px;gap:5px}
  .row{display:flex;align-items:center;gap:8px}
  /* 상단 줄의 세 덩치(단장 얼굴·전투력·재화 아이콘)도 화면 높이에 매단다.
     .slot·네비와 같은 이유다 — 셋 다 픽셀로 박혀 있어서 낮은 화면일수록
     상단 띠가 차지하는 비율이 커졌다 (600 에서 16%, 기준 812 에서는 12%) */
  #cap{width:clamp(27px, 4.43vh, 36px);height:clamp(27px, 4.43vh, 36px);
    border-radius:50%;background:#544437;object-fit:cover;
    border:2px solid var(--gold)}
  #cp{font-weight:800;font-size:clamp(14px, 2.22vh, 18px);color:var(--gold);line-height:1}
  .sub{font-size:11px;color:var(--dim)}
  /* 재화 캡슐 — 아이콘이 왼쪽에 겹쳐 올라탄 어두운 pill. 숫자가 판 위에 앉는다 */
  /* 0.7 배로 줄였다 (단장 확정 2026-08-25) — 글자 15→11, 여백·아이콘·[+] 도 같은 비율.
     배속이 같은 줄에 들어오면서 셋이 폭을 나눠 쓰게 됐다 */
  .cur{display:flex;align-items:center;gap:0;font-size:11px;color:var(--dim);
    background:#17120fc8;border:1px solid #ffffff1c;border-radius:10px;
    padding:2px 8px 2px 2px;box-shadow:inset 0 1px 3px #0008}
  .cur b{color:var(--txt);font-weight:800;margin-left:4px;
    font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
  /* [+] — 재화에서 상점으로 가는 지름길. 키우기 장르 공통 문법 */
  /* [+] — 재화에서 상점으로 가는 지름길. 재화마다 색을 달리하면(초록·금)
     "무엇을 뜻하는 색인가" 가 생겨 버린다. 같은 황동 단추 하나로 통일한다 */
  /* line-height 로 세로 중앙을 맞추면 글꼴마다 1~2px 씩 어긋난다 — flex 로 잡는다 */
  #diaPlus,#goldPlus{width:14px;height:14px;margin-left:5px;padding:0;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;line-height:1;
    border:0;background:url(/assets/ui/UI-PLUS.png) center/contain no-repeat;
    color:transparent;font-size:0;cursor:pointer;font-family:inherit;
    box-shadow:none}
  #diaPlus:active,#goldPlus:active{transform:scale(.9);filter:brightness(.92)}
  .dot{width:9px;height:9px;border-radius:50%}
  .cui{width:clamp(11px, 1.9vh, 15px);height:clamp(11px, 1.9vh, 15px);object-fit:contain}

  /* 전투 40% */
  /* 전투 화면은 위·아래 패널 **뒤로 파고든다.** 배경이 패널 경계에서 딱 시작하고
     딱 끝나면 그 선이 잘린 자국으로 읽힌다 — 하늘과 바닥이 나무틀 뒤로 이어져
     있어야 한 장면이 된다. 패널은 z-index 로 위에 띄운다.
     **대가**: #battle 상자가 위아래로 --bleed 만큼 커져서, 그 안에 픽셀로 붙여
     둔 자식들(사이드 열·스킬바·상자)이 그만큼 밀린다 — 아래에서 되돌린다 */
  #app{--bleed:18px}
  #top,#bottom{position:relative;z-index:2}
  /* **isolation 이 핵심이다.** 전투 상자는 위아래 패널 뒤로 파고드는데, 그 안의
     높은 z-index 자식들(#vs 30 · #wall 28 · 스킬바 20 …)이 층위를 안 가르면
     패널(z 2)과 같은 무대에서 경쟁해 패널 위로 그려진다 — VS 연출이 전투
     화면을 넘어 위아래로 새어 나왔다 (단장 지적 2026-08-25).
     독립 층위로 만들면 안쪽 z-index 는 상자 안에서만 겨룬다 */
  #battle{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:#1e1710;
    isolation:isolate;z-index:0;
    margin-top:calc(var(--bleed) * -1);margin-bottom:calc(var(--bleed) * -1)}
  /* 파고든 만큼 되돌린다 — 이 값들은 "패널에서 얼마 떨어졌나"라서 상자가
     커져도 눈에 보이는 거리는 그대로여야 한다.
     **top/bottom 이 아니라 margin 으로 민다.** 이 요소들의 top·bottom 은 화면
     크기별로 여러 번 다시 정해지는데(container query), 여기서 top 을 덮으면
     그 조정이 통째로 죽는다. margin 은 그 값들과 더해지므로 안 부딪힌다 */
  #sideL,#sideR,#arBars{margin-top:var(--bleed)}
  #skillbar,#chest{margin-bottom:var(--bleed)}
  #cv{display:block;width:100%;height:100%}
  /* 위아래 --bleed 는 패널에 가려진 띠다 — HUD 는 그만큼 안쪽에서 시작한다 */
  #hud{position:absolute;inset:0;pointer-events:none;
    padding:calc(6px + var(--bleed)) 9px calc(6px + var(--bleed));
    display:flex;flex-direction:column;justify-content:space-between}
  #hudTop{display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 1px 3px #000}
  /* 진행도는 상단 중앙. 좌우 칸이 같은 폭이라야 가운데가 진짜 가운데다 */
  .hudSide{flex:1 1 0;min-width:0}
  #hudC{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px}
  #hudC #stg{justify-content:center}
  #stg{font-size:13px;font-weight:800;display:flex;align-items:baseline;gap:6px}
  #stg i{font-style:normal;font-size:10px;font-weight:600;color:#ffe4cf;opacity:.85}
  /* 화살표가 점 위 12px 에 서므로 **그 높이만큼 스테이지 이름과 띄운다.**
     2px 이던 시절엔 화살표가 이름 글자를 6px 파고들었다 */
  #enc{display:flex;gap:5px;margin-top:11px;justify-content:center}
  /* 지금 진행 중인 조우 위에 작은 화살표. 점만 있으면 "몇 번째를 하는 중"이
     안 읽힌다 — 지나온 것과 남은 것 사이 경계가 보여야 한다 */
  #enc .dotw{position:relative}
  /* 화살표는 점 **가운데** 위에 선다. margin 으로 중앙을 잡고 transform 은
     애니메이션에만 쓴다 — 둘을 섞으면 keyframes 가 정렬을 덮어써서 옆으로 밀린다 */
  /* **글자(▾)가 아니라 그린 삼각형이다.** 글자는 글꼴마다 좌우 여백이 달라
     점 한가운데에 안 선다. 삼각형은 left:50% + margin-left 로 자기 폭의 절반을
     되돌리므로 점 크기(잡몹 9px·보스 12px)와 무관하게 정확히 가운데다.
     가운데 정렬을 transform 으로 하면 안 된다 — encBob 이 transform 을 덮어쓴다 */
  #enc .dotw.now::before{content:"";position:absolute;left:50%;top:-12px;
    width:0;height:0;margin-left:-7px;
    border-left:7px solid transparent;border-right:7px solid transparent;
    border-top:9px solid var(--gold);
    filter:drop-shadow(0 1px 2px #000);
    animation:encBob .9s ease-in-out infinite}
  @keyframes encBob{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
  /* 보스에 진 뒤의 잡몹 반복 — 진행도 점은 의미가 없다(보스로 안 가니까).
     점을 감추고 도는 화살표로 "루프 중"임을 말한다. */
  #farmLoop{display:none;align-items:center;justify-content:center;gap:5px;margin-top:2px;
    font-size:10px;font-weight:800;color:#ffd76a;text-shadow:0 1px 3px #000}
  #farmLoop i{font-style:normal;font-size:13px;line-height:1;
    display:inline-block;animation:farmSpin 1.3s linear infinite}
  @keyframes farmSpin{to{transform:rotate(360deg)}}
  #hudC.farm #enc{display:none}
  #hudC.farm #farmLoop{display:flex}
  .dotw{width:9px;height:9px;border-radius:50%;background:#705b4a;border:1px solid #0007}
  .dotw.on{background:var(--gold)}
  .dotw.boss{width:12px;height:12px;background:#6a3040}
  .dotw.boss.on{background:var(--warn)}
  /* 배속은 **상단 재화 줄(다이아·금화)의 맨 오른쪽**이다 (단장 확정 2026-08-25).
     예전에는 전투 패널 우상단에 절대배치로 떠 있었는데, 그 자리가 타이머·
     사이드 열·보물상자와 계속 자리를 다퉜다 — 좁은 화면마다 left/right/top 을
     따로 잡아 주는 규칙이 셋이나 붙어 있었다. 재화 줄에 흐름으로 넣으면
     그 다툼이 통째로 사라지고, 상시 노출이라는 성격도 재화와 같다 */
  #timer{margin-top:18px;font-size:22px;font-weight:900;letter-spacing:1px}
  #timer.low{color:var(--warn)}
  #hudBot{display:flex;justify-content:space-between;align-items:flex-end}
  /* 재화 줄의 남은 자리를 전부 밀어 오른쪽 끝에 붙는다 */
  #speed{display:flex;gap:4px;pointer-events:auto;justify-content:flex-end;
    margin-left:auto;flex:0 1 auto;min-width:0}
  /* 배속 — 세 칸이 하나의 **황동 토글 바**다. 전에는 낱개 회색 버튼이라
     화면의 나머지(황동 프레임 · 금색 강조)와 따로 놀았다 */
  #speed{background:#17120fd8;border:1px solid #c9a22755;border-radius:11px;
    padding:2px;gap:0;box-shadow:inset 0 1px 3px #0009, 0 1px 3px #0007}
  /* 전투 HUD 우상단에 끼어 있던 시절에는 타이머·사이드 열을 피하느라 작았다.
     재화 줄로 나오면서 자리가 생겼으니 키운다 (단장 확정 2026-08-25).
     화면 높이에 매단다 — 재화 알약(.cur)과 같은 줄에 서므로 같이 줄어야 한다 */
  /* 키우되 **가로보다 세로·글자를 먼저 키운다.** 재화 줄의 남은 폭은 금화
     자릿수가 늘면 같이 줄어드는데, 가로 여백을 키우면 그 줄이 제일 먼저 터진다
     (실측: 좌우 15px 이면 배속이 앱 밖으로 27px 나갔다).
     flex:0 1 auto + min-width:0 은 마지막 안전장치다 — 자릿수가 더 늘면
     넘치는 대신 배속이 먼저 좁아진다 */
  /* 0.5 배로 줄였다 (단장 확정 2026-08-25). 여백은 그대로 절반이고,
     **글자만 예외로 10px 이다** — 14px 의 절반인 7px 은 "1x·2x" 가 안 읽힌다.
     flex:0 1 auto + min-width:0 은 안전장치다: 금화 자릿수가 늘어 줄이 빠듯해지면
     넘치는 대신 배속이 먼저 좁아진다 */
  .sbtn{background:none;border:0;color:var(--dim);border-radius:9px;
    flex:0 1 auto;min-width:0;
    padding:clamp(3px,.55vh,5px) clamp(4px,.65vh,6px);
    font-size:clamp(9px,1.23vh,10px);font-weight:800;cursor:pointer;
    font-family:inherit;letter-spacing:.3px;transition:color .12s}
  .sbtn.on{background:linear-gradient(180deg,#ffd76a,#e8a72c);color:#2a1c05;
    box-shadow:0 1px 4px #0008, inset 0 1px 0 #fff6}
  .sbtn:not(.on):not(.lock):active{color:var(--txt)}
  /* 출석 — 7일 격자 + 월 누적 줄 */
  /* 전직 줄 — 훈련소 화면 하단 */
  .pm-row{display:flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:6px}
  .pm-t{flex:1;min-width:0}
  .pm-t b{display:block;font-size:13px}
  /* 안내 줄이 좁은 화면에서 "…Lv" / "40" 처럼 접히던 것 — 낱말 유지 + 말줄임 */
  .pm-t i{display:block;font-style:normal;font-size:10px;color:var(--dim);margin-top:1px;
    word-break:keep-all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pm-m{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--gold);
    font-family:"Black Han Sans","Jua",system-ui,sans-serif}
  .pm-row button{flex:0 0 84px;min-height:32px;font-size:11px}

  .at-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
  .at-cell{position:relative;background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:7px 6px;text-align:center;min-height:64px}
  .at-cell b{display:block;font-size:10px;margin-bottom:3px;color:var(--dim)}
  .at-cell em{display:flex;align-items:center;justify-content:center;gap:3px;
    font-style:normal;font-size:11px;font-weight:800;color:#ffe9a8;margin-top:2px}
  .at-cell em img{width:22px;height:22px;object-fit:contain;
    filter:drop-shadow(0 2px 4px #0008)}
  .at-cell.done{opacity:.55}
  .at-cell.done i{position:absolute;right:5px;top:4px;font-style:normal;color:#8cf59a}
  .at-cell.now{border-color:var(--gold);box-shadow:0 0 8px -2px var(--gold)}
  .at-cell.hi{background:linear-gradient(140deg,#2a2412,var(--card) 70%)}
  .at-cum{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:6px 10px;margin-bottom:6px;font-size:11px}
  .at-cum span:first-child{flex:0 0 44px;font-weight:800}
  .at-cum em{display:flex;align-items:center;gap:3px;font-style:normal;font-weight:800;
    color:#ffe9a8;margin-right:6px}
  .at-cum em img{width:19px;height:19px;object-fit:contain}
  .at-cum button{min-height:30px;font-size:11px;flex:0 0 62px;margin-left:auto}
  .at-cum.done{opacity:.55}

  /* ── 부트 로딩 ── */
  /* #app 과 **같은 세로 기둥**에 맞춘다 (width:100%;max-width:480px;margin:0 auto).
     inset:0 만 두면 데스크톱에서 로딩만 창 전체로 퍼져서, 탭한 순간 480px
     세로 화면으로 확 줄어든다 — 같은 게임의 두 화면이 다른 비율로 보인다.
     left/right 가 0 이라 max-width 가 남긴 여백을 margin:auto 가 반씩 먹어
     가운데로 선다. 기둥 밖은 body 색(#0f0b08) — 게임 화면의 레터박스와 같다 */
  /* 폭은 #app 과 **같은 식**이다 — 다르면 로딩 화면만 좌우 여백이 달라
     시작하자마자 화면이 덜컥 넓어진다 (단장 지적 2026-08-25).
     같은 --aspect 를 읽으므로 한 곳만 고치면 둘이 같이 움직인다 */
  #boot{position:fixed;inset:0;margin:0 auto;
    width:min(100%, calc(var(--vhpx, 100vh) * var(--aspect)), 900px);
    z-index:210;display:flex;flex-direction:column;
    align-items:center;overflow:hidden;
    /* 두 장을 겹쳐 깐다 — **위 칸이 404 면 아래 칸이 그대로 보인다.**
       타이틀 전용 그림(TT-BG)이 없던 시절의 화면(BG-01)이 폴백이다 */
    background:url(/assets/ui/TT-BG.webp) center/cover,
               url(/assets/bg/BG-01.webp) center/cover}
  /* 비네트. TT-BG 는 아래쪽이 이미 어둡게 그려져 있어(21-2 의 가림 표)
     예전만큼 덮을 필요가 없다 — 덮으면 하늘색이 죽는다 */
  #boot::before{content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 40%,#150f0b00,#150f0b88 88%)}
  #boot.hide{opacity:0;pointer-events:none;transition:opacity .4s}
  /* ── 타이틀 레이어 (TT-*) ──
     그림은 전부 정지 이미지 한 장이고 움직임은 여기서 만든다 (에셋 규칙 1-4).
     transform·opacity 만 건드려서 매 프레임 다시 칠할 것이 없다 */
  #bootFx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  /* 빛줄기 — screen 합성이라 검은 픽셀은 사라지고 밝은 부분만 더해진다 */
  #ttRay{position:absolute;left:-12%;top:-5%;width:124%;
    mix-blend-mode:screen;animation:ttRayBreathe 9s ease-in-out infinite}
  @keyframes ttRayBreathe{0%,100%{opacity:.2}50%{opacity:.4}}
  /* 구름 — 두 벌이 한 벌 폭(180%)씩 어긋나 서 있다가 같이 왼쪽으로 흐른다.
     그림 좌우 끝이 투명이라(21-4) 이어지는 지점이 안 보인다 */
  #ttClouds{position:absolute;left:0;top:4%;width:100%;height:26%}
  #ttClouds img{position:absolute;top:0;width:180%;height:auto;opacity:.9;
    animation:ttDrift 80s linear infinite}
  #ttClouds img:first-child{left:0}
  #ttClouds img:last-child{left:180%}
  @keyframes ttDrift{to{transform:translateX(-180%)}}
  /* 전경 풀 — **이어붙이지 않는다.** 화면보다 넓게 깔고 좌우로 조금 흔들 뿐이라
     이음매 자체가 없다. 구름과 반대로 느리게 움직여 깊이가 생긴다 */
  #ttFore{position:absolute;left:-9%;bottom:-2%;width:118%;
    animation:ttSway 26s ease-in-out infinite alternate}
  @keyframes ttSway{from{transform:translateX(0)}to{transform:translateX(3.5%)}}
  /* 반짝이 — 그림 한 장을 main.js 가 여러 개 뿌린다 (bootSparks) */
  .tt-spark{position:absolute;opacity:0;
    animation:ttTwinkle 3.4s ease-in-out infinite}
  @keyframes ttTwinkle{0%,100%{opacity:0;transform:scale(.55)}
    50%{opacity:.9;transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){
    #ttRay,#ttClouds img,#ttFore,.tt-spark,#bootSign{animation:none}
    #ttRay{opacity:.3}
    .tt-spark{opacity:.65}
  }

  #bootMain{position:relative;flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px}
  /* 간판. 흔들리는 것은 그림이 아니라 **간판 통째**다 — 글자가 판에 박혀
     있어야 하니 둘이 따로 움직이면 안 된다.
     container 를 선언해 글자 크기를 간판 폭에 매단다(cqi = 폭의 1%).
     px 로 두면 좁은 폰에서 그림만 줄고 글자는 그대로라 판 밖으로 넘친다 */
  /* 간판이 아주 조금 떠 있다. 원래 `pvBob` 을 불렀는데 **그런 키프레임이
     이 파일 어디에도 없었다** — 이름만 있고 움직임은 없었다. 여기서 정의한다.
     이름을 tt- 로 바꾼 것은 pv- 가 절전 덮개(#pwrveil)의 접두사라서다 */
  /* 간판 폭 — 글자 크기는 여기에 매달려 있다(10cqi). 좁은 폰에서도 판이 커야
     두 줄 제목이 읽힌다 (단장 확정 2026-08-25) */
  /* 폭은 **vw 로만** 잰다. % 로 두면 부모(#bootMain)가 내용에 맞춰 줄어드는
     쪽이라 서로를 참조해 값이 작게 굳는다 (실측 202px) */
  #bootSign{container:sign / inline-size;position:relative;width:min(340px,84vw);
    animation:ttBob 3.4s ease-in-out infinite}
  /* 3px 이면 충분하다. 더 흔들면 간판이 아니라 풍선이 된다 */
  @keyframes ttBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  /* **filter 를 쓰지 않는다.** drop-shadow 를 걸면 크롬이 이 그림을 별도
     합성 레이어로 굽는데, 그 레이어 사각형이 하늘 위에 뿌옇게 비친다 —
     간판 주위로 네모난 얼룩이 보인다 (단장 지적 2026-08-26).
     언어 선택 화면에서 특히 눈에 띈다: 그때 간판이 300px 로 작아져
     매끈한 하늘 한가운데 놓이기 때문이다.
     will-change·translateZ(0)·isolation 다 시험했지만 안 없어졌고,
     filter 를 빼는 것만이 확실했다. 그림자는 버린다 (단장 확인). */
  #bootLogo{display:block;width:100%}
  /* 나무판 안쪽 — GT-LOGO.png(512²) 실측 좌 92 우 420 상 222 하 332 을
     비율로 옮긴 값이다. 그림을 갈면 이 네 숫자를 다시 잰다 */
  /* **줄바꿈은 코드가 정한다** (main.js > fitBootTitle). nowrap 이라 브라우저가
     제멋대로 접지 않고, 넘치면 scrollWidth 로 잡혀 글자가 줄어든다.
     여기서 접기를 허용하면 폭 초과가 감지되지 않아 축소가 안 걸리고, 영어가
     "Nyang / Nyang / Mercenaries" 세 줄이 된다 (단장 지적 2026-08-25) */
  #bootTitle{position:absolute;left:19%;right:19%;top:43.5%;height:21.5%;
    display:flex;align-items:center;justify-content:center;
    text-align:center;line-height:1.05;white-space:nowrap;
    font-size:10cqi;letter-spacing:.5px;
    /* 색·굵기 주의:
       · Black Han Sans 는 **굵기가 400 하나뿐**이다. 900 을 주면 브라우저가
         가짜 굵게를 씌워 획이 서로 붙고 받침이 뭉갠다. 400 이 원래 굵기다
       · 금색(--gold)을 나무판 위에 올리면 밝기가 비슷해 글자가 판에 잠긴다.
         크림색 + 어두운 테두리로 간다 — 판에 새긴 글씨의 대비다 */
    font-weight:400;color:#fff3d6;
    -webkit-text-stroke:.7px #3a220e;paint-order:stroke fill;
    text-shadow:0 2px 0 #40260f, 0 3px 8px #0009}
  /* 그림이 없을 때 — 옛 배치(그냥 큰 글자)로 돌아간다 */
  #bootSign.nologo{width:auto;animation:none}
  #bootSign.nologo #bootTitle{position:static;height:auto;font-size:34px;
    letter-spacing:1px;color:var(--gold);-webkit-text-stroke:0;
    text-shadow:0 3px 0 #7a4a00, 0 6px 14px #000c, 0 0 30px #ffc94a66}
  #bootBottom{position:relative;flex:0 0 auto;width:100%;display:flex;
    flex-direction:column;align-items:center;gap:7px;padding:0 26px 34px}
  /* 전경 풀(TT-FORE)이 화면 아래 약 13% 를 먹는다. 진행바와 시작 문구가
     그 위에 얹히면 풀·꽃과 글자가 겹쳐 지저분해진다 — 풀 위로 올린다.
     :has 라서 **그림이 없으면 이 규칙도 안 걸린다** (예전 여백 그대로) */
  #boot:has(#ttFore) #bootBottom{padding-bottom:104px}
  #bootBar{width:100%;max-width:340px;height:12px;background:#17120fcc;
    border:1px solid #3a2c12;border-radius:7px;overflow:hidden;
    box-shadow:inset 0 2px 4px #000a}
  #bootFill{display:block;height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#b8860b,var(--gold) 60%,#ffe9a8);
    box-shadow:0 0 10px #ffc94a88;transition:width .3s}
  #bootMsg{font-size:11px;color:#e8d9b0;text-shadow:0 1px 3px #000}
  /* 탭하여 시작 — 로딩이 끝나면(#boot.ready) 진행바·플레이버가 빠지고
     이것만 남는다. 둘을 같이 두면 "다 됐는데 왜 안 넘어가지" 로 읽힌다.
     자리를 뺏지 않도록 진행바와 같은 높이(12px+7px gap)를 물려받는다 */
  /* Jua 도 굵기가 400 하나다 — 800 은 가짜 굵게라 작은 글자에서 먼저 뭉갠다.
     힘은 stroke 로 준다 (#cp 와 같은 수법). 배경이 풀밭·하늘로 밝을 때도
     읽히도록 금색이 아니라 크림색이다 */
  #bootStart{display:none;font-size:15px;font-weight:400;letter-spacing:1px;
    color:#fff3d6;-webkit-text-stroke:.5px #2a1a0c;paint-order:stroke fill;
    text-shadow:0 2px 0 #40260f, 0 3px 10px #000b;
    padding:9px 0 8px}
  #boot.ready{cursor:pointer}
  #boot.ready #bootBar,#boot.ready #bootMsg{display:none}
  #boot.ready #bootStart{display:block;animation:bootStartPulse 1.7s ease-in-out infinite}
  @keyframes bootStartPulse{0%,100%{opacity:.5;transform:scale(.98)}
    50%{opacity:1;transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){
    #boot.ready #bootStart{animation:none;opacity:.95}
  }
  /* 언어 선택 — 진행이 끝나면 첫 실행에만 뜬다 */
  /* **띄우지 않고 세로 기둥에 끼운다.** 예전에는 absolute + top:62% 였는데,
     그 62% 는 화면 높이의 62% 지 상자 높이와는 아무 상관이 없다. 언어가 다섯
     줄로 늘어나 상자가 274px 이 되자 667px 짜리 화면에서 아래가 20px 잘려
     繁體中文 버튼이 #boot 의 overflow:hidden 에 먹혔다 (단장 지적 2026-08-25).
     흐름에 끼우면 위 칸(#bootMain)이 남는 만큼만 차지하므로 **몇 줄이 되든
     상자가 화면 밖으로 못 나간다.** 그래도 모자라면 상자 안에서 스크롤한다 */
  #bootLang{position:relative;z-index:2;flex:0 0 auto;
    max-height:calc(100% - 24px);overflow-y:auto;margin-bottom:5vh;
    display:none;flex-direction:column;gap:7px;align-items:center;
    background:var(--card)f2;border:1px solid var(--gold);border-radius:14px;
    padding:16px 22px;box-shadow:0 16px 50px #000c}
  /* 위 칸이 줄어들 수 있어야 한다 — min-height 기본값(auto)이면 flex 항목은
     내용보다 작아지지 않아서 상자를 도로 밀어낸다. 간판도 같이 조금 줄인다 */
  #boot:has(#bootLang.show) #bootMain{min-height:0;overflow:hidden}
  #boot:has(#bootLang.show) #bootSign{width:min(300px,72vw)}
  /* 그리고 **하단(진행바·플레이버)을 감춘다.** 언어를 고를 때까지 로딩은 어차피
     멈춰 있어 진행도가 의미가 없는데, 상자 아래쪽 안내문과 겹쳐서 글자가
     서로를 파고들었다 (실측: 상자 503~716 · 진행바 674~686 · 문구 693~708).
     흐름에 들어온 뒤로는 자리를 남길 이유가 없다 — display 로 통째로 뺀다 */
  #boot:has(#bootLang.show) #bootBottom{display:none}
  #bootLang.show{display:flex}
  #bootLang>b{font-size:13px}
  #bootLangBtns{display:flex;flex-direction:column;gap:7px}
  #bootLang button{width:190px;padding:9px 0;font:inherit;font-size:13px;font-weight:800;
    background:var(--ink2);border:1px solid #6b543a;border-radius:9px;color:var(--txt);
    cursor:pointer}
  #bootLang button:active{transform:translateY(1px)}
  /* 안내문 — **어절 단위로 접는다.** keep-all 이 없으면 "표시됩니 / 다" 처럼
     단어 한가운데가 잘린다. balance 는 두 줄의 길이를 비슷하게 맞춘다 */
  #bootLang>span{font-size:9px;color:var(--dim);max-width:190px;text-align:center;
    line-height:1.5;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}

  /* 절전 덮개 — AOD 풍. 새카만 바탕에 시계·달만 */
  /* 완전 불투명 검정 — OLED 에서 검은 픽셀은 꺼진 픽셀이다. 캔버스도
     stage.visible=false 로 안 그린다 (scene.setPowerSave) */
  /* #boot 과 같은 이유로 #app 의 세로 기둥에 맞춘다 — 덮개만 창 전체로 퍼지면
     해제한 순간 480px 화면으로 줄어든다. 기둥 밖은 body 색이 그대로 보이고,
     어차피 그 색(#0f0b08)이 덮개의 검정과 거의 같아 티가 안 난다 */
  #pwrveil{position:fixed;inset:0;width:100%;max-width:480px;margin:0 auto;
    z-index:200;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:7px;background:#000;
    touch-action:none}
  #pwrveil.show{display:flex}
  /* 자는 단장. **정지 이미지 한 장**이다 — 캔버스는 stage.visible=false 로
     꺼져 있고, 여기서 스프라이트를 돌리면 절전이 절전이 아니게 된다.
     움직이는 것은 transform 과 opacity 뿐이라 컴포지터가 처리하고 리페인트가 없다 */
  .pv-cat{position:relative;width:132px;height:132px;display:flex;
    align-items:flex-end;justify-content:center;margin-bottom:2px}
  /* 달빛 — 이미지가 아니라 정지 그라디언트다. 애니메이션을 걸면 매 프레임
     다시 칠해야 해서 OLED 에서 검은 픽셀을 꺼 두는 이득이 사라진다 */
  .pv-cat::before{content:"";position:absolute;left:50%;top:-6px;
    width:150px;height:150px;transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(circle,#1b2436 0%,transparent 70%)}
  .pv-cat img{width:118px;height:auto;object-fit:contain;opacity:.72;
    filter:grayscale(.35) brightness(.78);
    animation:pvBreathe 5.4s ease-in-out infinite}
  @keyframes pvBreathe{0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-4px) scale(1.015)}}
  /* 전용 취침 에셋(captain_sleep)이 없어 전투 포즈로 떨어졌을 때만 기울인다.
     조는 자세로라도 읽히게 하는 대역이고, 에셋이 들어오면 저절로 안 걸린다 */
  .pv-cat img.fallback{animation-name:pvBreatheTilt}
  @keyframes pvBreatheTilt{0%,100%{transform:rotate(7deg) translateY(0) scale(1)}
    50%{transform:rotate(7deg) translateY(-4px) scale(1.015)}}
  .pv-z{position:absolute;right:6px;top:4px;display:flex;align-items:flex-start;gap:2px}
  .pv-z i{font-style:normal;font-weight:800;color:#a8907d;opacity:0;
    animation:pvZ 3.6s ease-in-out infinite}
  .pv-z i:nth-child(1){font-size:11px;animation-delay:0s}
  .pv-z i:nth-child(2){font-size:14px;animation-delay:.5s}
  .pv-z i:nth-child(3){font-size:18px;animation-delay:1s}
  @keyframes pvZ{0%{opacity:0;transform:translateY(6px)}
    25%{opacity:.85}60%{opacity:.5}100%{opacity:0;transform:translateY(-16px)}}
  @media (prefers-reduced-motion:reduce){
    .pv-cat img,.pv-z i{animation:none}
    .pv-z i{opacity:.55}
  }
  .pv-clock{font-size:34px;font-weight:200;letter-spacing:3px;color:#f2e5db}

  /* 손잡이 그림 — 사이드 열의 절전 버튼과 **같은 아이콘**이다 (IC-POWERSAVE).
     예전에는 💤 이모지였는데, 이모지는 기기마다 글꼴이 달라 안드로이드·iOS·PC
     에서 서로 다른 그림이 나오고 판타지 킷과도 안 맞았다.

  #pvHandle img{width:22px;height:22px;object-fit:contain;pointer-events:none;

  /* 잠긴 배속 — 숨기지 않는다. 안 보이면 해금이 보상으로 안 읽힌다 */
  .sbtn.lock{opacity:.4;color:var(--dim)}

  #result{position:absolute;inset:0;display:none;align-items:center;justify-content:center;

  /* ── 탭 유도 손 ──
     퀘스트가 가리키는 버튼 위에 고양이 발이 톡톡 두드린다.

     **좌표를 복사하지 않는다.** main.js 는 손을 목표 버튼의 **자식으로 옮기기만**
     하고, 자리는 여기 % 가 정한다 — 버튼이 움직이든 창이 바뀌든 시트가
     스크롤되든 손은 붙어 있다. 예전에는 fixed 에 픽셀을 박아 한 번만 쟀고,
     1190x700 → 900x620 으로 창을 줄이면 145x80px 어긋난 채 빈 곳을 가리켰다
     (단장 지적 2026-08-25).

     62%/58% 는 버튼의 오른쪽 아래에 걸치는 값이다 — 가운데에 두면 정작
     눌러야 할 그림을 손이 덮는다. 버튼 밖으로 조금 나가는 것이 정상이다 */
  #tapHint{position:absolute;left:62%;top:58%;
    z-index:120;display:none;pointer-events:none;
    width:44px;height:44px}
  #tapHint.show{display:block}
  /* 목표가 position:static 이면 손이 그 버튼이 아니라 더 위 조상을 기준으로
     앉는다. **그럴 때만** relative 를 씌운다 — 이미 relative/absolute 인 버튼에
     덧씌우면 그 버튼의 자리가 틀어진다 (main.js > showTapHint 가 판단한다) */
  .th-host{position:relative}
  /* 던전 줄은 배경 그림을 자르려고 overflow:hidden 이다 — 여기서만 손이 아래로
     넘치면 잘린다. 줄 안쪽 바닥에 붙여 넘칠 일을 없앤다 */
  .dg > #tapHint{top:auto;bottom:4px}
  #tapHint img{position:absolute;left:0;top:0;width:100%;height:100%;
    object-fit:contain;filter:drop-shadow(0 3px 6px #000a);
    animation:tapPaw 1.15s ease-in-out infinite}
  /* 발이 내려찍는 순간에 맞춰 링이 퍼진다 */
  #tapHint .th-ring{position:absolute;left:50%;top:2px;width:34px;height:34px;
    margin-left:-17px;border-radius:50%;border:2px solid var(--gold);opacity:0;
    animation:tapRing 1.15s ease-out infinite}
  /* 그림이 없을 때 — 링만 두드린다. 유도 자체는 남는다 */
  #tapHint.nopaw .th-ring{width:44px;height:44px;margin-left:-22px;border-width:3px}
  @keyframes tapPaw{0%,100%{transform:translateY(0) rotate(-8deg)}
    35%{transform:translateY(-13px) rotate(-14deg)}
    55%{transform:translateY(0) rotate(-8deg)}}
  @keyframes tapRing{0%,52%{transform:scale(.6);opacity:0}
    60%{opacity:.9}100%{transform:scale(1.5);opacity:0}}
  @media (prefers-reduced-motion:reduce){
    #tapHint img{animation:none}
    #tapHint .th-ring{animation:none;opacity:.8}
  }

  /* 아레나 패배 — 캔버스가 회색으로 빠진다 */

     방향이라 어느 막대가 누구 것인지 읽을 필요가 없다 */
  /* 좌우 54px 안쪽 — 전폭으로 깔면 사이드 버튼 열을 가로지른다

  #app.arena #stg,#app.arena #enc,#app.arena #timer{display:none}

  #arScore{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);

  /* ── 던전 층 간판 ──
     전투 화면 위쪽에 걸린다. 상단바(#top)와 HUD 아래, 유닛 위 */
  #dgSign{position:absolute;left:50%;top:8%;z-index:6;display:none;

  #dgSign::before,#dgSign::after{content:"";position:absolute;top:6px;width:5px;height:5px;
    border-radius:50%;background:#d9b25a;box-shadow:inset 0 -1px 1px #0008}
  #dgSign::before{left:8px} #dgSign::after{right:8px}

  /* 위에서 떨어져 박힌다 — 끝에서 살짝 튕기는 것은 위 cubic-bezier 가 만든다 */
  @keyframes dgDrop{from{transform:translate(-50%,-140%)}to{transform:translate(-50%,0)}}
  /* 돌파 — 간판이 가로축으로 한 바퀴 뒤집히고 그 사이에 숫자가 바뀐다 */
  /* 포기 — 간판 **바로 아래 중앙**. 타격 이펙트는 화면 가운데 아래에서 터지므로
     이 높이는 대체로 안 겹치고, 좌우 아이콘 열과도 안 부딪힌다.
     작게 두는 것은 의도다 — 자주 쓸 버튼이 아니고 오터치가 비싸다(열쇠 1개) */
  /* 간판과 **같은 기준선(top:8%)** 에서 출발해 간판 높이(56px)+여백만큼 내린다.
     % 로 따로 잡으면 화면이 길어질수록 간판에서 멀어지고, 짧으면 간판 위로 겹친다 —
