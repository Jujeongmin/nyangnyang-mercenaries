  .al-emblem{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 4px 8px #0009)}
  .al-hero-t{flex:1;min-width:0}
  /* 히어로 줄 안의 재화 아이콘 — 규칙이 없으면 원본(1024px)이 그대로 터진다 (실제로 났다) */
  .al-hero-t img{width:12px;height:12px;object-fit:contain;vertical-align:-2px}
  .al-hero-t b{font-size:14px;display:flex;align-items:center;gap:6px}
  .al-lv{font-style:normal;font-size:10px;color:var(--ink);background:var(--gold);
    border-radius:5px;padding:1px 5px;font-weight:900}
  .al-hero-t>span{display:block;font-size:10px;color:var(--dim);margin-top:2px;
    display:flex;align-items:center;gap:3px}
  .al-hero-t em{display:block;font-style:normal;font-size:10px;color:#c8b19f;
    margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .al-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .al-sum>div{background:var(--ink2);border:1px solid var(--line);border-radius:9px;
    padding:7px 4px;text-align:center}
  .al-sum span{display:block;font-size:9px;color:var(--dim);margin-bottom:2px}
  .al-sum b{font-size:12px;display:flex;align-items:center;justify-content:center;gap:3px}
  .al-sum img{width:13px;height:13px}
  /* 보스 */
  .al-boss{display:flex;gap:11px;align-items:center;margin-bottom:8px}
  .al-boss img{width:84px;height:84px;object-fit:contain;
    filter:drop-shadow(0 6px 14px #000b)}
  .al-boss-t b{font-size:14px;display:block}
  .al-boss-t span{font-size:10px;color:var(--dim)}
  .al-hpbar{position:relative;height:16px;background:var(--ink);border:1px solid #3a2430;
    border-radius:9px;overflow:hidden;margin-bottom:8px}
  .al-hpbar i{display:block;height:100%;
    background:linear-gradient(90deg,#c62828,#ff7a6a);border-radius:8px}
  .al-hpbar b{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-size:10px;text-shadow:0 1px 2px #000}
  /* 단원 */
  .al-mem{display:flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:5px;
    font-size:12px}
  .al-mem.me{border-color:var(--gold)}
  .al-mem-t{flex:1;min-width:0}
  .al-mem-t b{display:block;font-size:12px}
  .al-mem-t i{font-style:normal;font-size:9px;color:var(--dim)}
  .al-mem-c{display:flex;align-items:center;gap:3px;font-weight:800;color:var(--gold);
    font-size:11px}
  .al-mem-c img{width:13px;height:13px}
  .al-on{flex:0 0 auto;font-size:9px;color:#8cf59a}
  .al-on.off{color:var(--dim)}

  /* ── 기부 계단 ── 톤이 단계 성격을 나른다: 무료 초록 · 골드 호박 · 다이아 청록.
     같은 남색 카드로 다섯 번 누르면 무엇이 달라졌는지 안 보인다 */
  .dn-track{display:flex;align-items:center;justify-content:center;gap:2px;
    margin:8px 0 10px}
  .dn-line{flex:1;height:2px;background:#ffffff1f;max-width:16px}
  .dn-pip{width:34px;display:flex;flex-direction:column;align-items:center;gap:2px;
    opacity:.4;transition:opacity .18s}
  .dn-pip img{width:19px;height:19px;object-fit:contain;filter:grayscale(1)}
  .dn-pip em{font-style:normal;font-size:8px;color:var(--dim);white-space:nowrap}
  .dn-pip.done{opacity:.85}
  .dn-pip.done img{filter:none}
  .dn-pip.done em{color:var(--good,#5ad884);font-weight:800}
  .dn-pip.now{opacity:1;transform:scale(1.16)}
  .dn-pip.now img{filter:none;
    filter:drop-shadow(0 0 7px var(--dn-au))}
  .dn-pip.now em{color:var(--dn-au);font-weight:800}
  [data-tone="free"]{--dn-au:#5ad884}
  [data-tone="gold"]{--dn-au:#ffc94a}
  [data-tone="dia"] {--dn-au:#5ad8ff}
  [data-tone="done"]{--dn-au:#b5a69a}

  .dn-card{position:relative;display:flex;flex-direction:column;align-items:center;
    gap:4px;padding:14px 12px 12px;border-radius:14px;
    background:radial-gradient(120% 90% at 50% 0%, color-mix(in srgb,var(--dn-au) 26%,transparent), #0000),
      var(--card);
    border:2px solid color-mix(in srgb,var(--dn-au) 45%,var(--line));
    box-shadow:0 0 22px color-mix(in srgb,var(--dn-au) 18%,transparent) inset;
    animation:dnIn .22s ease-out}
  @keyframes dnIn{from{transform:translateY(6px) scale(.97);opacity:.2}}
  .dn-no{font-size:9px;font-weight:800;letter-spacing:1px;color:var(--dn-au);
    background:#17120faa;border:1px solid color-mix(in srgb,var(--dn-au) 40%,transparent);
    border-radius:999px;padding:2px 9px}
  .dn-ico{width:58px;height:58px;object-fit:contain;margin:2px 0;
    filter:drop-shadow(0 3px 10px color-mix(in srgb,var(--dn-au) 60%,transparent))}
  .dn-card b{font-size:14px;font-weight:800}
  .dn-desc{font-size:10px;color:var(--dim);text-align:center}
  .dn-trade{display:flex;align-items:center;gap:8px;margin:6px 0 2px;
    font-size:13px;font-weight:800}
  .dn-trade i{font-style:normal;color:var(--dim);font-size:11px}
  .dn-trade img{width:15px;height:15px;object-fit:contain;vertical-align:-3px;
    margin-right:3px}
  .dn-give{color:#f5eee9}
  .dn-get{color:var(--gold)}
  .dn-get img{width:15px;height:15px}
  .dn-have{font-size:10px;color:var(--dim)}
  .dn-have img{width:12px;height:12px;object-fit:contain;vertical-align:-2px;margin:0 2px}
  .dn-have.lack{color:var(--warn,#ff6b6b);font-weight:800}
  .dn-go{width:100%;margin-top:6px}
  /* 지갑 — 기부에 쓰는 재화 세 종을 한 줄에 */
  .dn-wallet{display:flex;gap:6px;margin-bottom:2px}
  .dn-wallet span{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;
    background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:6px 4px;font-size:11px;font-weight:800}
  .dn-wallet img{width:14px;height:14px;object-fit:contain}

  .al-dn{display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:7px 0}
  .al-dn>div{flex:1}
  .al-dn b{display:block;font-size:12px}
  .al-dn span{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:3px}
  .al-dn span img{width:13px;height:13px}
  .al-dn button{flex:0 0 76px;min-height:34px;font-size:12px}

  /* 소환 레벨 창 — 상점(z70) 위 */
  #smPop{position:absolute;inset:0;z-index:74;display:none;align-items:center;
    justify-content:center;background:#120e0bc8;padding:16px}
  #smPop.show{display:flex}
  #smCard{width:100%;max-width:320px;max-height:82%;display:flex;flex-direction:column;
    background:var(--bg);border:1px solid var(--gold);border-radius:14px;overflow:hidden;
    box-shadow:0 14px 44px #000c}
  #smHead{display:flex;align-items:center;padding:10px 12px;background:var(--panel);
    border-bottom:1px solid var(--line);flex:0 0 auto}
  #smHead b{flex:1;font-size:14px;color:var(--gold)}
  #smX{background:none;border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:4px 9px;cursor:pointer;font-family:inherit;font-size:12px}
  #smBody{padding:12px;overflow-y:auto}
  /* 확률표 — 지금 구간은 금색으로 두드러지게 */
  .sm-band{display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:5px;
    background:var(--card);border:1px solid var(--line);border-radius:9px;font-size:11px}
  .sm-band.now{border-color:var(--gold);background:linear-gradient(90deg,#3a2c12,var(--card))}
  .sm-band .lv{flex:0 0 62px;color:var(--dim);font-weight:800}
  .sm-band.now .lv{color:var(--gold)}
  .sm-band .rates{flex:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .sm-band .rates span{font-weight:800;
    font-family:"Black Han Sans","Jua",system-ui,sans-serif}
  .sm-band .lv em{font-style:normal;font-size:9px;margin-left:4px;font-weight:800}
  /* 지금 확률 — 등급 한 줄씩, 개별 확률까지 */
  .sm-now{background:var(--card);border:1px solid var(--gold);border-radius:11px;
    padding:10px 11px;margin-bottom:8px}
  .sm-nh{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;font-size:12px;color:var(--dim)}
  .sm-nh b{font-size:15px;color:var(--gold);
    font-family:"Black Han Sans","Jua",system-ui,sans-serif}
  .sm-nh span{margin-left:auto;font-size:11px}
  .sm-g{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11px}
  .sm-g + .sm-g{border-top:1px solid var(--line)}
  .sm-g i{flex:0 0 7px;height:7px;border-radius:50%}
  .sm-g b{flex:0 0 34px;font-size:12px;
    font-family:"Black Han Sans","Jua",system-ui,sans-serif}
  .sm-p{margin-left:auto;font-weight:800;
    font-family:"Black Han Sans","Jua",system-ui,sans-serif}
  .sm-e{flex:0 0 90px;text-align:right;color:var(--dim);font-size:10px}
  /* 다음 해금 — 계단의 다음 칸이 이 창의 두 번째 질문이다 */
  .sm-next{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;
    color:var(--dim);background:var(--panel);border:1px dashed var(--line);
    border-radius:9px;padding:8px 10px}
  .sm-next b{font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-size:12px}
  .sm-next span{margin-left:auto;color:var(--gold);font-weight:800}
  .sm-all{width:100%;margin:10px 0 8px;padding:8px;cursor:pointer;font-family:inherit;
    font-size:11px;font-weight:800;color:var(--dim);background:var(--panel);
    border:1px solid var(--line);border-radius:9px}
  #smTable{max-height:230px;overflow-y:auto;margin-bottom:8px}
  #smTable[hidden]{display:none}

  /* 모래시계 사용 창 — 제작대(z60)보다 위, 유닛 상세(z76)보다 아래 */
  #hgPop{position:absolute;inset:0;z-index:72;display:none;align-items:center;
    justify-content:center;background:#120e0bc0;padding:16px}
  #hgPop.show{display:flex}
  #hgCard{width:100%;max-width:300px;background:var(--bg);border:1px solid var(--gold);
    border-radius:14px;overflow:hidden;box-shadow:0 14px 44px #000c}
  #hgHead{display:flex;align-items:center;padding:10px 12px;background:var(--panel);
    border-bottom:1px solid var(--line)}
  #hgHead b{flex:1;font-size:14px;color:var(--gold)}
  #hgX{background:none;border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:4px 9px;cursor:pointer;font-family:inherit;font-size:12px}
  #hgBody{padding:12px}
  #hgBody .hg-left{display:flex;justify-content:space-between;font-size:12px;
    margin-bottom:10px}
  #hgBody .hg-left b{font-family:"Black Han Sans","Jua",system-ui,sans-serif;
    color:var(--gold)}

  /* 유닛 상세 — 일러가 주인공이다. 카드 위쪽 60% 를 그림에 준다 */
  #unit{position:absolute;inset:0;z-index:76;display:none;align-items:center;
    justify-content:center;background:#120e0bd8}
  #unit.show{display:flex}
  #unitCard{position:relative;width:86%;max-width:330px;max-height:86%;overflow:hidden;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    display:flex;flex-direction:column;
    box-shadow:0 18px 60px #000c, 0 0 24px -6px var(--ug, #0000)}
  #unitX{position:absolute;right:9px;top:9px;z-index:3;width:30px;height:30px;
    border-radius:50%;background:#17120fc8;border:1px solid var(--line);
    color:var(--txt);font-size:13px;cursor:pointer}
  #unitArt{position:relative;height:300px;background:var(--ink);overflow:hidden}
  #unitArt img{width:100%;height:100%;object-fit:cover;object-position:center top}
  /* 그림 아래를 패널색으로 녹여 글 영역과 잇는다 */
  #unitArt::after{content:"";position:absolute;inset:0;
    background:linear-gradient(#0000 72%, var(--panel))}
  /* 스킬 등 일러가 없는 것 — 아이콘을 가운데 크게 */
  #unitArt.icon img{width:52%;height:auto;margin:11% auto 0;display:block;object-fit:contain;
    filter:drop-shadow(0 8px 24px #000a)}
  #unitBody{padding:11px 14px 14px}
  #unitHead{display:flex;align-items:baseline;gap:8px}
  #unitHead b{font-size:17px}
  #unitHead i{font-style:normal;font-size:11px;font-weight:900;color:var(--ink);
    padding:1px 7px;border-radius:6px;background:var(--ug,#b5a69a)}
  #unitTags{display:flex;gap:5px;margin:6px 0 8px;flex-wrap:wrap}
  #unitTags span{font-size:10px;color:var(--dim);background:var(--ink2);
    border:1px solid var(--line);border-radius:6px;padding:2px 7px}
  #unitDesc{font-size:11px;line-height:1.5;color:#e6d7cb;background:var(--ink2);
    border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;
    word-break:keep-all}
  #unitRows .frow{padding:6px 2px}
  #unitAct{margin-top:9px}
  #unitAct .rt-b{width:100%}

  /* 벽 안내 — 전투 영역 위 오버레이. z 는 result(기본) 위, VS(30) 아래 */
  #wall{position:absolute;inset:0;z-index:28;display:none;align-items:center;
    justify-content:center;background:#120e0bc8}
  #wall.show{display:flex}
  #wallCard{width:82%;max-width:300px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:13px 14px;
    /* 640 높이에서 전투 영역이 ~205px 라 카드가 밖으로 48px 나갔다.
       영역 안에 가두고 안에서 스크롤한다 */
    max-height:94%;overflow-y:auto}
  #wallCard>b{display:block;font-size:14px;color:var(--warn);margin-bottom:8px}
  .w-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
  .w-row span{color:var(--dim)}
  .w-row i{font-style:normal;font-weight:800}
  .w-barbox{height:7px;background:var(--ink);border-radius:4px;overflow:hidden;margin:6px 0}
  #wallBar{height:100%;background:var(--gold);border-radius:4px}
  #wallGate{font-size:10px;color:var(--dim);line-height:1.5}
  #wallGo{display:flex;flex-direction:column;gap:5px}
  #wallGo button{background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:8px;font:inherit;font-size:12px;cursor:pointer;text-align:left}
  #wallGo button:active{transform:translateY(1px)}
  #result.show{display:flex}

  /* 하단 40% */
  #bottom{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
    padding:6px 8px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
  .lbl{font-size:10px;color:var(--dim);letter-spacing:.5px;display:flex;
    justify-content:space-between;align-items:center}

  /* 사이드 아이콘 — 전투 화면 좌우에 세로로 뜬다 (ui.json > topBar.sideIcons) */
  /* 좌측 열은 상단 UI 에 바로 붙인다. 우측은 배속(1x2x3x) 줄이 있어 그 아래서 시작 */
  .side{position:absolute;top:4px;z-index:18;display:flex;flex-direction:column;gap:4px}
  #sideR{top:56px}
  #sideL{left:6px}
  #sideR{right:6px}
  /* 사이드 열도 화면 폭을 따라간다 — 38px 고정이면 PC(앱 720px)에서 혼자
     작게 남아 스킬 칸(64px) 옆에서 초라해 보인다 (단장 지적 2026-08-25) */
  .side button{width:clamp(38px,10cqw,58px);padding:5px 0;font-size:9px;font-weight:700;cursor:pointer;
    color:var(--txt);background:var(--ink)cc;border:1px solid #ffffff22;border-radius:8px;
    box-shadow:0 2px 6px #0007}
  .side button img{display:block;width:78%;height:auto;aspect-ratio:1;margin:0 auto 1px;
    object-fit:contain;filter:drop-shadow(0 1px 3px #000a);pointer-events:none}
  .side button span{display:block;line-height:1.1}
  .side button:has(img){padding:4px 0 3px}
  .side button:active{transform:translateY(1px)}
  .side button.hasnew::after{content:'';position:absolute;top:-3px;right:-3px;
    width:9px;height:9px;border-radius:50%;background:var(--warn);
    box-shadow:0 0 6px var(--warn)}
  .side button{position:relative}
  #capbox{cursor:pointer}

  /* 스킬바 — 전투 화면 위에 떠 있다. 패널 배경 없음 */
  #skillbar{position:absolute;left:0;right:0;bottom:6px;z-index:20;
    display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
  #skillbar #skills{pointer-events:auto}
  #dpsInfo{font-size:10px;color:#f2e5db;text-shadow:0 1px 3px #000,0 0 6px #000}
  #skills{max-width:calc(100cqw - 62px);display:flex;justify-content:center;gap:6px}
  /* 칸 폭 = (쓸 수 있는 폭 - 칸 사이 간격) / 칸 수.
     **쓸 수 있는 폭은 좌우 사이드 열을 뺀 값이다** — 그걸 안 빼면 넓은 화면에서
     줄이 사이드 아이콘 밑으로 파고든다 (단장 지적 2026-08-25).
     사이드 한 쪽이 최대 58px + 바깥 여백이라 좌우로 넉넉히 150px 을 뺀다.

     **칸 수를 박아 두지 않는다.** 예전에는 9(AUTO + 액티브4 + 패시브4)로
     나눴는데, 단장 스킬처럼 칸이 하나라도 늘면 폭 계산이 어긋나 줄이 화면
     밖으로 나갔다 (단장 지적 2026-08-26). renderSkills 가 실제 칸 수를
     --sk-n 으로 넣어 주고, 여기서는 그 값으로 나눈다. */
  #skRow{--sk-n:9;--sk-gap:6px;
    --sk-cell:clamp(22px,calc((100cqw - 150px - (var(--sk-n) - 1) * var(--sk-gap))/var(--sk-n)),64px)}
  #skills{gap:var(--sk-gap)}
  .sk{position:relative;width:var(--sk-cell);aspect-ratio:1;
    height:auto;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle at 50% 35%,#2b3650cc,#1c1612cc);
    border:2px solid #0009;box-shadow:0 2px 6px #0008;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    /* 계산이 어긋나도 **줄어들지언정 넘치지는 않게** 한다 — 마지막 안전판이다 */
    flex:0 1 var(--sk-cell);min-width:0}
  .sk img{width:100%;height:100%;object-fit:cover}
  .sk.lock{background:#1c1612cc}
  /* 이모지 자물쇠는 기기마다 모양·색이 달라 화면 톤이 깨진다. 에셋으로 통일 */
  .sk.lock::after{content:"";width:15px;height:15px;opacity:.5;
    background:url(/assets/ui/IC-LOCK-S.png) center/contain no-repeat}
  .skgap{width:8px;flex:0 0 auto}

  /* 장비 */
  /* 반드시 골라야 하는 화면 — 닫기·ⓘ 를 숨긴다 */
  #ov.forced #ovx, #ov.forced #ovi{display:none}
  /* 텍스트 입력 모달 — prompt() 대용. 모바일 WebView 는 prompt 를 막는
     경우가 있어 닉네임 변경이 통째로 죽었다 (단장 지적 2026-08-27) */
  #txtDlg{position:fixed;inset:0;z-index:300;display:none;align-items:center;
    justify-content:center;background:rgba(20,14,8,.62);
    padding-bottom:var(--kb, 0px)}   /* 확인·취소가 키보드 위로 */
  #txtDlg.show{display:flex}
  #txtDlg .td-box{width:min(320px,86vw);background:var(--panel);border:2px solid var(--gold);
    border-radius:14px;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
  #txtDlg b{font-size:14px;color:var(--ink);text-align:center}
  #txtDlg input{width:100%;background:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:10px;color:#e8dccf;font-size:16px;font-family:inherit}
  #txtDlg .td-row{display:flex;gap:8px}
  #txtDlg .td-row button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);font-family:inherit;font-size:13px;cursor:pointer}
  #txtDlg .td-row button.ok{background:var(--gold);color:#2a1c0c;font-weight:800}
  /* 시작 직업 선택 — 카드 석 장. 초상은 1024² 원화라 위쪽(얼굴)만 보여준다 */
  .cls-note{font-size:12px;color:var(--ink2);text-align:center;margin:2px 0 10px}
  .cls-card{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;
    padding:12px 10px;margin-bottom:10px;border:2px solid var(--line);border-radius:14px;
    background:var(--panel2);cursor:pointer;transition:transform .12s,border-color .12s}
  .cls-card:active{transform:scale(.97)}
  .cls-card:hover{border-color:var(--gold)}
  .cls-card img{width:96px;height:96px;object-fit:cover;object-position:top;
    border-radius:50%;border:2px solid var(--line);background:var(--panel)}
  .cls-card b{font-size:15px;color:var(--ink)}
  .cls-card span{font-size:12px;color:var(--gold)}
  .cls-card i{font-size:10px;font-style:normal;color:var(--ink2)}
  /* 설명이 없는 화면에서도 ⓘ 가 떠 있어 눌러도 아무 일이 없었다.
     #ovinfo 가 비면 버튼째 숨긴다 — 화면마다 손으로 끄지 않아도 된다 */
  #ovcard:has(#ovinfo:empty) #ovi{display:none}
  /* 등급 오라 — 밴드 안에서는 그림이 같으므로 발광 세기로 가른다.
     --au 는 등급 색, --aw 는 티어에 비례한 세기(렌더에서 넣는다). */
  .slot{--au:#0000;--aw:0}
  .slot img{filter:drop-shadow(0 0 calc(var(--aw) * 5px) var(--au))
    drop-shadow(0 0 calc(var(--aw) * 12px) var(--au))}
  .slot.g-hi{box-shadow:0 0 0 1px var(--au) inset,0 0 12px -2px var(--au)}
  .er-card.new img{filter:drop-shadow(0 0 6px var(--au)) drop-shadow(0 0 16px var(--au))}

  /* 장비 정보 */
  .ei-top{display:flex;align-items:center;gap:13px;padding:4px 0 12px}
  .ei-ic{width:74px;height:74px;flex:0 0 auto;border-radius:13px;border:2px solid var(--line);
    background:var(--ink);display:flex;align-items:center;justify-content:center}
  .ei-ic img{width:56px;height:56px;object-fit:contain}
  .ei-name b{display:block;font-size:18px;font-weight:900}
  .ei-name span{font-size:12px;color:var(--dim)}
  .ei-empty{text-align:center;padding:26px 10px;color:var(--dim);font-size:12px;line-height:1.7}

  /* 소환 결과 비교 — 현재 vs 신규 */
  .er-wrap{display:flex;gap:8px;align-items:stretch}
  .er-card{flex:1 1 0;min-width:0;background:var(--card);border:2px solid var(--line);
    border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;
    transition:transform .12s,box-shadow .2s}
  .er-card.new{border-color:var(--gold);box-shadow:0 0 14px #ffc94a33}
  .er-card:active{transform:translateY(2px)}
  .er-card>i{display:block;font-style:normal;font-size:9px;font-weight:900;
    letter-spacing:1px;color:var(--dim);margin-bottom:5px}
  .er-card.new>i{color:var(--gold)}
  .er-card img{width:52px;height:52px;object-fit:contain}
  .er-card b{display:block;font-size:13px;font-weight:900;margin-top:3px}
  .er-card .er-cp{font-size:11px;color:var(--dim);margin-top:3px}
  .er-card .er-cp em{font-style:normal;font-weight:900}
  .er-card .er-cp img{width:13px;height:13px;object-fit:contain;vertical-align:-2px;margin-right:2px}
  .er-d{font-size:14px;font-weight:900;margin-top:4px;letter-spacing:.3px}
  .er-card.up{border-color:var(--up);box-shadow:0 0 14px #5ad86a33}
  .er-card.down{opacity:.72}
  .er-vs{align-self:center;font-size:11px;font-weight:900;color:var(--dim);flex:0 0 auto}
  .er-pick{width:100%;margin-top:6px;border-radius:8px;padding:8px;font-size:11px;
    font-weight:800;cursor:pointer;font-family:inherit;border:1px solid #c09c7e;
    background:linear-gradient(#a8886e,#806854);color:var(--txt)}
  .er-pick.scrap{background:var(--panel2);border-color:var(--line);color:var(--dim)}
  .er-note{font-size:10px;color:var(--dim);text-align:center;margin-top:9px;line-height:1.5}

  /* 제작대 도크 — 인벤토리 아래 가운데. 탭이 곧 소환이다 */
  /* 제작대 줄 — 왼쪽 퀘스트 / 오른쪽 제작대. 둘 다 "지금 할 일"이다 */
  /* 제작대는 **원래 자리(가운데)** 그대로다. 퀘스트는 그 왼쪽 빈 공간에
     절대배치로 얹는다 — 흐름에 넣으면 제작대가 오른쪽으로 밀린다 */
  #fgRow{position:relative;margin-top:auto;padding:4px 2px 12px}
  #fgDock{position:relative;display:flex;flex-direction:column;align-items:center}
  /* 제작대 그림도 화면 높이에 매단다. 104x74 로 박아 두면 하단 패널에서
     제일 큰 덩치가 안 줄어 그 패널이 낮은 화면을 통째로 먹는다.
     가로세로 비(104/74 = 1.405)는 그림 비율이라 지켜야 한다 */
  #fgObj{border:none;background:none;padding:0;cursor:pointer;position:relative;
    height:clamp(50px, 9.1vh, 74px);width:calc(clamp(50px, 9.1vh, 74px) * 1.405);
    transition:transform .12s}
  #foAnim{filter:drop-shadow(0 4px 10px #000a) drop-shadow(0 0 14px #ffb04a55)}
  #fgObj:active{transform:translateY(2px) scale(.97)}
  @keyframes fgBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  /* 보유 소환권 — 제작대 그림 아래에 겹쳐 붙는다 */
  #fgTicket{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);z-index:3;
    display:flex;align-items:center;gap:5px;padding:3px 12px;min-width:74px;
    justify-content:center;border-radius:13px;
    background:var(--ink)e8;border:1px solid var(--gold);box-shadow:0 2px 8px #000a}
  #fgTicket .tk-bg{position:absolute;inset:0;width:100%;height:100%;
    object-fit:fill;border-radius:13px}
  #fgTicket .tk-ic{position:relative;width:15px;height:15px;object-fit:contain}
  #fgTicket b{position:relative;font-size:12px;font-weight:900;color:var(--gold)}
  /* UI-PILL 이 들어오면 CSS 배경을 지우고 그림만 쓴다 */
  #fgTicket:has(.tk-bg){background:none;border:none;box-shadow:none}


  /* 1단계 — 4프레임 시트 재생. 프레임: 들림 / 45° / 타격+불똥 / 휴지.
     bg-size 400% 에서 프레임 위치는 0 / 33.334 / 66.667 / 100% 다
     (백분율 배치는 이미지의 p% 를 컨테이너의 p% 에 맞추는 규칙이라 이렇게 나온다).
     평소에는 마지막 프레임(휴지)을 그대로 보여 준다 — 정지 화면이 곧 4번 프레임이라
     연출이 끝나도 튀지 않는다. */
  /* 스트립은 renderForgeDock 이 단계에 맞춰 --strip 으로 끼운다 */
  #foAnim{position:absolute;inset:0;pointer-events:none;
    background:var(--strip,url(/assets/ui/FO-01-STRIP.png)) 100% 0/400% 100% no-repeat}
  #fgObj.ready #foAnim{animation:fgBob 1.5s ease-in-out infinite}
  #fgObj.empty #foAnim{filter:grayscale(.7) brightness(.65)}
  /* 자동이 잡아 둔 장비가 있다 — 모루가 금빛으로 맥동한다.
     창을 띄워 화면을 가로채는 대신 여기만 빛내고 유저가 누를 때 보여 준다 */
  #fgObj.pend #foAnim{filter:drop-shadow(0 0 6px var(--gold)) drop-shadow(0 0 14px #ffd76a88);
    animation:fgPend 1.25s ease-in-out infinite}
  @keyframes fgPend{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #fgObj.pend::after{content:"";position:absolute;right:2px;top:2px;width:9px;height:9px;
    border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);z-index:4;
    animation:fgPendDot 1.25s ease-in-out infinite}
  @keyframes fgPendDot{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    #fgObj.pend #foAnim,#fgObj.pend::after{animation:none}
  }
  /* 재생: 들림(0~20%) → 낙하(→42%) → 타격 유지(→78%) → 휴지.
     42% = 0.244s — 불똥(fgSpk .25s)·모루 눌림(fgShake 42%)과 맞물린다. */
  @keyframes foPlay{
    0%,20%{background-position:0 0}
    20.1%,42%{background-position:33.334% 0}
    42.1%,78%{background-position:66.667% 0}
    78.1%,100%{background-position:100% 0}}
  #fgSpark{position:absolute;left:50%;top:52%;width:8px;height:8px;margin:-4px 0 0 -4px;
    border-radius:50%;opacity:0;pointer-events:none;z-index:3;
    background:radial-gradient(circle,#fff,#ffd76a 40%,#ff8a2a00 70%)}
  #fgObj.hit #fgSpark{animation:fgSpk .4s ease-out .25s both}
  @keyframes fgSpk{0%{opacity:0;transform:scale(.3)}
    30%{opacity:1;transform:scale(3.4)}100%{opacity:0;transform:scale(5.2)}}
  /* 모루가 눌렸다 튄다 */
  /* 모루 눌림 — 시트 프레임과 같은 층(foAnim)에 건다. 착지 42% 타이밍 동기 */
  #fgObj.hit #foAnim{animation:foPlay .58s linear both,
    fgShake .58s cubic-bezier(.3,1.4,.5,1) both}
  /* 자동 소환이 도는 동안에는 망치질이 **끊기지 않는다**. 한 번 치고 멈추면
     "지금 돌고 있나" 를 숫자로만 알 수 있다. 자동이 서면 이 클래스가 빠져
     애니메이션도 곧바로 선다 (한 번 치는 .hit 가 더 강해 겹쳐도 안 싸운다) */
  #fgObj.auto:not(.hit) #foAnim{animation:foPlay .72s linear infinite,
    fgShake .72s cubic-bezier(.3,1.4,.5,1) infinite}
  @media (prefers-reduced-motion:reduce){
    #fgObj.auto:not(.hit) #foAnim{animation:none}
  }
  @keyframes fgShake{0%,42%{transform:none}
    50%{transform:translateY(4px) scaleY(.93) scaleX(1.05)}
    66%{transform:translateY(-2px) scaleY(1.03) scaleX(.98)}
    100%{transform:none}}

  #fgLv{position:absolute;left:calc(50% + 56px);top:10px;z-index:2;
    min-height:32px;display:flex;align-items:center;
    background:var(--ink)e6;border:1px solid var(--gold);color:var(--gold);
    border-radius:11px;padding:2px 9px;font-size:10px;font-weight:900;
    cursor:pointer;font-family:inherit}
  #fgLv.busy{border-color:var(--dia);color:var(--dia)}

  /* 자동소환 토글 — 인벤토리 라벨 줄 좌상단 */
  /* 자동 소환 — 제작대 오른쪽. 참고 화면의 AUTO 배지 자리다 */
  /* 자동 소환 — 톱니 하나로 상태를 말한다. 돌면 켜짐, 멈춰 있으면 꺼짐. */
  #b_auto{position:absolute;left:calc(50% + 58px);top:48px;z-index:3;
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    background:var(--panel2);border:1px solid var(--line);border-radius:50%;
    padding:0;cursor:pointer;font-family:inherit;color:var(--dim)}
  #b_auto img,#b_auto .gear{width:24px;height:24px;font-size:22px;line-height:24px;
    object-fit:contain;pointer-events:none;display:block;text-align:center}
  #b_auto.on{background:linear-gradient(#3f8a4f,#2c6a3c);border-color:#5ad86a;color:#fff;
    box-shadow:0 0 10px #5ad86a66}
  #b_auto.on img,#b_auto.on .gear{animation:autoSpin 2.4s linear infinite}
  @keyframes autoSpin{to{transform:rotate(360deg)}}
  #b_auto:disabled{opacity:.35;cursor:default}
  #b_auto:disabled img,#b_auto:disabled .gear{filter:grayscale(1)}

  /* 자동소환 설정 패널 */
  .as-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .as-row>span{font-size:11px;color:var(--dim);width:100%}
  .as-g{flex:1 1 auto;min-width:52px;background:var(--card);border:1px solid var(--line);
    color:var(--txt);border-radius:8px;padding:7px 4px;font-size:11px;font-weight:800;
    cursor:pointer;font-family:inherit}
  .as-g.on{border-color:var(--gold);background:#221c0c}
  .as-g:disabled{opacity:.3;cursor:default}

  /* 좌 3x2 = 해금된 장비 6부위 / 우 3x2 = 미구현 시스템. 참고작(버섯커)과 같은 독법 —
     왼쪽은 지금 내 것, 오른쪽은 앞으로 생길 것. */
  #eq{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #eqL,#eqR{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  /* 칸 높이를 **화면 높이에 매단다.** 54px 로 못 박아 두면 1024x600 처럼 낮은
     화면에서도 그대로라, 줄어드는 몫을 전투 화면(flex:1)이 혼자 뒤집어쓴다 —
     전투가 28% 까지 눌렸다 (단장 지적 2026-08-25). 812 에서 54px 이 기준이고
     600 에서 40px 이 된다. 38px 하한은 아이콘(74%)이 아직 읽히는 크기다 */
  .slot{height:clamp(38px, 6.65vh, 54px);
    background:var(--panel2);border:2px solid var(--line);border-radius:7px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:9px;color:var(--dim);position:relative;overflow:hidden;cursor:pointer}
  .slot b{font-size:12px;color:var(--txt);line-height:1.1}
  .slot img{width:74%;height:74%;object-fit:contain}
  .slot.up{box-shadow:0 0 0 2px var(--up) inset}
  .slot .arrow{position:absolute;top:1px;right:2px;color:var(--up);font-size:10px;font-weight:900}


  /* 던전 — 용병·스킬과 같은 시트. 던전 하나가 **한 줄**이다.
     2열 카드로 두면 이름·층·열쇠·요구 CP 가 좁은 칸에 접혀서 어디를 돌지 못 고른다.
     한 줄이면 층·열쇠가 같은 x 좌표에 세로로 정렬돼 눈이 한 번만 움직인다. */
  /* 던전 — 한 줄이 곧 **가로로 꽉 찬 배너**다. 그림을 줄 배경으로 깔고 글자를 위에
     얹는다. 작은 썸네일로는 어디로 들어가는지가 안 읽히고, 6줄이 아이콘 목록처럼
     보여 "고르는 화면"이라는 느낌이 안 난다.
     --dg-art 는 [던전 그림, 폴백 배경] 2겹이다. 던전 그림이 없으면 아래 배경이 비친다. */
  #dungeons{display:flex;flex-direction:column;gap:8px}
  .dg{position:relative;isolation:isolate;overflow:hidden;
    border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;display:flex;align-items:center;gap:11px;min-height:78px;
    font-size:10px;color:var(--dim);cursor:pointer;background:var(--panel)}
  .dg::before{content:"";position:absolute;inset:0;z-index:-2;
    background-image:var(--dg-art);background-size:cover,cover;
    background-position:center 38%,center 42%}
  /* 글자가 그림 위에서 읽히도록 왼쪽을 짙게. **오른쪽은 완전히 걷는다** —
     배너 그림이 초점을 오른쪽에 두고 그려져 있어(STEP 6-B) 거기까지 덮으면
     그림을 넣은 의미가 없다. 왼쪽은 원화 자체가 어둡게 그려져 있어서
     그라디언트를 빼도 흰 글자 대비가 9 이상 나온다 (AA 기준 4.5). */
  .dg::after{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(90deg,#070b12eb 0%,#070b12b8 40%,#070b1238 72%,#070b1200 100%)}
  .dg .nm{flex:1;min-width:0}
  .dg b{display:block;font-size:15px;color:var(--txt);font-weight:800;
    text-shadow:0 2px 5px #000d}
  .dg .why{display:block;font-size:10px;color:#dbcdc3;margin-top:3px;
    text-shadow:0 1px 4px #000d;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 층은 오른쪽 끝. 폭을 고정해야 여러 줄이 한 줄기로 정렬된다 */
  .dg .ent{flex:0 0 auto;text-align:right;font-size:15px;font-weight:900;color:var(--gold);
    text-shadow:0 2px 5px #000d}
  /* 열쇠 — 상단바 재화와 같은 알약 칩. 보유량이 곧 입장 가능 횟수다 */
  .dg .keys{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
    background:var(--ink)e0;border:1px solid var(--gold);border-radius:12px;padding:3px 9px}
  .dg .keys img{width:16px;height:16px;object-fit:contain}
  .dg .keys b{display:inline;font-size:12px;font-weight:900;color:var(--gold)}
  .dg .keys i{font-style:normal;font-size:10px;font-weight:700;color:var(--dim)}
  /* 열쇠를 다 썼을 때 그 자리에 서는 충전 단추. 같은 알약 모양을 유지하되
     초록(광고=공짜로 더 받는 것)으로 갈아 열쇠 칩과 구분한다 */
  .dg button.keys{cursor:pointer;font-family:inherit;padding-left:6px}
  .dg button.keys:active{transform:scale(.95)}
  /* **AD 배지.** 광고를 봐야 준다는 걸 누르기 전에 알려야 오탭이 배신으로
     느껴지지 않는다 (단장 지적 2026-08-26). 초록 버튼 + 노란 사각 배지는
     게임의 나무·금색 톤에서 혼자 튀어서, 어두운 나무 알약에 금테를 두르고
     재생 삼각형을 붙이는 쪽으로 바꿨다 (2차 지적).
     글자는 번역하지 않는다 — AD 는 이 자리에서 만국 공통 기호다 */
  /* 캡슐(테두리+판)은 뺐다 — 이미 버튼 자체가 나무 프레임이라 액자 안에
     액자였다 (단장 지적 2026-08-26). ▶ 와 글자만 금색으로 남긴다 */
  .adTag{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;
    color:var(--gold);font-size:9px;font-weight:900;
    line-height:1;letter-spacing:.6px;text-shadow:0 1px 2px #000}
  /* ▶ — 영상이 뜬다는 표시. 글자 하나로는 "광고 상품" 처럼 읽힌다 */
  .adTag::before{content:"";width:0;height:0;border-style:solid;
    border-width:3.5px 0 3.5px 5px;border-color:transparent transparent transparent var(--gold)}
  /* 배지는 **글자로 광고라고 안 쓰는 자리에만** 단다 — 방치 보상 패널은
     버튼에 이미 "광고 보고 2배"·"광고" 라고 적혀 있어 배지가 겹말이다
     (단장 지적 2026-08-26). 던전 열쇠·아레나 입장권처럼 아이콘과 수량만
     있는 자리가 배지가 필요한 자리다 */
  .id-btns .ad,.id-alt button.ad,#tkAd,.dg button.keys{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    background:none;border-style:solid;border-width:10px;border-radius:0;
    border-image:var(--f-btn) 120 fill stretch;color:var(--txt)}
  /* 잠긴 줄은 그림도 죽인다. 투명도만 낮추면 배너가 여전히 화려해 열린 줄과 안 갈린다 */
  /* 소탕 — 줄 안의 단추다. 입장(줄 전체)과 나란히 있으므로 **눌리는 영역이
     또렷해야** 한다: 테두리 있는 알약 모양에 최소 44px 폭 */
  .dg-sweep{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
    gap:1px;min-width:52px;padding:6px 9px;border-radius:10px;
    background:#17120fdd;border:1px solid var(--brass);color:var(--gold);
    font:inherit;font-size:11px;font-weight:800;cursor:pointer;
    box-shadow:0 2px 6px #0008}
  .dg-sweep i{font-style:normal;font-size:9px;font-weight:700;color:#d9c39a}
  .dg-sweep:active{transform:scale(.94)}
  /* 열쇠가 없을 때 — 숨기지 않는다. 있던 단추가 사라지면 "왜 없어졌지" 가 된다.
     **투명도로만 죽이면 안 된다** — 뒤에 던전 배너 그림이 밝게 깔려 있어서
     글자가 그림에 먹힌다. 바탕은 오히려 더 짙게 깔고 색만 무채색으로 내린다 */
  .dg-sweep.off{background:#0d0906ee;border-color:#4a3c2a;color:#9c8a75;
    box-shadow:none}
  .dg-sweep.off i{color:#7d6d5c}

  .dg.lock{opacity:.62}
  .dg.lock::before{filter:grayscale(1) brightness(.5)}
  /* 잠긴 줄은 층·열쇠 대신 자물쇠 + 요구 CP 한 덩어리 */
  .dg .ent.lockv{flex:0 0 auto;color:var(--dim);font-size:11px}
  .dg .ent.lockv .lockIc{display:block;width:15px;height:15px;margin:0 0 2px auto;
    vertical-align:0}
  .dg .ent.lockv i{display:block;font-style:normal;font-size:10px;font-weight:700}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .icell.new{animation:pop .26s ease-out}

  /* 퀘스트 + 채팅 — 전투 화면 좌측 하단 */
  /* 퀘스트 — 전투 화면 좌하단 HUD */
  /* 퀘스트 배너 — 전투 화면을 가리는 물건이라 필요한 만큼만 차지한다.
     56%/200px 은 캐릭터 절반을 덮었다. */
  #bottom{position:relative}

  /* 채팅 — 하단 패널과 네비 사이 독립 바. 가로 전체를 쓴다 */
  #chat{flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:10px 12px;background:var(--ink);border-top:1px solid var(--line);
    font-size:13px;color:#dcc8b9;white-space:nowrap;overflow:hidden}
  #chat .who{flex:0 0 auto;color:var(--gold);font-weight:800;font-size:12px;
    background:#332921;border:1px solid var(--line);border-radius:7px;padding:3px 8px}
  #chat #chatline{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis}
  #chat{cursor:pointer}

  /* 제작대 확률 — 현재/다음 두 열 비교 (버섯커 램프 표 문법) */
  /* 머리글은 아래 줄(.fr2-row)과 **같은 칸 구조**다 — 이름 자리를 비워 두고
     두 레벨 이름이 각자의 퍼센트 열 위에 선다. 안 맞추면 어느 숫자가 지금이고
     어느 게 다음인지 눈으로 짝지어야 한다 */
  .fr2-head{display:flex;align-items:center;gap:7px;
    padding:0 8px;margin:2px 0 9px;font-size:12px;font-weight:800}
  .fr2-head .fr2-hgap{flex:1 1 auto}
  .fr2-head .fr2-now,.fr2-head .fr2-next{flex:0 0 64px;text-align:right}
  .fr2-head .fr2-now{color:var(--gold)}
  .fr2-head .fr2-next{color:#8fd18f}
  .fr2-head i{font-style:normal;color:var(--dim)}
  /* ⓘ 팝업의 레벨 넘김 줄 — 여기는 가운데 정렬이다 (표 머리글과 다른 물건) */
  .fr2-nav{display:flex;align-items:center;justify-content:center;gap:9px;
    margin:2px 0 7px;font-size:12px;font-weight:800}
  .fr2-nav .fr2-now{color:var(--gold)}
  .fr2-row{display:flex;align-items:center;gap:7px;padding:4px 8px;margin-bottom:3px;
    background:var(--ink);border:1px solid var(--line);border-radius:8px;font-size:11px}
  .fr2-row .fr2-bar{flex:0 0 4px;height:14px;border-radius:2px;background:var(--c)}
  .fr2-row b{flex:1 1 auto;min-width:0;color:var(--c);display:flex;align-items:center;gap:4px}
  .fr2-row .lockIc{width:10px;height:10px}
  .fr2-row .fr2-a{flex:0 0 64px;text-align:right;color:#dcc8b9}
  .fr2-row .fr2-b{flex:0 0 64px;text-align:right;color:#8b7a6c}
  .fr2-row .fr2-b.up{color:#8fd18f;font-weight:800}
  .fr2-row .fr2-b.down{color:#c98a7a}
  .fr2-row.locked{opacity:.55}

  /* 오버레이 헤더 재화 옆 + — 상단바 diaPlus 와 같은 문법 */
  .cur-plus{width:17px;height:17px;margin-left:2px;border-radius:50%;
    border:1px solid var(--gold);background:#3a2d1f;color:var(--gold);
    font-size:12px;font-weight:800;line-height:1;cursor:pointer;padding:0}

  /* 채팅 화면 — 오버레이 안. 말풍선이 아니라 **한 줄 로그**다.
     방치 게임의 채팅은 흘려보는 것이라, 말풍선을 키우면 대화 열 줄에
     화면이 다 찬다. 이름 + 말 + 시각을 한 줄에 눕힌다. */
  .ch-body{height:44vh;max-height:340px;overflow-y:auto;
    background:var(--ink);border:1px solid var(--line);border-radius:11px;
    padding:8px 9px;margin:8px 0;display:flex;flex-direction:column;gap:5px}
  .ch-line{display:flex;align-items:baseline;gap:6px;font-size:12px;line-height:1.45;
    color:#dcc8b9;word-break:break-word}
  .ch-av{flex:0 0 auto;width:22px;height:22px;border-radius:50%;object-fit:cover;
    object-position:top;border:1px solid var(--line);background:#332921;
    align-self:center;cursor:pointer}
  .ch-line b{flex:0 0 auto;color:var(--gold);font-weight:800;font-size:11px;
    max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .ch-line span{flex:1 1 auto;min-width:0}
  .ch-line i{flex:0 0 auto;font-style:normal;font-size:10px;color:#8b7a6c}
  /* 내 줄은 이름 색을 바꾼다 — 배경을 칠하면 로그의 결이 끊긴다 */
  .ch-line.me b{color:#8fd18f}
  .ch-send{display:flex;gap:6px;align-items:center}
  .ch-send input{flex:1 1 auto;min-width:0;background:var(--ink);
    border:1px solid var(--line);border-radius:9px;padding:9px 10px;
    /* **16px 밑으로 내리지 않는다.** iOS 사파리는 입력칸 글자가 16px 보다
       작으면 포커스 때 화면을 통째로 확대한다 — 채팅 칠 때마다 화면이
       줌인되던 원인이 이 13px 이었다 (단장 지적 2026-08-27) */
    color:#e8dccf;font-size:16px;font-family:inherit}
  .ch-send input:disabled{opacity:.5}
  .ch-send button{flex:0 0 auto}
  /* 퀘스트 — 제작대 왼쪽. 전투 영역의 얇은 띠가 아니라 **카드**다.
     세로로 [이름/진행] → [게이지] → [보상] 을 쌓아 한눈에 읽힌다 */
  /* 제작대(가운데 104px) 왼쪽 여백. 카드 안에 [이름] [진행] [게이지] [보상]이
     전부 들어가야 한다 — 하나라도 빠지면 "뭘 하는 퀘스트인지"가 안 읽힌다 */
  #quest{position:absolute;left:6px;top:50%;transform:translateY(-50%);
    width:calc(50% - 62px);background:var(--card);
    border:1px solid var(--line);border-radius:11px;
    padding:7px 9px;display:flex;flex-direction:column;justify-content:center;gap:5px;
    font-size:10px;cursor:pointer;pointer-events:auto;z-index:4}
  /* 이름은 두 줄까지 허용한다 — "Q14 용병 소환" 이 한 줄에 안 들어가면
     말줄임으로 잘려서 무슨 퀘스트인지 사라진다 */
  #qtop{display:flex;align-items:baseline;gap:5px}
  #qname{color:var(--txt);font-size:11px;font-weight:800;flex:1;min-width:0;
    line-height:1.25;word-break:keep-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* 보상 아이콘과 진행 숫자가 한 줄을 나눠 쓴다 — 아이콘은 왼쪽, 숫자는 오른쪽 끝 */
  /* 좁으면 **잘라내지 말고 다음 줄로 흘린다.** overflow:hidden 으로 막았더니
     보상 아이콘이 반쯤 잘려 보였다 (단장 지적 2026-08-25). 배너가 한 줄
     높아지는 편이 보상을 못 읽는 것보다 낫다 */
  #qfoot{display:flex;align-items:center;justify-content:space-between;gap:4px 6px;
    min-width:0;flex-wrap:wrap}
  #qprog{color:var(--gold);flex:0 0 auto;font-size:11px;font-weight:800;
    font-family:"Black Han Sans","Jua",system-ui,sans-serif}
  #qbar{height:5px;background:#0007;border-radius:3px;overflow:hidden;width:100%;margin:0}
  /* 완료 — 카드가 금색으로 반짝인다. 받으라는 신호가 화면에서 가장 세야 한다 */
  #quest.done{border-color:var(--gold);background:linear-gradient(160deg,#3a2c12,var(--card) 70%);
    animation:qDone 1.15s ease-in-out infinite}
  #quest.done #qname{color:var(--gold)}
  /* 완료했으면 게이지는 뺀다 — 다 찬 막대는 정보가 0 이고 보상 아이콘만 남으면
     "받아라"가 더 또렷해진다 */
  #quest.done #qbar{display:none}
  /* 완료하면 "보상 받기" 배지가 보상 줄을 통째로 쓴다 — 누르라는 신호라
     아이콘 옆에 작게 붙어 있으면 안 읽힌다 */
  #quest.done #qfoot{flex-direction:column;align-items:stretch;gap:4px}
  #quest.done #qprog{background:var(--gold);color:#2a1c05;text-align:center;
    border-radius:6px;padding:2px 7px;font-size:10px}
  @keyframes qDone{0%,100%{box-shadow:0 0 0 0 #ffc94a00}
    50%{box-shadow:0 0 14px 2px #ffc94a66}}
  #qfill{height:100%;width:0;background:linear-gradient(90deg,#c09c7e,#5ad8ff)}
  /* 보상 칩 — 아이콘 위에 개수를 얹는다. 가로가 좁아 글자를 옆에 못 둔다 */
  /* 보상 — 카드 안에서 줄바꿈된다. 넘치면 감추지 말고 접어서 다 보여준다 */
  /* 보상 아이콘 줄은 **줄어들 수 있어야 한다.** flex:0 0 auto 로 두면 보상이
     셋일 때 제 폭을 고집해서, 옆의 진행 숫자(20/90)를 배너 밖으로 밀어냈다
     (단장 지적 2026-08-25). 좁으면 아이콘이 먼저 양보한다 */
  #qrw{display:flex;gap:5px;flex:0 1 auto;min-width:0;align-items:center;
    flex-wrap:wrap}
  #qrw span{position:relative;width:21px;height:21px;flex:0 0 auto}
  #qrw img{width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 1px 2px #000a)}
  #qrw b{position:absolute;right:-3px;bottom:-3px;font-size:8px;font-weight:400;
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;color:#fff;
    text-shadow:0 0 3px #000,0 1px 2px #000,-1px 0 2px #000,1px 0 2px #000}

  /* 액션 */
  #acts{display:grid;grid-template-columns:1fr 1fr 1fr 52px;gap:5px;margin-top:auto}
  .act{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;
    padding:8px 2px;font-size:11px;font-weight:700;cursor:pointer;position:relative}
  .act.primary{background:linear-gradient(#a8886e,#806854);border-color:#c09c7e}
  .act.on{background:var(--gold);color:#000;border-color:var(--gold)}
  .act:disabled{opacity:.4}
  #b_forge{font-size:20px;padding:4px;transition:box-shadow .2s}
  @keyframes forgeGlow{
    0%,100%{box-shadow:0 0 0 0 #5ad86a00,0 0 8px 0 #5ad86a55}
    50%{box-shadow:0 0 0 2px #5ad86a88,0 0 18px 3px #5ad86a99}
  }
  #b_forge.ready{animation:forgeGlow 1.1s ease-in-out infinite;border-color:var(--up)}
  .badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;
    background:var(--warn);color:#fff;font-size:10px;line-height:17px;text-align:center;padding:0 4px;
    font-weight:800}

  /* 네비 8% */
  #nav{flex:0 0 8%;display:grid;grid-template-columns:repeat(5,1fr);
    background:#241a12;border-top:1px solid var(--line)}
  /* 아이콘 위 · 글자 아래. 아이콘이 없으면(onerror 로 제거) 글자만 가운데 남는다 */
  /* 아이콘을 네비 높이가 허용하는 만큼 키운다. 글자는 이름표 역할만 하므로
     아이콘이 주인공이고 글자는 그 아래 작게 붙는다. */
  .nv{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:0;font-size:9px;color:var(--dim);cursor:pointer;position:relative;overflow:hidden}
  /* **vw 가 아니라 vh·cqw 다.** 10.5vw 는 창 폭이라, 1024x600 처럼 넓고 낮은
     창에서는 앱이 338px 인데도 아이콘이 상한 44px 로 서서 네비가 화면의 13% 를
     먹었다 (기준 375x812 에서는 9%). 세로가 낮으면 세로에 맞춰 줄고(5.4vh),
     앱이 좁으면 앱 폭에 맞춰 준다(10.5cqw — 예전 vw 가 노리던 것이 이쪽이다) */
  .nv img{width:min(44px,5.4vh,10.5cqw);height:min(44px,5.4vh,10.5cqw);object-fit:contain;
    margin-bottom:-1px;
    filter:grayscale(.5) brightness(.8);opacity:.82;
    transition:filter .12s,opacity .12s,transform .12s}
  .nv.on{color:var(--gold)}

  /* 오버레이 — 화면을 다 덮지 않는다. 가운데 카드만 띄운다 */
  /* .over-alli — 연합 마을(fullscr z70) 위에서 열릴 때만 붙는다. 안 붙이면
     패널이 마을 뒤에 깔려 "눌렀는데 아무 일도 없다"가 된다 (실제로 그랬다) */
  #ov.over-alli{z-index:82}
  #ov{position:absolute;inset:0;z-index:60;background:#120e0bb0;display:none;
    align-items:center;justify-content:center;padding:16px;
    /* 키보드 높이만큼 바닥을 밀어 올린다 — 입력칸·보내기가 키보드에 안 깔린다.
       카드 최대높이(76%)가 줄어든 자리를 먹으므로 닫기·최근 줄은 남는다 */
    padding-bottom:calc(16px + var(--kb, 0px))}
  #ov.show{display:flex;animation:ovDim .18s ease-out}
  #ov.show #ovcard{animation:ovPop .18s ease-out}
  @keyframes ovDim{from{background:#120e0b00}}
  @keyframes ovPop{from{transform:scale(.94);opacity:.4}}
  #ovcard{position:relative;width:100%;max-width:330px;max-height:76%;background:var(--bg);
    border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px #000a;
    display:flex;flex-direction:column;overflow:hidden}
  #ovh{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  #ovt{font-size:15px;font-weight:800;flex:1}
  #ovi{background:none;border:1px solid var(--line);color:var(--dim);border-radius:50%;
    width:26px;height:26px;font-size:13px;font-weight:800;cursor:pointer;padding:0}
  #ovi.on{border-color:var(--gold);color:var(--gold)}
  #ovx{background:none;border:1px solid var(--line);color:var(--txt);border-radius:6px;
    padding:4px 10px;cursor:pointer;font-size:12px}
  #ovb{flex:1;overflow-y:auto;overflow-x:hidden;font-size:13px;padding:12px}
  /* 훈장 상점 — 아레나 화면 안의 작은 아이콘. 버는 곳과 쓰는 곳을 붙여 둔다 */
  /* 작은 아이콘 단추(22px) 시절 규칙은 걷었다 — 훈장 상점 문이 [훈장 그림 +
     글자] 버튼(.ar-shopb.big)으로 커지면서 id 규칙이 그걸 도로 22px 로 눌렀다
     (2026-08-26. id 가 클래스보다 세다) */
  #aShop:active{transform:translateY(1px)}
  .mdBuy{min-width:66px;padding:6px 10px;border-radius:8px;cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:800;color:#1a1408;
    background:linear-gradient(180deg,#ffd76a,#e8a72c);border:1px solid #ffe9a8}
  .mdBuy.off{background:#3c3027;border-color:var(--line);color:var(--dim)}
  .mdBack{width:100%;margin-top:12px;padding:10px;border-radius:9px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);color:var(--dim);
    font-family:inherit;font-size:12px}
  #ovinfo{display:none;border-top:1px solid var(--line);padding:10px 12px;
    max-height:44%;overflow-y:auto;background:var(--ink)}
  #ovinfo.show{display:block}
  .frow{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .frow .k{color:var(--dim);font-size:12px}
  .frow .v{font-weight:800;display:flex;align-items:center;gap:5px}
  .frow .v img{width:16px;height:16px;object-fit:contain}

  /* 제작대 화면 */
  #fgHero{position:relative;display:flex;flex-direction:column;align-items:center;
    padding:6px 0 10px}
  #fgHero > img{width:82%;max-width:190px;object-fit:contain;border-radius:10px;
    filter:drop-shadow(0 6px 18px #ff8a4a55);cursor:pointer;transition:transform .1s}
  #fgHero > img:active{transform:scale(.96)}
  #fgTap{margin-top:6px;font-size:11px;font-weight:800;color:var(--gold);
    display:flex;align-items:center;gap:4px}
  #fgTap img{width:14px;height:14px}
  /* 제작대 확률창 — 한 번에 한 레벨만 보여 주고 ‹ › 로 넘긴다.
     화살표는 flex 로 자리를 잡는다. 절대배치로 얹으면 좁은 화면에서 글자를 밟는다 */
  /* 제작대 소환 버튼 두 개. 그리드라 글자 길이가 달라도 폭이 안 흔들린다 */
  /* 절전 버튼 — 사이드 열 문법을 그대로 쓴다. 켜져 있으면 달이 빛난다 */
  #pwrSave.on{border-color:#a8907d;box-shadow:0 0 8px #a8907daa}

  /* ── 임무(일일·주간) ──
     참고한 방치형들의 배치를 따른다: 위에 포인트 게이지와 보상 상자, 아래 퀘스트 줄.
     상자를 게이지 위 제 위치에 얹어야 "얼마 남았나"가 한눈에 읽힌다 */
  .mq-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .mq-t{font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;padding:8px 0;
    color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:9px}
  .mq-t.on{color:#2a1c05;background:linear-gradient(180deg,#ffd76a,#e8a72c);
    border-color:var(--gold)}
  .mq-track{position:relative;height:34px;margin:0 16px 2px}
  /* 포인트 트랙 — MQ-BAR 한 장을 가로로 100% 늘려 쓰던 것을 그만둔다. 512x64
     그림이 300px 폭에 눌려 무늬가 뭉갰다. 홈은 CSS 로 파고, 마디는 위에 얹힌
     MQ-NODE 버튼(.mq-box)이 이미 맡고 있다 */
  .mq-gauge{position:absolute;left:0;right:0;top:14px;height:7px;border-radius:4px;
    background:linear-gradient(180deg,#0d0906,#1b1310);overflow:hidden;
    border:1px solid #ffffff12;box-shadow:inset 0 1px 3px #000b}
  .mq-gauge i{display:block;height:100%;border-radius:3px 0 0 3px;
    background:linear-gradient(90deg,#e8a72c,var(--gold),#ffe9a8);
    box-shadow:0 0 8px #ffc94a66}
  .mq-gauge i[style*="width: 100%"],.mq-gauge i[style*="width:100%"]{border-radius:3px}
  .mq-box{position:absolute;top:0;transform:translateX(-50%);width:32px;height:32px;
    border-radius:9px;cursor:default;font-family:inherit;
    background:transparent url(/assets/ui/MQ-NODE.png) center/contain no-repeat;
    border:0;color:var(--dim);filter:drop-shadow(0 2px 3px #0008)}
  .mq-box{overflow:hidden}
  .mq-box i{font-style:normal;font-size:10px;font-weight:800}
  .mq-box.can{background:transparent url(/assets/ui/MQ-NODE-ON.png) center/contain no-repeat;
    color:#2a1c05;cursor:pointer;animation:mqBox 1.1s ease-in-out infinite}
  @keyframes mqBox{0%,100%{transform:translateX(-50%) scale(1)}
    50%{transform:translateX(-50%) scale(1.12)}}
  .mq-box.done{border-color:var(--up);color:var(--up)}
  .mq-sum{display:flex;align-items:baseline;gap:6px;font-size:11px;color:var(--dim);
    margin:6px 2px 10px}
  .mq-sum b{font-size:16px;color:var(--gold);
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400}
  .mq-sum span{margin-left:auto}
  .mq-rw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .mq-rwc{background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:7px 5px;text-align:center;font-size:10px}
  .mq-rwc.done{opacity:.45}
  .mq-rwc u{display:block;text-decoration:none;color:var(--gold);font-weight:800;
    font-size:11px;margin-bottom:3px}
  .mq-rwc em{font-style:normal;display:inline-flex;align-items:center;gap:2px;margin:0 3px}
  .mq-rwc em img{width:13px;height:13px;object-fit:contain}
  /* 오른쪽 44px 은 보상 버튼 자리다. 주사위 미션의 버튼(.dc-mbtn)은 52px 이라
     제목이 그 밑으로 파고들어 겹쳤다 — 버튼 폭에 맞춰 자리를 비운다 */
  .mq-row{position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:8px 44px 9px 10px;margin-bottom:5px}
  #dcMissions .mq-row{padding-right:70px}
  /* 제목 줄이 길면 배지가 다음 줄로 내려가야 한다. baseline 정렬에 nowrap 이면
     "매일 출석" 위로 배지가 올라탄다 */
  #dcMissions .mq-h{flex-wrap:wrap;row-gap:2px}
  #dcMissions .mq-h b{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
  .mq-row.done{border-color:var(--up);opacity:.72}
  .mq-h{display:flex;align-items:baseline;gap:8px;font-size:12px;margin-bottom:5px}
  .mq-h b{font-weight:700}
  .mq-h span{margin-left:auto;font-size:11px;color:var(--dim);
    font-variant-numeric:tabular-nums}
  /* 게이지 홈은 그림(MQ-BAR)이다 — 맨 CSS 막대는 프로토타입처럼 보인다.
     좌우 끝 장식이 잘리지 않게 border-image 로 늘린다 */
  /* 홈(MQ-BAR) 안쪽에 채움이 들어간다. 채움이 홈을 꽉 덮으면 그림이 안 보여
     한 덩어리 막대로 읽힌다 — 위아래 2px 을 남긴다 */
  /* 미션 진행도는 **칸 게이지**다. 매끈한 막대는 "얼마나 남았나" 가 눈대중이
     되는데, 칸이면 남은 칸을 셀 수 있다 (제작대 골드 투입과 같은 문법).
     칸은 배경 그라데이션으로 그린다 — 요소를 10개 만들면 DOM 만 늘어난다 */
  .mq-bar{position:relative;height:9px;border-radius:5px;overflow:hidden;
    background:var(--ink);border:1px solid #ffffff14;
    box-shadow:inset 0 1px 3px #0009}
  /* 칸 나눔은 **홈 전체**에 그린다 — 채움 위에만 그리면 남은 칸이 안 보여
     "몇 번 더 하면 되나" 를 셀 수 없다. --seg 는 렌더가 목표치로 넣는다 */
  .mq-bar::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    background:repeating-linear-gradient(90deg,
      #0000 0 calc(100% / var(--seg,10) - 2px),
      #00000066 calc(100% / var(--seg,10) - 2px) calc(100% / var(--seg,10)))}
  /* 채움은 왼쪽만 둥글다. 오른쪽까지 둥글리면 다 찼을 때 끝이 홈보다 안쪽으로
     말려 들어가 "덜 찬 것처럼" 보인다 — 실제로 그랬다 */
  .mq-bar i{display:block;height:100%;border-radius:4px 0 0 4px;
    background:linear-gradient(90deg,#e8a72c,var(--gold));
    box-shadow:0 0 6px #ffc94a55}
  .mq-bar i[style*="width: 100%"],.mq-bar i[style*="width:100%"]{border-radius:4px}
  /* 완료 행은 초록으로 물들이지 않는다 — 화면 톤이 황동인데 초록 막대가
     여섯 줄 깔리면 그 색만 보인다. 흐린 금색 + 체크로 충분하다 */
  .mq-row.done .mq-bar i{background:linear-gradient(90deg,#8a7a52,#b09a6a);
    box-shadow:none}

  .mq-p{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;
    font-weight:800;color:var(--gold)}
  .mq-row.done .mq-p{color:var(--up)}

  /* ── 전직 카드 ──
     직군 카드 3장. 단장 직군 변신 그림이 주인공이고, 현재 단계 색(--au)이
     테두리·발광·이름을 함께 물들인다 — 1차 무채 / 2차 청 / 3차 금 */
  .pr-note{font-size:11px;color:var(--dim);text-align:center;margin:2px 0 10px}
  .pr-card{position:relative;background:var(--card);border:2px solid var(--au);
    border-radius:13px;padding:14px 12px 12px;margin-bottom:9px;text-align:center;
    box-shadow:0 0 14px color-mix(in srgb, var(--au) 30%, transparent),
      inset 0 0 22px color-mix(in srgb, var(--au) 12%, transparent)}
  .pr-card.t3{box-shadow:0 0 22px color-mix(in srgb, var(--au) 55%, transparent),
      inset 0 0 30px color-mix(in srgb, var(--au) 18%, transparent)}
  .pr-img{display:inline-block;width:96px;height:96px}
  .pr-img img{width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 4px 8px #000a) drop-shadow(0 0 10px color-mix(in srgb, var(--au) 45%, transparent))}
  /* 단계 여정 — 미니 초상 3개를 화살표로 잇는다. 다음 단계 그림은 실루엣이다:
     "저게 뭐지"가 다음 목표를 만든다 */
  .pj-path{display:flex;align-items:flex-start;justify-content:center;gap:4px;
    margin:10px 0 10px;padding:9px 4px 7px;background:var(--ink);border-radius:11px}
  .pj-node{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px}
  .pj-ic{position:relative;width:44px;height:44px;border-radius:10px;background:var(--ink2);
    border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
    overflow:hidden}
  .pj-ic img{width:38px;height:38px;object-fit:contain}
  .pj-node b{font-size:10px;font-weight:800;line-height:1.2;text-align:center;
    word-break:keep-all;margin-top:3px}
  .pj-node>span{font-size:9px;color:var(--dim)}
  .pj-node u{text-decoration:none;font-size:9px;color:var(--dim)}
  .pj-node.now .pj-ic{border-color:var(--c);box-shadow:0 0 9px var(--c)}
  .pj-node.now b{color:var(--c)}
  .pj-node.past{opacity:.62}
  .pj-node.past .pj-ic i{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-style:normal;color:var(--up);font-size:17px;
    background:#0009}
  /* 다음 단계 — 38px 에서는 실루엣이 그냥 얼룩이라, 어둡게 가라앉힌 실그림이 낫다.
     전용 단계 아트(PR-*)가 들어오면 여기가 진짜 예고편이 된다 */
  .pj-node.next .pj-ic img{filter:grayscale(1) brightness(.5);opacity:.75}
  .pj-node.next b{color:var(--dim)}
  .pj-arrow{align-self:center;color:var(--line);font-size:15px;font-weight:800;
    flex:0 0 auto;margin-top:-14px}
  .pr-pips{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:4px}
  .pr-pips i{width:10px;height:10px;border-radius:50%;background:var(--ink);
    border:1px solid var(--line)}
  .pr-pips i.on{background:var(--c);border-color:var(--c);box-shadow:0 0 6px var(--c)}
  .pr-name{display:block;font-size:16px;margin-top:4px;
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400}
  .pr-cls{display:block;font-size:11px;color:var(--dim);margin:2px 0 8px}
  .pr-next{display:block;font-size:11px;color:var(--dim);margin-bottom:8px}
  .pr-next b{color:var(--txt)}
  .pr-next.done{color:var(--gold);margin-bottom:2px}
  .pr-btn{width:100%;min-height:38px}
  /* 전직 스킬 카드 — 이펙트 그림 + 수치 + 골드 강화. 골드 소모처가 곧 이 카드다 */
  .cs-card{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);
    border:2px solid var(--au);border-radius:13px;padding:10px 12px;margin-bottom:9px;
    box-shadow:inset 0 0 18px color-mix(in srgb, var(--au) 14%, transparent)}
  .cs-fx{width:46px;height:46px;object-fit:contain;flex:0 0 auto;
    filter:drop-shadow(0 0 8px color-mix(in srgb, var(--au) 60%, transparent))}
  .cs-body{flex:1;min-width:0}
  .cs-body b{display:block;font-size:13px}
  .cs-body b i{font-style:normal;font-size:10px;color:var(--gold);margin-left:4px}
  .cs-body span{font-size:11px;color:var(--dim)}
  .cs-body em{font-style:normal;color:var(--up);font-weight:800}
  .cs-up{flex:1 1 100%;min-height:36px;padding:4px 12px;font-size:12px}
  .cs-up img{width:13px;height:13px;vertical-align:-2px}
  /* 다른 길을 고른 뒤의 직군 — 잠긴 게 아니라 "안 간 길"이다. 흐리게만 */
  .pr-card.out{opacity:.45;filter:grayscale(.55)}
  .pr-chosen{position:absolute;right:10px;top:10px;font-size:10px;font-weight:800;
    color:#2a1c05;background:linear-gradient(180deg,#ffd76a,#e8a72c);
    border-radius:6px;padding:2px 8px}
  .pr-btn img{width:14px;height:14px;vertical-align:-2px}

  /* ── 이벤트 배너 ──
     배너가 곧 입구다. 도감 일러(--img)를 오른쪽에 깔고 왼쪽에서 어두운
     그라디언트로 눌러 글자를 세운다 — 전용 배너 아트(EV-*)가 오면 갈아 끼운다 */
  .evb{position:relative;display:block;width:100%;min-height:86px;margin-bottom:9px;
    padding:12px 96px 12px 14px;text-align:left;cursor:pointer;font-family:inherit;
    border:2px solid var(--line);border-radius:13px;overflow:hidden;color:var(--txt);
    /* 왼쪽은 글자 자리라 거의 불투명하게, 오른쪽은 그림이 보이게 연다.
       --img 에 URL 을 **두 장** 넣으면 뒤 레이어에만 position/size 가 붙어
       앞 그림이 타일로 깔린다 — 한 장만 넣는다 (실제로 그렇게 깨졌다) */
    /* 그림을 흐리게 덮지 않는다 — 애써 그린 배너가 얼룩이 된다.
       왼쪽 글자 자리만 좁게 눕히고 나머지는 그대로 보여 준다 */
    background:
      linear-gradient(90deg, #150f0bcc 0%, #150f0b88 30%, #0000 58%),
      var(--img) center/cover no-repeat, var(--card)}
  .evb:active{transform:translateY(1px)}
  /* 배너 제목은 그림 위에 얹히므로 **읽히는 게 먼저**다. Black Han Sans 는
     획이 두꺼워 밝은 배경 위에서 글자끼리 붙어 뭉갠다 */
  .evb b{display:block;font-size:16px;margin:2px 0 3px;font-weight:800;
    text-shadow:0 1px 4px #000, 0 0 10px #0009}
  .evb-tag{display:inline-block;font-size:9px;font-weight:800;color:#2a1c05;
    background:linear-gradient(180deg,#ffd76a,#e8a72c);border-radius:5px;padding:1px 7px}
  .evb.end .evb-tag{background:var(--ink);color:var(--dim)}
  .evb-sub{display:block;font-size:11px;color:#e8ded3;
    text-shadow:0 1px 3px #000, 0 0 6px #000a}
  /* 주사위 탭 — 판/미션 */
  /* 상세 머리 — 배너 없이 제목과 남은 기간만 */
  .dc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin:2px 0 8px}
  .dc-head b{font-size:14px;font-weight:800;color:var(--gold)}
  .dc-head u{text-decoration:none;font-size:12px;font-weight:800;color:#2a1c05;
    background:linear-gradient(180deg,#ffd76a,#e8a72c);border-radius:999px;
    padding:2px 10px}
  .dc-ico{width:13px;height:13px;object-fit:contain;vertical-align:-2px}
  /* 주사위 상점 — 그림이 큰 가로 카드. 다이아 상품과 같은 문법이라
     "많이 살수록 그림이 커진다" 가 그대로 읽힌다 */
  .dc-store{display:grid;gap:7px}
  .dc-item{position:relative;display:flex;align-items:center;gap:11px;
    background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:9px 12px 9px 9px;cursor:pointer;font-family:inherit;color:var(--txt);
    text-align:left}
  .dc-item:active{transform:translateY(1px)}
  .dc-item>img{width:50px;height:50px;object-fit:contain;flex:0 0 auto;
    filter:drop-shadow(0 2px 6px #0009)}
  .dc-item b{flex:1;font-size:13px;font-weight:800}
  .dc-item em{display:inline-flex;align-items:center;gap:4px;font-style:normal;
    font-size:13px;font-weight:800;color:#2a1c05;
    background:linear-gradient(180deg,#ffd76a,#e8a72c);border-radius:9px;
    padding:5px 11px}
  .dc-item em img{width:14px;height:14px;filter:none}
  .dc-item u{position:absolute;right:8px;top:-8px;text-decoration:none;
    font-size:9px;font-weight:800;background:var(--warn);color:#fff;
    border-radius:6px;padding:2px 8px}
  /* 주사위판은 **스크롤 없이** 한 화면에 들어와야 한다 — 굴리는 화면에서
     스크롤이 생기면 판과 버튼을 같이 못 본다. 판 칸과 상품 칸을 줄인다 */
  #ovcard[data-skin] .dc-wrap{margin-bottom:4px}
  .dc-shop .dc-prize{padding:6px 4px}
  .dc-shop .dc-prize u{font-size:11px}
  .dc-shop .dc-prize b{font-size:9px;min-height:2.4em}
  .dc-goal{display:flex;align-items:baseline;justify-content:center;gap:6px;
    font-size:10px;color:var(--dim);margin:6px 0 6px}
  .dc-goal b{font-size:13px;font-weight:800;color:var(--gold)}
  /* 상세 화면은 배너를 끈다 — 제목 줄만 남는다 */
  /* [data-skin] 규칙이 뒤에 있어 동률이면 그쪽이 이긴다 — 속성까지 얹어 이긴다 */
  #ovcard.no-banner[data-skin] #ovskin{display:none}
  #ovcard.no-banner[data-skin] #ovh{min-height:50px;align-items:center;
    padding:10px 12px 6px}
  #ovcard.no-banner[data-skin] #ovt{position:static;transform:none;max-width:none;flex:1}
  .dc-tabs{display:flex;gap:5px;margin:2px 0 9px}
  .dc-tabs button{flex:1;position:relative;background:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:7px 0;font:inherit;font-size:12px;font-weight:800;
    color:var(--dim);cursor:pointer}
  .dc-tabs button.on{background:linear-gradient(180deg,#ffd76a,#e8a72c);
    border-color:#ffd76a;color:#2a1c05}
  .dc-tabs .dot{position:absolute;top:5px;right:9px;width:6px;height:6px;
    background:var(--warn);border-radius:50%}
  /* D-day — 남은 기간이 크게 보여야 "지금 해야 한다"가 생긴다 */
  .evb-dday{position:absolute;right:10px;bottom:9px;font-size:13px;font-weight:400;
    color:var(--gold);font-family:"Black Han Sans","Jua",system-ui,sans-serif;
    text-shadow:0 1px 3px #000c}
  /* 무료 1000뽑은 **마일스톤**이 있는 진행도다 — 홈에 마디(MQ-NODE)를 박아
     "다음 지급까지 얼마" 가 눈에 보이게 한다 */
  /* 무료 1000뽑은 **마일스톤**이 있는 진행도다 — 홈에 마디를 박아 "다음 지급까지
     얼마" 가 눈에 보이게 한다. 한 규칙에 모은다: background 축약을 뒤에 또 쓰면
     앞의 background-image 가 지워진다 (실제로 그랬다) */
  /* 무료 1000뽑 — 임무 상단 트랙과 같은 홈이다. 구분선을 넣어 봤더니 마디가
     없는 진행도에 칸만 그어져 뜻 없는 눈금이 됐다 */
  .evb-bar{position:relative;display:block;height:9px;margin-top:6px;
    border-radius:5px;overflow:hidden;
    background:linear-gradient(180deg,#0d0906,#1b1310);
    border:1px solid #ffffff12;box-shadow:inset 0 1px 3px #000b}
  .evb-bar i{display:block;height:100%;border-radius:4px 0 0 4px;
    background:linear-gradient(90deg,#e8a72c,var(--gold));
    box-shadow:0 0 7px #ffc94a55}

  .evb.end{opacity:.55;filter:grayscale(.45)}
  .evb-dot{position:absolute;right:10px;top:10px;width:10px;height:10px;border-radius:50%;
    background:var(--warn);box-shadow:0 0 7px var(--warn)}
  .ev-back{display:block;margin-bottom:10px;padding:7px 12px;cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:800;color:var(--dim);
    background:var(--panel);border:1px solid var(--line);border-radius:9px}
  .ev-big{text-align:center;font-size:13px;color:var(--dim);margin:2px 0 6px}
  .ev-big b{font-size:26px;color:var(--gold);
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400}

  /* 전직 스킬 — 스킬 칸과 같은 원형이되 **틀이 다르다**: 금빛 점선 링이 돌고
     레벨 배지가 아래 붙는다. 같은 줄에 서면서도 "특별한 한 칸"으로 읽힌다 */
  #csChip,#csChip2{position:relative;width:clamp(30px,calc((100cqw - 110px)/8),46px);aspect-ratio:1;
    height:auto;flex:0 0 auto;cursor:pointer;font-family:inherit;padding:0;
    border-radius:50%;overflow:visible;border:2px solid var(--gold);
    background:radial-gradient(circle at 50% 35%,#4a3512cc,#150f0bcc);
    box-shadow:0 0 8px #ffc94a66,0 2px 6px #0008;
    display:flex;align-items:center;justify-content:center;align-self:center}
  #csChip::before,#csChip2::before{content:"";position:absolute;inset:-5px;border-radius:50%;
    border:1.5px dashed #ffc94aa8;animation:csSpin 9s linear infinite;pointer-events:none}
  @keyframes csSpin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){#csChip::before{animation:none}}
  #csChip img,#csChip2 img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  #csChip i,#csChip2 i{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
    font-style:normal;font-size:8px;font-weight:800;color:#2a1c05;white-space:nowrap;
    background:linear-gradient(180deg,#ffd76a,#e8a72c);border-radius:6px;padding:0 5px;
    box-shadow:0 1px 3px #0009}
  #csChip[hidden],#csChip2[hidden]{display:none}
  /* 2차 칩 — 3차 전직의 것. 붉은 금테로 1차와 구분 */
  #csChip2{border-color:#ff8a4a;box-shadow:0 0 8px #ff8a4a66,0 2px 6px #0008}
  #csChip2::before{border-color:#ff8a4aa8}
  /* 칩이 8칸 옆에 낄 자리는 스킬 간격에서 얻는다 — 줄 전체가 4px 넘쳤었다 */
  #skRow:has(#csChip:not([hidden])) #skills{gap:4px}
  /* 칩이 보이면 원 크기를 줄 전체로 다시 나눈다 — 8칸 기준 clamp 는 칩을 모른다.
     칩 1개 = 9원, 2개 = 10원. 안 그러면 줄이 앱 폭(480)을 옆으로 뚫는다 (실측 +38px) */
  #skRow:has(#csChip:not([hidden])) :is(.sk,#csChip,#csChip2){
    width:clamp(22px,calc((100cqw - 140px)/9),38px)}
  #skRow:has(#csChip2:not([hidden])) :is(.sk,#csChip,#csChip2){
    width:clamp(20px,calc((100cqw - 150px)/10),34px)}

  /* ── 7일 축제 ── */
  .ev7-hero{position:relative;display:flex;align-items:center;gap:12px;overflow:hidden;
    background:linear-gradient(135deg,#4a2c14,#7a4a1a 55%,#a8742a);
    border:2px solid var(--gold);border-radius:14px;padding:13px 14px;margin-bottom:11px;
    box-shadow:inset 0 0 30px #ffd76a2e}
  .ev7-cap{width:64px;height:64px;object-fit:contain;flex:0 0 auto;border-radius:50%;
    background:#00000030;border:2px solid #ffd76a99;
    filter:drop-shadow(0 3px 7px #000a)}
  .ev7-ht{position:relative;min-width:0}
  .ev7-ht b{display:block;font-size:17px;color:#fff;text-shadow:0 2px 0 #00000060;
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400}
  .ev7-ht span{display:block;font-size:11px;color:#ffe9c4}
  .ev7-ht u{display:inline-block;text-decoration:none;font-size:10px;font-weight:800;
    color:#2a1c05;background:linear-gradient(180deg,#ffd76a,#e8a72c);border-radius:6px;
    padding:2px 8px;margin-top:5px}
  /* 색종이 — transform/opacity 만 움직인다 */
  .ev7-hero .cf{position:absolute;top:-8px;width:7px;height:11px;border-radius:2px;
    opacity:.85;animation:cfFall 2.6s linear infinite}
  .cf.c0{background:#ffd76a}.cf.c1{background:#5ad8ff}.cf.c2{background:#ff8a9a}
  .cf.c3{background:#7fd86a}
  @keyframes cfFall{0%{transform:translateY(-12px) rotate(0)}
    100%{transform:translateY(110px) rotate(300deg);opacity:0}}
  @media (prefers-reduced-motion:reduce){.ev7-hero .cf{animation:none;display:none}}

  .ev7-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}
  .ev7-cell{position:relative;background:var(--card);border:2px solid var(--line);
    border-radius:12px;padding:9px 5px 10px;text-align:center;min-height:64px}
  .ev7-cell.big{grid-column:1 / -1;display:flex;align-items:center;justify-content:center;
    gap:12px;min-height:56px;padding:10px 8px;
    border-color:var(--gold);background:linear-gradient(135deg,#3a2a12,var(--card));
    box-shadow:inset 0 0 22px #ffd76a22}
  .ev7-cell.big b{margin:0;font-size:12px;color:var(--gold)}
  .ev7-cell b{display:block;font-size:10px;font-weight:800;color:var(--dim);margin-bottom:4px}
  .ev7-rw{display:flex;flex-wrap:wrap;justify-content:center;gap:3px 7px}
  .ev7-cell em{font-style:normal}
  .ev7-rw em{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:800}
  .ev7-rw em img{width:17px;height:17px;object-fit:contain;
    filter:drop-shadow(0 1px 2px #0009)}
  .ev7-cell.done{opacity:.5}
  .ev7-cell.done i{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-style:normal;font-size:21px;color:var(--up);
    background:#000000a0;border-radius:10px}
  .ev7-cell.now{border-color:var(--gold);animation:qDone 1.15s ease-in-out infinite}
  .ev7-cell.now em.ev7-today,.ev7-cell em{font-style:normal}
  .ev7-cell>em{position:absolute;right:-5px;top:-7px;font-size:9px;font-weight:800;
    color:#2a1c05;background:linear-gradient(180deg,#ffd76a,#e8a72c);border-radius:6px;
    padding:1px 7px;box-shadow:0 1px 4px #0008}
  .ev7-cell.hi:not(.big){border-color:var(--dia);
    box-shadow:inset 0 0 14px #5ad8ff22}
  .ev7-btn{min-height:44px;font-size:14px}

  /* ── 냥냥 주사위 ── 12칸을 4x4 테두리에 감고 가운데에 주사위·굴리기 */
  .dc-wrap{position:relative;margin-bottom:10px}
  #dcBoard{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);
    gap:4px;aspect-ratio:1;max-width:340px;margin:0 auto;padding:10px;border-radius:16px;
    /* 판 에셋(EV-BOARD)이 깔린다. 없으면 배경색만 — 칸은 어차피 코드가 그린다 */
    background:url(/assets/ui/EV-BOARD.webp) center/cover no-repeat, var(--ink)}
  #dcBoard .dc-cell{background:#33261bd8;backdrop-filter:none}
  .dc-cell{position:relative;background:var(--card);border:2px solid var(--line);
    border-radius:11px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1px;min-height:0}
  .dc-cell img{width:20px;height:20px;object-fit:contain}
  .dc-cell b{font-size:9px;font-weight:800;color:var(--dim)}
  .dc-cell i{font-style:normal;font-size:16px;line-height:1}
  .dc-cell.t-start{border-color:var(--gold);background:linear-gradient(135deg,#3a2a12,var(--card))}
  .dc-cell.t-start b{color:var(--gold)}
  .dc-cell.t-again{border-color:var(--dia)}
  .dc-cell.here{border-color:var(--gold);box-shadow:0 0 10px #ffc94a88;
    animation:qDone 1.15s ease-in-out infinite}
  /* 코너 — 한 바퀴의 마디. 잭팟 코너는 금빛으로 계속 반짝인다 */
  .dc-cell.corner{border-width:2px;background:linear-gradient(135deg,#3a2a12,var(--card))}
  .dc-cell.jackpot{border-color:var(--gold);
    box-shadow:inset 0 0 12px #ffd76a44,0 0 8px #ffc94a55}
  .dc-cell.jackpot b{color:var(--gold)}
  .dc-cell.jackpot::after{content:"";position:absolute;inset:0;border-radius:9px;
    background:linear-gradient(120deg,transparent 30%,#ffd76a2e 50%,transparent 70%);
    background-size:220% 100%;animation:dcShine 2.6s linear infinite;pointer-events:none}
  @keyframes dcShine{from{background-position:160% 0}to{background-position:-60% 0}}
  @media (prefers-reduced-motion:reduce){.dc-cell.jackpot::after{animation:none}}
  .dc-cell.t-again i img{width:22px;height:22px;object-fit:contain;display:block}
  .dc-cell.t-wing i img{width:24px;height:24px;object-fit:contain;display:block}
  .dc-cell.t-wing{border-color:#ff8a9a;box-shadow:inset 0 0 10px #ff8a9a33}
  .dc-cell.t-wing b{color:#ff8a9a}
  .dc-cell.t-again{border-color:var(--dia);
    box-shadow:inset 0 0 10px #5ad8ff33}
  .dc-tok{position:absolute;left:50%;top:-12px;transform:translateX(-50%);
    width:26px !important;height:26px !important;border-radius:50%;
    border:2px solid var(--gold);background:#000;z-index:3;box-shadow:0 2px 6px #000a}
  .dc-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:6px;width:50%}
  #dcFace{font-size:34px;line-height:1;font-family:"Black Han Sans",system-ui,sans-serif;
    color:var(--gold);text-shadow:0 2px 0 #00000080;min-height:52px;
    display:flex;align-items:center}
  #dcFace img{width:52px;height:52px;object-fit:contain;
    filter:drop-shadow(0 3px 6px #000a)}
  #dcRoll{width:100%;min-height:40px}
  #dcRoll em{font-style:normal;font-size:11px;background:#00000040;border-radius:8px;
    padding:1px 7px;margin-left:4px}
  /* 보상 버튼 — 폭·높이를 못박는다. 내용(✓ / 주사위+2)에 따라 크기가 달라지면
     행마다 버튼이 들쭉날쭉해 목록이 흐트러진다.
     바탕은 **짙은 남갈색**이다. 노란 버튼 위에 노란 주사위를 얹으면 안 보인다 */
  /* .rt-b.go 가 금색 바탕을 주므로 특이도를 올려 눌러야 이긴다 */
  #dcMissions .dc-mbtn{position:absolute;right:10px;top:50%;transform:translateY(-50%);
    width:58px;height:30px;padding:0;display:inline-flex;align-items:center;
    justify-content:center;gap:2px;font-size:12px;font-weight:800;
    background:#241a12;border:1px solid #c9a22766;color:var(--gold);border-radius:9px}
  #dcMissions .dc-mbtn.go{background:linear-gradient(180deg,#3d2b16,#2a1d10);
    border-color:var(--gold);color:#ffe9a8;
    box-shadow:0 0 9px #ffc94a3d, inset 0 1px 0 #ffffff16}
  #dcMissions .dc-mbtn:disabled{background:#1d1510;color:var(--dim);
    border-color:var(--line);box-shadow:none}
  #dcMissions .dc-mbtn .dc-ico{width:15px;height:15px;
    filter:drop-shadow(0 0 2px #000c)}
  .dc-shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;
    margin-bottom:8px}
  .dc-prize{position:relative;background:var(--card);border:2px solid var(--gold);
    border-radius:11px;padding:8px 5px;text-align:center;
    box-shadow:inset 0 0 14px #ffd76a1e}
  .dc-prize u{display:block;text-decoration:none;font-size:12px;color:var(--gold);
    font-family:"Black Han Sans","Jua",system-ui,sans-serif}
  /* 종류(칭호/프레임/날개)와 이름을 줄로 나눈다 — 한 덩어리로 흘리면
     좁은 칸에서 아무 데서나 꺾여 읽기 사납다 */
  .dc-prize em{display:block;font-style:normal;font-size:8px;color:var(--dim);
    margin:1px 0}
  /* 이름이 세 줄까지 늘어나도 잘리지 않게 칸이 늘어난다 — 고정 높이를 주면
     "무한의 날개" 같은 긴 이름이 아래로 잘린다 */
  .dc-prize b{font-size:9.5px;font-weight:800;line-height:1.3;display:block;
    word-break:keep-all;text-wrap:balance;overflow-wrap:anywhere;min-height:2.6em}
  .dc-prize.far{opacity:.55;border-color:var(--line);box-shadow:none}
  .dc-prize.got i{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-style:normal;font-size:19px;color:var(--up);
    background:#000000a0;border-radius:9px}
  .dc-prize{cursor:pointer;font-family:inherit;color:var(--txt)}
  .pz-hero{display:flex;justify-content:center;margin-bottom:8px}
  .pz-hero img{width:110px;height:110px;object-fit:contain;
    filter:drop-shadow(0 4px 10px #000a) drop-shadow(0 0 12px #ffc94a55)}
  .pz-name{text-align:center;font-size:12px;color:var(--dim);margin-bottom:10px}
  .pz-name b{font-size:15px;color:var(--gold);
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400}
  .dc-buy{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:4px}
  .dc-buyb{font-family:inherit;cursor:pointer;background:var(--card);
    border:2px solid var(--gold);border-radius:11px;padding:7px 4px;text-align:center;
    color:var(--txt)}
  .dc-buyb b{display:block;font-size:12px;font-weight:800}
  .dc-buyb em{font-style:normal;font-size:10px;color:var(--dia);font-weight:800;
    display:inline-flex;align-items:center;gap:3px}
  .dc-buyb em img{width:12px;height:12px;object-fit:contain}
  .dc-buyb:active{transform:translateY(1px)}
  .dc-fest{text-decoration:none;font-size:9px;font-weight:800;color:#2a1c05;
    background:linear-gradient(180deg,#ffd76a,#e8a72c);border-radius:5px;padding:1px 6px;
    margin-left:4px}
  #dcMissions .mq-row{padding-right:70px}

  /* ── 소환 마일리지 ── */
  .ml-row{display:flex;align-items:center;gap:10px;background:var(--card);
    border:2px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:6px}
  .ml-row.can{border-color:var(--gold);box-shadow:0 0 8px #ffc94a44}
  .ml-row.done{opacity:.55}
  .ml-n{flex:0 0 44px;text-align:center;font-size:14px;color:var(--gold);
    font-family:"Black Han Sans","Jua",system-ui,sans-serif}
  .ml-what{flex:1;font-size:12px}
  .ml-what b{font-weight:800}

  /* 아레나 상대 행 — 아바타 + 정보. 행 전체가 눌린다 */
  .af-row{cursor:pointer;display:flex;align-items:center;gap:9px}
  /* 34px 은 누가 누군지 안 보였다. 목록에서 얼굴이 읽히는 최소 크기가 48 이다.
     #ovb .frow img{15px} 이 특이도로 이기므로 id 를 얹어야 실제로 커진다
     (친구 아바타에서 같은 함정을 밟았다) */
  /* 아레나 — 상대가 맨 위, 확인용 줄(점수·훈장·입장)은 아래 한 덩어리로 */
  /* 훈장 상점 — 품목 그림이 큰 2열 카드 */
  .md-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .md-card{display:flex;flex-direction:column;align-items:center;gap:2px;
    background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:10px 6px 9px;text-align:center}
  .md-card>img{width:44px;height:44px;object-fit:contain;
    filter:drop-shadow(0 2px 6px #0009)}
  .md-card b{font-size:11px;font-weight:800;word-break:keep-all}
  .md-card>span{font-size:9px;color:var(--dim)}
  .md-card .mdBuy{width:100%;margin-top:4px;display:inline-flex;align-items:center;
    justify-content:center;gap:4px}
  #ovb .md-card .mdBuy img{width:13px;height:13px;object-fit:contain}

  .ar-sec{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin:2px 0 7px}
  /* 라벨(용병·스킬)이 꺾이지 않게 — .lbl 이 flex 라 좁으면 글자가 세로로 섰다 */
  .ar-sec .lbl{flex:0 0 auto;white-space:nowrap;display:inline-block}
  .ar-sec .rt-b{min-width:82px;font-size:11px}
  /* 제작대 골드 투입 — 아이콘+액수가 버튼 위로 떠오르며 사라진다. 돈이 나가는
     느낌이 안 든다는 지적(단장 2026-08-26). #ovcard 기준 절대 좌표 */
  .fg-fly{position:absolute;z-index:5;pointer-events:none;transform:translateX(-50%);
    display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:14px;
    color:#ffd76a;text-shadow:0 1px 3px #000;
    animation:fgFly .9s ease-out forwards}
  .fg-fly img{width:15px;height:15px;object-fit:contain}
  @keyframes fgFly{
    0%{opacity:0;translate:0 4px}
    15%{opacity:1}
    100%{opacity:0;translate:0 -44px}}
  .ar-stat{display:flex;gap:6px;margin-top:9px}
  /* 두 칸(점수·상점 문) — 입장권은 좌상단 알약으로 나갔다. 카드가 컸다는
     지적(2026-08-26)으로 높이를 죽인다: 세로쌓기 대신 한 줄 */
  .ar-stat span{flex:1;min-width:0;display:flex;flex-direction:row;
    align-items:center;justify-content:center;gap:6px;min-height:38px;
    background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:4px 6px}
  /* 상점 문 칸은 카드 상자를 걷는다 — 버튼이 이미 제 테두리를 갖고 있어
     상자 속 상자였다 (단장 지적 2026-08-26) */
  .ar-stat span:has(.ar-shopb.big){background:none;border:0;padding:0}

  /* 연합 레벨 게이지 — 홈 히어로 아래. 기부의 목적지가 보인다 */

  .al-lvbar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000c}

  /* 연합 상점 — 이미지 카드 그리드. 글줄 나열은 상점처럼 안 보인다 */
  .als-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .als-card{background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:9px 5px 8px;text-align:center;display:flex;flex-direction:column;
    align-items:center;gap:3px}

  .als-img{width:40px;height:40px;object-fit:contain;

  /* 코인 아이콘 — 규칙 없으면 CU-12 원본(1024px)이 그리드 트랙을 터뜨린다 */
  .als-card .mdBuy img{width:11px;height:11px;object-fit:contain;vertical-align:-1px}
  .als-lock img{width:10px;height:10px;object-fit:contain;margin-right:3px;
    vertical-align:-1px}
  .als-lock{font-style:normal;font-size:9px;font-weight:800;color:var(--dim);
    background:var(--ink);border-radius:6px;padding:3px 7px;margin-top:2px}

  .fg-pull{display:grid;gap:6px;margin:6px 0 2px}
  .fg-pull .fgbtn{display:flex;flex-direction:column;align-items:center;gap:2px;
    min-height:46px;justify-content:center;padding:6px 4px;line-height:1.15}
  .fg-pull em{font-style:normal;font-size:11px;font-weight:800;display:inline-flex;
    align-items:center;gap:3px;opacity:.9}
  .fg-pull em img{width:13px;height:13px;object-fit:contain}
  .fg-pull i{font-style:normal;font-size:10px;color:var(--dim)}
  .fr-nav{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .fr-a{flex:0 0 38px;height:38px;font-family:inherit;font-size:20px;line-height:1;
    color:var(--gold);background:var(--panel);border:1px solid var(--line);
    border-radius:10px;cursor:pointer}
  .fr-a{font-size:0;display:flex;align-items:center;justify-content:center}
  .fr-a::after{content:"";width:22px;height:22px;
    background:url(/assets/ui/UI-ARROW-L.png) center/contain no-repeat}
  .fr-a[data-d="1"]::after{transform:scaleX(-1)}
  .fr-a:disabled{opacity:.3;cursor:default}
  .fr-a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .fr-lv{flex:1;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:6px}
  .fr-lv b{font-size:19px;color:var(--gold);
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400}
  .fr-lv i{font-style:normal;font-size:10px;font-weight:800;color:#2a1c05;
    background:var(--gold);border-radius:5px;padding:1px 6px}
  .fr-unlock{font-size:11px;color:var(--dim);background:var(--panel);
    border:1px dashed var(--c);border-radius:9px;padding:7px 10px;margin-bottom:8px}
  .fr-unlock b{font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400}
  .fr-rows{margin-bottom:8px}
  .fr-rows .sm-g b{flex:0 0 46px}
  .fr-jump{display:block;width:100%;margin-bottom:6px;padding:8px;cursor:pointer;
    font-family:inherit;font-size:11px;font-weight:800;color:var(--dim);
    background:var(--panel);border:1px solid var(--line);border-radius:9px}
  .fr-jump b{font-family:"Black Han Sans","Jua",system-ui,sans-serif;font-weight:400}
  #smBody .sm-band .rates{gap:5px 9px}
  /* "영웅 해금" 이 62px 칸에서 두 줄로 깨졌다. 레벨과 해금 표시를 위아래로 쌓고
     칸을 넓힌다 — 가로로 붙이면 어느 해상도에서든 다시 깨진다 */
  #smBody .sm-band .lv{flex:0 0 84px;display:flex;flex-direction:column;gap:1px;
    align-items:flex-start}
  #smBody .sm-band .lv em{margin:0;white-space:nowrap}
  #fgLvBadge{position:absolute;top:0;right:2%;background:var(--ink);border:2px solid var(--ore);
    border-radius:9px;padding:3px 9px;font-size:13px;font-weight:900;color:var(--ore);
    font-family:inherit;cursor:pointer;z-index:4;display:inline-flex;align-items:center;gap:3px}
  #fgLvBadge i{font-style:normal;font-size:10px;opacity:.75}
  #fgLvBadge:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  /* 탭 히어로 — 망치 오버레이는 폐기. 타격의 주역은 하단 독의 스트립이고,
     탭은 불똥 + 흔들림만 받는다 */
  /* 대기 상태에서도 폭을 차지해 패널에 가로 스크롤이 생겼다. translate 로 미리 당겨 둔다 */
  #fgHeroSpark{position:absolute;left:50%;top:46%;width:14px;height:14px;
    margin:-7px 0 0 -7px;border-radius:50%;opacity:0;pointer-events:none;z-index:2;
    background:radial-gradient(circle,#fff,#ffd76a 40%,#ff8a2a00 70%)}
  #fgHero.hit #fgHeroSpark{animation:fgSpk .4s ease-out .25s both}
  #fgHero.hit img#fgSummon{animation:fgShake .58s cubic-bezier(.3,1.4,.5,1) both}
  #fgStage{font-size:11px;color:var(--dim);margin-top:4px}
  /* 제작대 상단 줄 — 대장간 그림은 배너가 들고, 여기는 단계·레벨만 */
  #fgBar{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin:2px 0 8px}
  #fgBar #fgStage{margin:0}
  #fgBar #fgLvBadge{position:static}
  /* 레벨업 카드 — 제작대 패널의 본체. 소환을 본화면으로 옮긴 뒤
     이 패널에 남은 일은 레벨 하나라, 한 장의 카드로 묶어 무게를 준다 */
  .fg-up{background:var(--card);border:2px solid var(--line);border-radius:13px;
    padding:10px 11px 11px;margin-top:8px;
    box-shadow:0 0 20px #ffc94a14 inset}
  .fg-up.busy{border-color:#ffc94a55}
  .fg-up-h{display:flex;align-items:center;justify-content:center;gap:7px;
    margin-bottom:7px}
  .fg-lvfrom{font-size:12px;font-weight:800;color:var(--dim)}
  .fg-arrow{font-style:normal;color:var(--gold);font-size:11px}
  .fg-lvto{font-size:15px;font-weight:800;color:var(--gold);
    text-shadow:0 0 12px #ffc94a55}
  .fg-tag{font-style:normal;font-size:9px;font-weight:800;color:#17120f;
    background:var(--gold);border-radius:999px;padding:2px 7px;margin-left:2px}
  .fg-up-row{display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:5px 1px;font-size:12px}
  .fg-up-row .k{color:var(--dim)}
  .fg-up-row .v{font-weight:800;display:flex;align-items:center;gap:3px}
  .fg-up .fgbtn{width:100%;margin-top:7px}
  .fg-up.done{opacity:.75}

  /* 제작대 진행 막대는 없앴다 (2026-08-25) — 골드 투입 칸과 남은 시간 글자가
     같은 것을 이미 말해서 겹말이었다. 규칙도 같이 지운다 */
  .fgbtn{width:100%;padding:11px;font-size:13px;border-radius:9px;font-weight:800;
    border:1px solid #c09c7e;background:linear-gradient(#a8886e,#806854);color:var(--txt);cursor:pointer}
