  .gain{display:flex;align-items:center;gap:7px;background:#0b0f17e0;
    border:1px solid #ffffff24;border-radius:11px;padding:5px 13px 5px 8px;
    font-size:12px;font-weight:800;color:#ffe9a8;box-shadow:0 4px 12px #0008;
    animation:gainIn .22s ease-out, gainOut .3s ease-in forwards;
    animation-delay:0s, var(--stay,1.6s)}
  .gain img{width:20px;height:20px;object-fit:contain}
  .gain i{font-style:normal;color:#c8d2e2;font-weight:700}
  @keyframes gainIn{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}
  @keyframes gainOut{to{opacity:0;transform:translateY(-7px)}}

  /* ═══ UI 킷 (UI-*) ═══════════════════════════════════════════════════
     여태 패널·버튼·칸이 전부 CSS 그라디언트에 1px 선이었다. 재질이 없어서
     "무슨 게임인지"가 안 읽혔다. 9-slice 프레임을 깔아 레이아웃은 그대로 두고
     재질만 바꾼다.

     *{box-sizing:border-box} 라 테두리를 넣어도 **바깥 크기는 안 변한다**.
     대신 안쪽이 그만큼 좁아지므로 padding 을 같이 줄인다.
     slice 값은 tools/nineslice.py 가 모서리 실루엣을 재서 뽑았다
     (assets/ui/9slice.json). 눈대중으로 넣으면 모서리 장식이 가운데로 번진다.

     border-image 는 border-style 이 없으면 **가운데(fill)만 그려진다**.
     테두리가 통째로 사라져서 평평한 판때기로 보인다 — 반드시 solid 를 같이 준다.
  */
  :root{
    --f-panel:url(/assets/ui/9s/UI-PANEL.png);
    --f-card:url(/assets/ui/9s/UI-CARD.png);
    --f-head:url(/assets/ui/9s/UI-HEADER.png);
    --f-btn:url(/assets/ui/9s/UI-BTN.png);
    --f-go:url(/assets/ui/9s/UI-BTN-GO.png);
    --f-off:url(/assets/ui/9s/UI-BTN-OFF.png);
    --f-nav:url(/assets/ui/9s/UI-NAV.png);
    --f-navon:url(/assets/ui/9s/UI-NAV-ON.png);
    --f-slot:url(/assets/ui/9s/UI-SLOT.png);
    --f-gauge:url(/assets/ui/9s/UI-GAUGE.png);
    --f-fill:url(/assets/ui/9s/UI-GAUGE-FILL.png);
    --f-pill:url(/assets/ui/9s/UI-PILL.png);
    --f-toast:url(/assets/ui/9s/UI-TOAST.png);
    --f-stage:url(/assets/ui/9s/UI-STAGE.png);
    --f-bossbtn:url(/assets/ui/9s/UI-BOSSBTN.png);
  }

  /* ── 패널 ── */
  #ovcard{background:none;border-style:solid;border-width:15px;border-radius:0;
    border-image:var(--f-panel) 86 fill stretch;box-shadow:0 14px 44px #000b}
  /* 닫기 버튼이 프레임 두께 때문에 36px 이라 34px 머리띠를 2px 뚫었다.
     좌우 18px 은 카드 네 귀 장식(::before/::after, 26px) 몫 — 안 비우면
     제목 글자가 장식 위에 올라탄다. 무기·던전 등 #ovcard 전 패널 공통. */
  /* 팝업 타이틀은 **중앙 리본**이다 — 키우기 장르에서 창의 이름은 문패처럼
     가운데 걸린다. i·X 버튼은 양끝에 그대로 */
  #ovh{background:none;border-bottom:none;padding:0 18px 6px;min-height:50px;
    align-items:center;position:relative}
  #ovt{text-align:center;color:var(--gold);letter-spacing:1px;
    text-shadow:0 1px 3px #000, 0 0 12px #ffc94a44;
    /* 긴 제목("시즌 패스 · 첫 원정")이 2줄로 접히면 밑줄까지 밀려 헤더를 넘는다 */
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #ovt::after{content:"";display:block;width:56%;height:2px;margin:3px auto 0;
    background:linear-gradient(90deg,#0000,#ffc94a88,#0000)}
  #ovx{border-width:8px;padding:0 3px;font-size:11px}
  #ovt{line-height:1.2}
  #ovb{padding:2px}
  #ovinfo{border-top:1px solid #ffffff1f;padding:8px 2px}

  /* ── 카드 한 줄 ── */
  .frow,.sh-card{background:none;border-style:solid;border-width:11px;border-radius:0;
    border-image:var(--f-card) 122 fill stretch}
  .frow{padding:1px 3px;margin-bottom:5px}
  .sh-card{padding:2px 3px;margin-bottom:5px}
  /* 특가 카드의 금색 왼쪽 띠는 프레임과 겹쳐 지저분해진다. 제목을 금색으로 대신 */
  .sh-card.deal{border-left-width:11px}
  .sh-card.deal b{color:var(--gold)}

  /* ── 제목 띠 ──
     뿔 장식(62px)과 위아래 레일(22px)을 slice 로 지킨다. border-width 는 렌더 높이에
     맞춘 값이다 — 58px 띠에서 레일 11px, 뿔은 비율대로 31px.
     box-sizing:border-box 라 이 폭이 곧 안쪽 여백이 되어 글자가 뿔을 안 밟는다. */
  .sh-head{background:none;border-bottom:none;border-style:solid;
    border-width:23px 31px 13px;border-image:var(--f-head) 46 62 25 62 fill stretch;
    padding:0;min-height:58px;align-items:center}
  .sh-title{text-shadow:0 1px 2px #0009;line-height:1}
  .sh-back{line-height:1;padding:0 4px 3px}
  /* 알약이 띠 높이를 넘으면 위아래 레일을 뚫는다. 채널(58-22=36px) 안에 가둔다 */
  .sh-head .sh-cur{border-width:7px 12px;padding:0 2px;height:30px;font-size:12px}
  .sh-head .sh-cur img{width:13px;height:13px}

  /* ── 버튼 ── */
  .sh-b,.sh-tabs button,#ovx,.mdBack{background:none;border-style:solid;border-width:10px;
    border-radius:0;border-image:var(--f-btn) 127 163 fill stretch}
  .sh-b{padding:2px 0;border-width:8px}
  .sh-b em{font-size:10px}
  .sh-tabs button{padding:1px 6px;color:var(--txt)}
  #ovx{padding:1px 4px}
  .mdBack{padding:3px}
  .sh-price,.mdBuy,.sh-b.hot,.sh-tabs button.on{background:none;border-style:solid;
    border-width:10px;border-radius:0;border-image:var(--f-go) 159 209 fill stretch;
    color:#2a1c05;text-shadow:0 1px 0 #ffe9a880}
  .sh-price{padding:1px 6px}
  .mdBuy{padding:1px 6px}
  .sh-price.big{padding:5px 14px}
  .sh-price img{filter:drop-shadow(0 1px 1px #0006)}
  /* 금색 면 위의 보조 글자 — var(--dim) 그대로 두면 금색에 묻힌다 */
  .sh-b.hot em,.sh-b.hot em b{color:#4a340a}
  .sh-b.hot{color:#2a1c05;text-shadow:0 1px 0 #ffe9a880}
  .mdBuy.off,.dg.lock .sh-price{border-image:var(--f-off) 120 fill stretch;
    color:var(--dim);text-shadow:none}

  /* ── 인벤토리 칸 ──
     **빈 칸에는 금색 액자를 안 씌운다.** 12칸이 전부 금테면 하단 패널이 금색 벽이
     되고, 정작 장비를 낀 칸이 안 도드라진다 — 빈 칸이 많을수록 심해진다.
     빈 칸은 판을 파낸 구멍으로, 낀 칸만 등급 액자(FRE-*)로 튀어나오게 한다. */
  .slot:not([class*="fre-"]){
    border:0;border-radius:9px;background:#0a0f18;
    box-shadow:inset 0 3px 7px #000a, inset 0 0 0 1px #ffffff12,
               inset 0 -1px 0 #ffffff0a}
  /* 부위 이름은 구멍 바닥에 새긴 글씨처럼 — 빈 칸이 스스로 주장하지 않게 */
  .slot:not([class*="fre-"]) b,
  .slot:not([class*="fre-"]){color:#5d6d86;text-shadow:0 1px 0 #0008}

  /* ── 하단 네비 ── */
  #nav{background:none;border-top:none;border-style:solid;border-width:9px 12px;
    border-image:var(--f-nav) 39 fill stretch}
  /* 선택 표시 그림(UI-NAVON 의 금색 호)은 뺐다. 5칸 중 한 칸만 커다란 장식이
     붙어 바 전체가 기울어 보이고, 아이콘까지 얹으면 그림 위에 그림이 된다.
     선택은 **아이콘이 밝아지고 글자가 금색이 되는 것**으로만 말한다. */
  .nv{text-shadow:0 1px 2px #000a}
  .nv.on{color:var(--gold)}
  /* 선택 탭은 **자리에서 솟는다** — 키우기 장르 공통 문법. 발밑에 골드 빛받침 */
  .nv.on img{filter:drop-shadow(0 0 8px #ffc94a99);opacity:1;
    transform:translateY(-7px) scale(1.22)}
  /* 솟는 아이콘이 상자를 넘지 않게 위쪽 여유를 준다. overflow:visible 만으로는
     "밖으로 나갔다"가 사실이라 검사기가 계속 잡는다 */
  .nv{padding-top:8px}
  /* 잠긴 탭 — 흐리게 + 자물쇠. 숨기지 않는다: 앞으로 뭐가 열리는지가 보여야
     진도를 밀 이유가 된다 (배속 잠금과 같은 규칙) */
  .nv.locked{opacity:.34;filter:grayscale(1)}
  .nv.locked::after{content:'🔒';position:absolute;top:6px;right:22%;font-size:10px;
    filter:none;opacity:.9}
  .nv.on{color:var(--gold);font-weight:800;overflow:visible}
  .nv.on::before{content:"";position:absolute;left:14%;right:14%;bottom:2px;height:22px;
    border-radius:50%;background:radial-gradient(ellipse at 50% 100%,#ffc94a3e,#0000 70%);
    pointer-events:none}

  /* ── 게이지 ──
     4~9px 짜리 얇은 바에 9-slice 를 물리면 테두리가 높이를 다 먹는다.
     배경 이미지를 통짜로 늘리는 게 이 크기에선 더 깨끗하다. */
  #xpbar,#fgProg,#qbar,.sh-bar,.tw-bar{background:var(--f-gauge) center/100% 100% no-repeat}
  #xpfill,#fgProgFill,#qfill,.sh-bar>i,.tw-bar>i{
    background:var(--f-fill) left center/auto 100% no-repeat;background-size:100% 100%}

  /* ── 재화 알약 ── */
  .sh-cur{background:none;border-style:solid;border-width:9px 14px;border-radius:0;
    border-image:var(--f-pill) 92 133 fill stretch;padding:1px 4px}

  /* 토스트 9-slice 는 뺐다 — pill 은 프레임 없이 얇아야 안내로 읽힌다 */


  /* ── 2차: 남은 버튼·행·칸 ──────────────────────────────────────────
     1차에서 상점 계열만 갈았더니 제작대·탑·프로필 버튼이 그대로 파란 그라디언트로
     남아 한 화면에 두 가지 재질이 섞였다. 같은 역할이면 같은 프레임을 쓴다.
       주 행동(제작·도전·수령)  → UI-BTN-GO
       보조 행동                → UI-BTN
       비활성                   → UI-BTN-OFF
  */
  .fgbtn,.tw-go{background:none;border-style:solid;border-width:12px;border-radius:0;
    border-image:var(--f-go) 159 209 fill stretch;color:#2a1c05;
    text-shadow:0 1px 0 #ffe9a880;padding:2px 6px;width:100%}
  .fgbtn img,.tw-go img{filter:drop-shadow(0 1px 1px #0006)}
  .fgbtn.warn{border-image:var(--f-btn) 127 163 fill stretch;color:var(--txt);
    text-shadow:0 1px 2px #0009}
  .fgbtn:disabled,.tw-go:disabled{opacity:1;
    border-image:var(--f-off) 120 fill stretch;color:var(--dim);text-shadow:none}

  /* 목록 한 줄 — .frow 와 같은 역할이므로 같은 카드 프레임 */
  .st-row,.tw-row,.pf-stats div,.pf-t{background:none;border-style:solid;border-width:10px;
    border-radius:0;border-image:var(--f-card) 122 fill stretch;margin-bottom:5px}
  .st-row{padding:2px 3px}
  .tw-row{padding:1px 3px}
  .pf-stats div{padding:2px 4px;margin-bottom:0}
  .pf-t{padding:1px 2px}
  /* 선택·현재 표시는 프레임을 바꾸지 않고 금색 글자 + 발광으로 준다 */
  .tw-row.now,.pf-t.on{filter:drop-shadow(0 0 6px #ffc94a66)}
  .tw-row.now b,.pf-t.on b{color:var(--gold)}

  /* 도감 칸 · 인벤토리 칸 · 편성 시트의 장착 칸 — 전부 같은 소켓이다.
     장착 줄만 2px 실선으로 두면 같은 화면에 테두리가 두 종류가 되고,
     잠금 칸의 점선까지 합쳐 셋이 된다 */
  .cx-cell,.pf-m,.rt-slot{background:none;border-style:solid;border-width:10px;
    border-radius:0;border-image:var(--f-slot) 41 fill stretch}
  .rt-slot{border-width:8px}
  /* 스킬 트랙은 한 줄에 8칸이라 칸이 38px 밖에 안 된다. 소켓을 8px 로 두면
     아이콘이 22px 로 쪼그라든다 — 그 줄만 테두리를 얇게 준다.
     .rt-gap 은 액티브/패시브를 가르는 간격이라 스킬 트랙에만 있다 */
  #shEq:has(.rt-gap) .rt-slot{border-width:5px}
  /* 도감의 등급 테두리 색은 프레임이 덮으므로 좌상단 등급 글자로 남긴다 */
  .cx-cell i{text-shadow:0 1px 3px #000,0 0 6px currentColor}

  /* 사이드 열 버튼 — 42px 짜리라 프레임을 9px 주면 글자가 3줄로 접힌다.
     아이콘이 주인공이니 테두리만 얇게 얹는다 */
  .side button{background:none;border-style:solid;border-width:5px;border-radius:0;
    border-image:var(--f-btn) 127 163 fill stretch;padding:2px 0}
  /* 38px 버튼에 테두리 5px 이면 안쪽이 28px 이다. 30px 아이콘이 2px 씩 삐져나왔다.
     좁은 화면(max-height:720)에서는 .side 가 --sideIco 를 20px 로 덮는다 */
  .side button img{width:var(--sideIco,26px);height:var(--sideIco,26px)}
  .side button span,.side button b{white-space:nowrap}

  /* 프로필 카드 — 프레임 색(--fr)은 살리고 판때기만 교체 */
  .pf-card{background:none;border-style:solid;border-width:16px;border-radius:0;
    border-image:var(--f-panel) 86 fill stretch;padding:6px 4px 8px;
    box-shadow:0 10px 30px #0009,0 0 22px -8px var(--fr)}
  .pf-card::after{display:none}


  /* ── 등급 액자 (FR-*) ──────────────────────────────────────────────
     N 돌 · R 초록 · SR 파랑 · SSR 보라 · UR 금 · LR 무지개.
     가운데가 뚫린 액자라 배경으로 깔면 그림이 가려진다 — ::after 로 위에 얹는다.
     테두리 색 1px 으로만 구분하던 걸 대신한다. 스크린샷에서 UR 과 SSR 이
     구분이 안 되면 자랑할 이유가 없어진다. */
  .cx-cell,.pf-m{position:relative}
  .cx-cell[class*=" g-"]::after,.pf-m[class*=" g-"]::after,.pf-m[class^="pf-m g-"]::after,
  .rt-slot[class*=" g-"]::after{
    content:"";position:absolute;inset:-4px;pointer-events:none;z-index:3;
    background:var(--fr-img) center/100% 100% no-repeat}
  .g-N{--fr-img:url(/assets/ui/FR-N.png)}
  .g-R{--fr-img:url(/assets/ui/FR-R.png)}
  .g-SR{--fr-img:url(/assets/ui/FR-SR.png)}
  .g-SSR{--fr-img:url(/assets/ui/FR-SSR.png)}
  .g-UR{--fr-img:url(/assets/ui/FR-UR.png)}
  .g-LR{--fr-img:url(/assets/ui/FR-LR.png)}
  /* 액자가 소켓 프레임과 겹치면 지저분하다. 액자가 있는 칸은 소켓을 뺀다.
     overflow:hidden 이면 바깥으로 나가는 액자가 잘려 아예 안 보인다 — .pf-m 에서 실제로 났다 */
  .cx-cell[class*="g-"],.pf-m[class*="g-"],.rt-slot[class*="g-"]{border-image:none;border:0;
    background:var(--card);border-radius:9px;overflow:visible}
  /* 액자가 레벨 글자를 덮으면 몇 레벨인지 못 읽는다 */
  .rt-slot b{z-index:4}
  .pf-m[class*="g-"] img{border-radius:8px}
  /* 액자가 이름을 덮으면 누가 누군지 못 읽는다. 글자를 액자 위로 올린다 */
  .cx-cell span{z-index:4}
  .cx-cell i{z-index:5}
  /* 상위 등급은 은은하게 빛난다 */
  .g-UR::after{filter:drop-shadow(0 0 5px #ffb64888)}
  .g-LR::after{filter:drop-shadow(0 0 7px #ff7ad688)}

  /* 미보유 칸도 같은 등급 액자를 쓰고 색만 죽인다. 액자를 빼면 한 그리드에
     테두리가 두 종류가 되고, 액자가 곧 "뽑으면 이 등급"이라는 예고를 겸한다.
     **UR/LR 발광 규칙 뒤에 와야 한다** — 앞에 두면 안 가진 UR 이 색을 띠고 빛난다 */
  .cx-cell.lock[class*="g-"]{background:#0f141d}
  .cx-cell.lock[class*="g-"]::after{filter:grayscale(1) brightness(.62)}


  /* ── 장비 액자 (FRE-*) / 프로필 액자 (PFRAME-*) ────────────────────
     회색 금속으로 그려져 있다. 색이 아니라 **장식의 양**이 등급이다 —
     아이템 색·프레임 색이 이미 따로 있어서 액자까지 색을 넣으면 신호가 둘로 갈린다.
     T1~3 단순 / T4~7 리벳 / T8~10 화려. 색은 기존 오라(--au)가 계속 맡는다. */
  /* 인벤 칸에는 액자를 **안 씌운다.** FRE-* 는 1024px 짜리 장식인데 칸은 60px 이라,
     그 크기에서는 무늬가 읽히지도 않고 장비 그림만 덮는다. 등급은 테두리 색과
     발광(--au/--aw)으로 말한다 — 액자는 크게 뜨는 상세 카드(.ei-ic)로 옮겼다 */
  .slot[class*="fre-"]{border:2px solid var(--au);background:var(--card);border-radius:9px;
    border-image:none;
    box-shadow:0 0 calc(var(--aw) * 9px) color-mix(in srgb, var(--au) 70%, transparent),
               inset 0 0 calc(var(--aw) * 7px) color-mix(in srgb, var(--au) 30%, transparent)}
  .fre-1{--fre-img:url(/assets/ui/FRE-01.png)}
  .fre-2{--fre-img:url(/assets/ui/FRE-02.png)}
  .fre-3{--fre-img:url(/assets/ui/FRE-03.png)}
  /* 상세 카드는 86px 이라 액자 무늬가 실제로 보인다. 그림은 액자 안쪽에 들어가게 줄인다 */
  .ei-ic[class*="fre-"]{position:relative;overflow:visible;border-color:transparent;
    background:none;box-shadow:none}
  .ei-ic[class*="fre-"]::after{content:"";position:absolute;inset:-14%;pointer-events:none;
    z-index:2;background:var(--fre-img) center/100% 100% no-repeat}
  .ei-ic[class*="fre-"] img{width:52px;height:52px}
  /* 오라 색을 액자에 얹어 등급이 한눈에 보이게. --au 는 renderEquip 이 넣는다 */
  .slot.g-hi::after{filter:drop-shadow(0 0 5px var(--au))}

  /* 프로필 원형 액자 — 티어 1~4 가 그대로 PFRAME-01~04 다.
     색(--fr)은 액자를 물들이지 않고 뒤에서 은은하게 새어 나오게 한다. */
  /* 액자를 밖에 그리려면 overflow:visible 이 필요한데, 그러면 150% 로 확대해 둔
     아바타 그림도 같이 새어 나온다. 그림만 clip-path 로 따로 자른다. */
  .pf-ava{position:relative;border:0;overflow:visible}
  .pf-ava img{border-radius:50%;clip-path:circle(33.3% at 50% 50%)}
  /* 130% 짜리 그림이 흐름 안에 있으면 aspect-ratio:1 을 밀어내 칸이 세로로 3px 길어진다.
     (6칸 그리드에서 줄마다 어긋나 보였다.) 절대배치로 빼서 상자 크기에서 떼어 놓는다. */
  .pf-m[class*="g-"]{position:relative;overflow:visible}
  .pf-m[class*="g-"] img{position:absolute;inset:-15%;width:130%;height:130%;margin:0;
    clip-path:inset(11.5% round 7px)}
  .pf-ava::after{content:"";position:absolute;inset:-13%;pointer-events:none;z-index:2;
    background:var(--pfr-img) center/100% 100% no-repeat;
    filter:drop-shadow(0 0 7px var(--fr))}
  .pfr-1{--pfr-img:url(/assets/ui/PFRAME-01.png)}
  .pfr-2{--pfr-img:url(/assets/ui/PFRAME-02.png)}
  .pfr-3{--pfr-img:url(/assets/ui/PFRAME-03.png)}
  .pfr-4{--pfr-img:url(/assets/ui/PFRAME-04.png)}


  /* ── 3차: 마지막 버튼들 ───────────────────────────────────────────
     소환 결과의 "착용하기", 퀘스트 수령, 방치 보상, 스킬바 액션이 아직
     파란·초록 그라디언트였다. 화면마다 버튼 재질이 다르면 "누를 수 있는 것"이
     무엇인지 매번 다시 배워야 한다. */
  .er-pick,.q-go,.id-btns button,.id-alt button,.act{
    background:none;border-style:solid;border-width:10px;border-radius:0;
    border-image:var(--f-btn) 127 163 fill stretch;color:var(--txt);
    text-shadow:0 1px 2px #0009;padding:2px 6px}
  .er-pick:not(.scrap),.q-go.done,.id-btns .ad,.id-alt button.ad,.act.primary,.act.on{
    border-image:var(--f-go) 159 209 fill stretch;color:#2a1c05;
    text-shadow:0 1px 0 #ffe9a880}
  .act:disabled,.q-go:disabled,.er-pick:disabled{opacity:1;
    border-image:var(--f-off) 120 fill stretch;color:var(--dim);text-shadow:none}
  .act{padding:2px 1px}
  .id-btns button,.id-alt button{padding:3px 4px}

  /* 소환 결과 카드 — 등급 오라(--au)는 그대로 두고 판때기만 교체 */
  .er-card{background:none;border-style:solid;border-width:11px;border-radius:0;
    border-image:var(--f-card) 122 fill stretch;padding:2px}
  /* "새로 나옴" 은 금색 판때기로 덮지 않는다 — 등급 색 글자가 금색 위에서 안 읽힌다.
     같은 카드 프레임에 금색 발광만 얹어 눈이 먼저 가게 한다 */
  .er-card.new{box-shadow:none;filter:drop-shadow(0 0 9px #ffc94a66)}


  /* ── 4차: 통짜 3장 (UI-LOCK / UI-DIV / UI-CORNER) ──────────────────
     자물쇠가 이모지라 기기 폰트에 따라 모양이 달라진다. 안드로이드에서 파란 자물쇠,
     iOS 에서 노란 자물쇠가 뜨면 같은 게임으로 안 보인다. */
  .lockIc{width:15px;height:15px;object-fit:contain;vertical-align:-3px;
    filter:drop-shadow(0 1px 2px #000a)}
  .sk.lock::after{content:"";width:16px;height:16px;
    background:url(/assets/ui/UI-LOCK.png) center/contain no-repeat;
    filter:grayscale(.4) brightness(.8);opacity:.75}
  .cx-cell.lock::before,.slot:not([class*="fre-"]) .lockIc{}

  /* 구분선 — 4:1 로 그려진 장식이라 폭에 맞춰 늘리면 40:1 로 짓눌려 실선이 된다.
     장식은 원본 비율로 가운데에 두고, 폭은 그라디언트 선이 채운다. */
  .lbl,.sh-h2,.cx-h{position:relative;padding-bottom:13px}
  .lbl::before,.sh-h2::before,.cx-h::before{content:"";position:absolute;
    left:0;right:0;bottom:5px;height:1px;pointer-events:none;
    background:linear-gradient(90deg,#0000,#c8922e88 22%,#c8922e88 78%,#0000)}
  .lbl::after,.sh-h2::after,.cx-h::after{content:"";position:absolute;
    left:50%;bottom:0;width:76px;height:19px;margin-left:-38px;pointer-events:none;
    background:url(/assets/ui/UI-DIV.png) center/contain no-repeat}

  /* 화면 네 귀 장식 — 오버레이 카드에만. 전투 화면에 두면 캐릭터를 가린다 */
  #ovcard{position:relative}

  /* ── 화면별 스킨 — 오버레이가 전부 같은 얼굴이면 어디에 있는지 잊는다.
     프레임(9-slice)은 공용으로 두고, 카드 위쪽에 색 띠와 은은한 발광만 차등한다.
     색은 그 화면의 성격에서 온다: 출석 초록(성장/일일) · 패스 금(프리미엄) ·
     아레나 적(경쟁) · 훈련소 청동(단련) · 연합 보라(집단) */
  #ovcard::before{content:"";position:absolute;left:15px;right:15px;top:15px;height:52px;
    pointer-events:none;z-index:0;opacity:.5;
    background:linear-gradient(var(--ov-tone,#0000), #0000)}
  #ovcard[data-skin="attend"]{--ov-tone:#2e7d3288}
  #ovcard[data-skin="pass"]{--ov-tone:#b8860b88}
  #ovcard[data-skin="arena"]{--ov-tone:#c6282888}
  #ovcard[data-skin="training"]{--ov-tone:#8d6e6388}
  #ovcard[data-skin="alliance"]{--ov-tone:#6a1b9a88}
  #ovcard[data-skin] #ovt{text-shadow:0 1px 3px #000, 0 0 14px var(--ov-tone)}
  #ovcard::before,#ovcard::after{content:"";position:absolute;width:26px;height:26px;
    pointer-events:none;z-index:5;opacity:.85;
    background:url(/assets/ui/UI-CORNER.png) center/contain no-repeat}
  #ovcard::before{left:-4px;top:-4px}
  #ovcard::after{right:-4px;top:-4px;transform:scaleX(-1)}


  /* ── 소환 토글 · 레벨 보상 ────────────────────────────────────────
     두 트랙을 나란히 놓으면 소환진 그림이 둘 다 반쪽이 된다. 하나만 크게 띄우고
     토글로 바꾼다 — 소환은 이 게임의 간판 화면이다. */
  .sm-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
  .sm-t{position:relative;padding:2px 4px;font-size:13px;font-weight:800;cursor:pointer;
    font-family:inherit;color:var(--txt);text-shadow:0 1px 2px #0009;
    background:none;border-style:solid;border-width:10px;border-radius:0;
    border-image:var(--f-btn) 127 163 fill stretch;min-height:42px}
  .sm-t.on{border-image:var(--f-go) 159 209 fill stretch;color:#2a1c05;
    text-shadow:0 1px 0 #ffe9a880}
  /* 큰 소환 카드 — 그림이 주인공이라 세로를 넉넉히 준다 */
  /* min-height 로 늘리면 내용이 끝난 아래가 빈 띠로 남는다. 대신 본문 위 여백을
     키워 소환진 그림이 그만큼 더 보이게 한다 — 카드 높이는 내용이 정한다. */
  /* 소환 탭은 카드가 주인공이다 — 아래에 빈 공간이 남으면 화면이 안 채워져 보인다.
     본문을 세로 flex 로 만들고 카드를 늘려 남는 높이를 먹인다 (그림도 같이 커진다) */
  #shop .sh-body:has(.sh-summon.big){display:flex;flex-direction:column}
  .sh-summon.big{margin-bottom:10px;flex:1 1 auto;display:flex;flex-direction:column;
    min-height:280px}
  /* 그림은 절대배치(inset:0)라 흐름에서 안 늘어난다. 대신 **본문 위 여백**이
     그림이 보이는 높이다 — 카드가 커진 만큼 여백을 늘려 그림도 같이 커진다 */
  .sh-summon.big .sh-sbody{flex:1 1 auto;display:flex;flex-direction:column;
    justify-content:flex-end;padding-top:0}
  .sh-summon.big .sh-art{background-position:center 22%;background-size:cover}

  /* 받을 게 있다는 빨간 점. 자동 지급이 아니라 눌러서 받는다 */
  .dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
    background:var(--warn);border:1.5px solid var(--ink);
    box-shadow:0 0 6px #ff5a6aaa;animation:dotPulse 1.3s ease-in-out infinite}
  @keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  .sm-claim{position:relative;width:100%;margin:8px 0 0;padding:2px 6px;min-height:38px;
    font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:5px;
    color:#2a1c05;text-shadow:0 1px 0 #ffe9a880;
    background:none;border-style:solid;border-width:10px;border-radius:0;
    border-image:var(--f-go) 159 209 fill stretch}
  .sm-claim img{width:15px;height:15px;object-fit:contain}
  /* 보유 소환권 — 소환 카드 상단 상시 표시. 0장이어도 띄운다 (없다는 것도 정보다) */
  /* 보유 소환권 — 그림 위 우상단 배지. 옛 인라인 규칙은 아래에서 덮인다 */
  .sh-summon.big .sm-tk{position:absolute;right:10px;top:10px;z-index:3;margin:0;
    display:inline-flex;align-items:center;gap:5px;
    background:#000000b8;border:1px solid #ffffff2e;border-radius:13px;
    padding:5px 11px 5px 7px;font-size:14px;font-weight:400;color:#f5ecdc;
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;
    text-shadow:0 1px 3px #000;box-shadow:0 3px 10px #0009}
  .sh-summon.big .sm-tk img{width:20px;height:20px}
  .sm-tk{margin-left:auto;display:inline-flex;align-items:center;gap:3px;
    font-size:11px;font-weight:800;color:var(--gold);
    background:#0b0f17cc;border:1px solid var(--gold);border-radius:12px;padding:2px 9px}
  .sm-tk img{width:13px;height:13px;object-fit:contain}
  /* 하단 네비의 빨간 점 */
  .nv.hasnew::after{content:"";position:absolute;top:6px;right:24%;width:8px;height:8px;
    border-radius:50%;background:var(--warn);box-shadow:0 0 6px #ff5a6aaa}


  /* ── 좁은 세로 화면(640px)에서의 사이드 열 ─────────────────────────
     이 블록은 반드시 UI 킷 **뒤**에 있어야 한다. 앞에 두면 킷의
     `.side button{border-width:5px}` 가 나중에 나와서 덮어버린다 —
     실제로 그래서 아이콘이 버튼 밖으로 2px 씩 새어 나왔다.

     전투 패널이 286px 뿐이라 45px 짜리 버튼 4개가 퀘스트 배너·스킬바까지 내려온다.
     4*38 + 3*3 = 161px → 132~293. 스킬바(306)와 안 만난다. */
  @media (max-height: 720px){
  }

  /* ── 편성 시트 (용병 / 스킬 탭) ──────────────────────────────────
     가운데 오버레이가 아니라 아래에서 올라오는 바텀시트다. 화면 60%.
     목록 칸은 도감의 .cx-grid/.cx-cell 을 그대로 쓴다 — ??? · 회색 처리가
     거기 이미 있고, 새로 만들면 같은 용병이 두 화면에서 다르게 보인다. */
  .rs-bar{height:8px;margin:0 0 4px;background:var(--f-gauge) center/100% 100% no-repeat}
  .rs-bar i{display:block;height:100%;
    background:var(--f-fill) left center/100% 100% no-repeat}

  /* 시트는 하단 네비(8%) **위**에서 끝난다. 네비를 덮으면 용병↔스킬을 오가려고
     매번 시트를 닫아야 한다 — 트랙을 가르는 건 시트 안 토글이 아니라 네비 탭이다. */
  /* --navh 는 시트를 열 때 네비의 실측 높이로 채운다. 8% 로 두면 네비의
     9px 프레임 테두리 때문에 시트와 네비 사이에 틈이 벌어진다. */
  #sheetBg{position:absolute;left:0;right:0;top:0;bottom:var(--navh,8%);z-index:64;
    background:#060a12b0;display:none}
  #sheetBg.show{display:block}
  #sheet{position:absolute;left:0;right:0;bottom:var(--navh,8%);height:70%;z-index:65;
    display:none;flex-direction:column;background:var(--bg);
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    box-shadow:0 -12px 40px #000a;
    transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.9,.3,1)}
  #sheet.show{display:flex;transform:none}

  /* 껍데기(헤드·장착·액션)가 시트의 44% 를 먹고 목록이 2.8행만 보이던 것을 줄였다.
     헤드는 [제목+요약] 한 덩어리와 닫기 버튼 두 칸이다 */
  #shHead{flex:0 0 auto;display:flex;align-items:flex-start;gap:8px;padding:9px 12px 6px}
  #shHeadL{flex:1;min-width:0}
  #shPre{display:flex;gap:5px;padding:0 12px 7px;align-items:center}
  #shPre .pr{flex:0 0 auto;min-width:44px;padding:4px 9px;font-size:11px;font-weight:800;
    background:var(--ink2);border:1px solid var(--line);border-radius:7px;color:var(--dim);
    cursor:pointer;font-family:inherit}
  #shPre .pr.has{color:var(--txt);border-color:var(--line)}
  #shPre .pr.on{border-color:var(--gold);color:var(--gold)}
  #shPre .pr-save{margin-left:auto;font-size:10px;padding:4px 8px;background:none;
    border:1px dashed #6b543a;border-radius:7px;color:var(--dim);cursor:pointer;font-family:inherit}
  #shT{flex:1;font-size:15px;font-weight:900;color:var(--gold);text-shadow:0 1px 3px #000}
  #shT i{font-style:normal;font-size:11px;font-weight:700;color:var(--dim);margin-left:6px}
  #shX{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12px;font-family:inherit}
  .sh-go{flex:0 0 auto;width:36px;height:36px;background:var(--card);border:1px solid var(--line);
    color:var(--txt);border-radius:9px;padding:3px;cursor:pointer;font-size:11px;font-family:inherit}
  .sh-go img{width:100%;height:100%;object-fit:contain;pointer-events:none;
    filter:drop-shadow(0 1px 3px #000a)}
  .sh-go:active{transform:translateY(1px)}

  /* 장착 줄 — 가로 아이콘. 세로 카드로 하면 5줄이 시트 상단을 다 먹는다 */
  #shEq{flex:0 0 auto;display:flex;gap:5px;padding:0 12px 9px}
  .rt-slot{position:relative;flex:1 1 0;min-width:0;aspect-ratio:.9;border-radius:9px;
    background:var(--card);border:2px solid var(--line);overflow:hidden}
  .rt-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    object-position:center 26%}
  .rt-slot b{position:absolute;left:0;right:0;bottom:0;text-align:center;
    font-size:9px;font-weight:800;padding:1px 0;
    background:linear-gradient(#0000,#0b0f17e8 45%);text-shadow:0 1px 3px #000}
  .rt-slot.empty::after{content:"+";position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;font-size:17px;color:var(--dim)}
  /* 아직 안 열린 칸. 빈 칸(+)과 달라 보여야 "더 열린다"가 읽힌다.
     **점선을 쓰지 않는다** — 킷은 전부 9-slice 소켓인데 여기만 CSS 점선이라
     한 칸만 웹 폼처럼 보였다. 소켓은 그대로 두고 안쪽을 눌러 어둡게 한다 */
  .rt-slot.locked{filter:saturate(.25) brightness(.62)}
  .rt-slot.locked::before{content:"";position:absolute;inset:0;z-index:1;
    background:radial-gradient(circle at 50% 45%,#0b0f1755,#0b0f17cc 78%)}
  .rt-slot.locked .lockIc{position:absolute;inset:0;margin:auto;z-index:2;
    width:44%;max-width:22px;height:auto;opacity:.85;
    filter:drop-shadow(0 1px 3px #000)}
  /* 액티브/패시브 사이를 벌린다. 안 벌리면 8칸이 한 덩어리로 보인다 */
  .rt-gap{flex:0 0 7px}

  #shSum{padding:2px 0 0;font-size:11px;color:var(--dim);line-height:1.25}
  #shSum b{color:var(--gold);font-weight:900}
  #shBody{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 12px 10px}
  /* 장착 중인 칸 — 목록에서 눈에 띄어야 "이미 낀 것"을 다시 안 찾는다 */
  .cx-cell.on{border-color:var(--gold);box-shadow:0 0 10px -2px var(--gold) inset}
  /* 레벨 — **좌상단 배지**. 숫자는 칸의 첫 정보라 눈이 먼저 가는 자리에 둔다 */
  .cx-cell .cx-lv{position:absolute;left:3px;top:3px;z-index:5;
    font-size:9px;font-weight:400;padding:1px 4px;border-radius:5px;
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;
    background:#000000b0;color:#f5ecdc;text-shadow:0 1px 2px #000}
  .cx-cell .cx-lv.max{color:var(--gold)}
  /* 재료 — **하단 게이지**. 다음 레벨까지 얼마나 모였나를 길이로 본다.
     중복 1개 = 1레벨이라(cascade.twoStepRule) 게이지는 "쌓인 중복 / 남은 레벨"이다 */
  .cx-cell .cx-g{position:absolute;left:4px;right:4px;bottom:4px;z-index:5;height:5px;
    background:#000000a8;border-radius:3px;overflow:hidden}
  .cx-cell .cx-g i{display:block;height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,#3f8a4f,var(--up))}
  .cx-cell .cx-g b{position:absolute;inset:0;font-size:7px;line-height:5px;
    text-align:center;color:#fff;font-weight:400;
    font-family:"Black Han Sans","Jua",system-ui,sans-serif;text-shadow:0 0 3px #000}
  .cx-cell .cx-f{position:relative;z-index:4;width:100%;text-align:center;
    font-size:9px;font-weight:800;padding:2px 1px;
    background:linear-gradient(#0000,var(--ink) 45%);
    text-shadow:0 1px 3px #000;color:var(--dim)}
  /* 올릴 게 있는 칸은 테두리가 초록으로 — 목록에서 바로 눈에 든다 */
  .cx-cell.up{box-shadow:0 0 0 2px var(--up) inset}

  .cx-cell .rt-lv{position:absolute;top:3px;right:3px;left:auto;font-style:normal;
    font-size:8px;font-weight:900;color:var(--gold);background:#0b0f17d0;
    padding:1px 4px;border-radius:5px}
  /* 액티브/패시브 — 줄로 안 가르는 대신 칸 왼쪽 위에 한 글자 */
  .cx-cell .rt-kind{position:absolute;top:3px;left:3px;font-style:normal;
    font-size:8px;font-weight:900;color:#cfe0ff;background:#0b0f17d0;
    padding:1px 4px;border-radius:5px}

  /* 액션바 — 고정. 목록과 같이 스크롤되면 눌러야 할 때 화면 밖에 있다 */
  #shAct{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:7px;
    padding:5px 12px 6px;border-top:1px solid #ffffff1a}
  .rt-b{padding:2px 4px;min-height:36px;font-size:13px;font-weight:800;cursor:pointer;
    font-family:inherit;color:var(--txt);text-shadow:0 1px 2px #0009;
    background:none;border-style:solid;border-width:10px;border-radius:0;
    border-image:var(--f-btn) 127 163 fill stretch}
  .rt-b.go{border-image:var(--f-go) 159 209 fill stretch;color:#2a1c05;
    text-shadow:0 1px 0 #ffe9a880}
  .rt-b:disabled{opacity:.4;cursor:default}

  /* 던전 모드 — 장착 줄·이월·액션바가 없다. 시트 껍데기만 같이 쓴다 */
  #sheet.mode-dg #shEq,#sheet.mode-dg #shSum,#sheet.mode-dg #shAct,
  #sheet.mode-dg #shPre{display:none}
  #sheet.mode-dg #shBody{padding-bottom:12px}


  /* ── 연합 탭 ────────────────────────────────────────────────── */
  .al-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
  .al-t{padding:1px 2px;min-height:34px;font-size:12px;font-weight:800;cursor:pointer;
    font-family:inherit;color:var(--txt);text-shadow:0 1px 2px #0009;
    background:none;border-style:solid;border-width:9px;border-radius:0;
    border-image:var(--f-btn) 127 163 fill stretch}
  .al-t.on{border-image:var(--f-go) 159 209 fill stretch;color:#2a1c05;
    text-shadow:0 1px 0 #ffe9a880}
  #ovb .frow .v img{width:14px;height:14px;object-fit:contain;vertical-align:-2px}


  /* ── 패스 화면 ─────────────────────────────────────────────────
     사이드 열에 5번째 버튼이 생겼다. 좁은 세로(640)에서 5개가 스킬바까지 내려오므로
     열을 더 올리고 버튼을 33px 로 줄인다. 5*33 + 4*3 = 177px → 120~297. */
  .ps-hero{position:relative;text-align:center;padding:16px 12px 14px;
    background:linear-gradient(150deg,#3b2a6b,#1d2a52);border-radius:14px;
    border:1px solid #7a6ad6;box-shadow:0 8px 26px #0008}
  .ps-hero b{display:block;font-size:18px;font-weight:900}
  .ps-hero span{display:block;font-size:11px;color:#cfd6ff;margin:3px 0 10px}
  .ps-hero .fgbtn{width:auto;padding:2px 18px;min-height:40px}


  /* ── 패널 마감 ─────────────────────────────────────────────────
     이 블록은 UI 킷 뒤에 온다. 앞에 두면 킷 규칙이 나중에 나와서 덮는다. */

  /* 사이드 아이콘 — 네모 판을 걷어낸다.
     42px 짜리 칸에 프레임까지 두르면 아이콘이 26px 로 쪼그라들어 무슨 그림인지 안 읽힌다.
     판을 빼면 그 공간이 전부 아이콘 몫이 되고, 글자는 아이콘 아래에 겹쳐 얹는다. */
  .side button{background:none;border:0;border-image:none;border-radius:0;
    box-shadow:none;padding:0;width:44px;height:44px;position:relative;
    display:block;overflow:visible}
  .side button img{width:100%;height:100%;margin:0;
    filter:drop-shadow(0 2px 4px #000c) drop-shadow(0 0 2px #000a)}
  .side button span{position:absolute;left:-4px;right:-4px;bottom:-2px;
    font-size:9px;font-weight:800;line-height:1.1;letter-spacing:-.3px;
    color:#fff;text-shadow:0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000,
      0 2px 5px #000;pointer-events:none}
  .side button:active img{transform:translateY(1px) scale(.94)}
  /* 그림이 아직 없으면 onerror 가 img 를 지운다 — 그러면 글자만 허공에 뜬다.
     받침을 깔아 버튼이라는 걸 남긴다. */
  .side button:not(:has(img)){background:radial-gradient(circle at 50% 40%,#2b3854,#131a28);
    border:1px solid #ffffff26;border-radius:11px}
  .side button:not(:has(img)) span{position:absolute;inset:0;font-size:10px;
    display:flex;align-items:center;justify-content:center;line-height:1}
  .side button.hasnew::after{top:0;right:0}

  /* 상단 패널 — 프레임 띠를 깐다. 재화 알약은 이미 UI-PILL 이라 겹치지 않게 얇게. */
  #top{background:none;border-bottom:none;border-style:solid;
    border-width:8px 12px 10px;border-image:var(--f-nav) 39 fill stretch;
    padding:2px 4px;gap:4px}
  #capbox{filter:drop-shadow(0 2px 5px #0009)}
  #cp{text-shadow:0 2px 6px #000a}

  /* 하단 패널 — 장비 칸과 제작대가 올라앉는 판.
     UI 킷의 남색 판은 위쪽 전투 화면(초원·하늘)과 아래 네비(나무)의 따뜻한 색
     사이에서 혼자 차갑게 떠 있었다. 새 에셋을 만드는 대신 **제작대를 광원으로**
     삼는다 — 판 아래 가운데에서 불빛이 번지고 가장자리로 갈수록 어두워진다.
     제작대가 이 판의 주인공이라는 것도 빛이 대신 말해 준다. */
  #bottom{position:relative;isolation:isolate;
    background:none;border-top:none;border-style:solid;
    border-width:10px 12px 12px;border-image:var(--f-panel) 86 fill stretch;
    padding:2px 4px 4px}
  #bottom::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:
      /* 가장자리 감쇠 — 먼저 깔아 바닥을 눌러 둔다 */
      radial-gradient(150% 130% at 50% 72%, #0000 34%, #05080e 100%),
      /* 제작대 화덕 불빛 — 중심을 제작대 오브젝트 높이에 맞춘다 */
      radial-gradient(76% 58% at 50% 86%, #ff9a3c3d 0%, #d9541a1f 42%, #0000 76%)}
  /* 불빛은 배경층이므로 내용은 그 위로 올린다 */
  #bottom > *{position:relative;z-index:0}

  /* 스테이지 진행도 — 전용 에셋(UI-STAGE)이 나오면 배경으로 깐다.
     그때까지는 UI-PILL 로 대비만 확보한다. 에셋이 오면 --f-stage 만 바꾸면 된다. */
  /* 판 없음 — 사용자 확정. 글자는 외곽선+그림자로만 배경에서 분리한다.
     (UI-STAGE 에셋 보류. 점은 UI-PIP 3종이 오면 .dotw 규칙이 자동으로 입는다) */
  #hudC{padding:2px 4px;border:0;pointer-events:none}
  #stg{text-shadow:0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 2px 8px #000}
  #stg{font-size:13px;text-shadow:0 1px 3px #000}
  #stg i{color:var(--gold);opacity:1;font-weight:800}
  #enc{margin-top:3px}
  /* 진행도 점 — UI-PIP 3종이 생기면 첫 배경층(그림)이 그라디언트를 덮는다.
     404 면 그림 층만 조용히 비어 아래 그라디언트가 그대로 보인다 — 폴백 공짜. */
  /* 그림이 실제로 들어왔으므로 CSS 테두리는 뺀다 — 점 원화에 금테가 이미 있다.
     1px 어두운 링을 얹으면 11px 에서 금테가 절반 죽는다. */
  .dotw{width:12px;height:12px;border:0;border-radius:50%;
    background:url(/assets/ui/UI-PIP.png) center/contain no-repeat,#39435c;
    box-shadow:none}
  .dotw.on{background:url(/assets/ui/UI-PIP-ON.png) center/contain no-repeat,
    radial-gradient(circle at 40% 35%,#ffe9a8,#e8a72c);
    border:0;box-shadow:0 0 6px #ffc94a99}
  .dotw.boss{width:16px;height:16px;
    background:url(/assets/ui/UI-PIP-BOSS.png) center/contain no-repeat,#5a2634;
    border:0}
  .dotw.boss.on{background:url(/assets/ui/UI-PIP-BOSS-ON.png) center/contain no-repeat,
    radial-gradient(circle at 40% 35%,#ffb0b8,#d63a4c);
    border:0;box-shadow:0 0 8px #ff5a6aaa}


  /* 자동 소환 — 톱니만 있으면 무슨 버튼인지 안 읽힌다. 사이드 아이콘과 같은 방식으로
     그림 아래에 글자를 겹쳐 얹는다. 판을 걷어내 톱니가 칸을 다 쓰게 한다. */
  #b_auto{background:none;border:0;box-shadow:none;overflow:visible}
  #b_auto img,#b_auto .gear{width:34px;height:34px;font-size:30px;line-height:34px;
    filter:drop-shadow(0 2px 4px #000c)}
  .au-lb{position:absolute;left:-6px;right:-6px;bottom:-3px;font-size:9px;font-weight:800;
    line-height:1.1;color:#fff;pointer-events:none;text-align:center;
    text-shadow:0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 2px 5px #000}
  #b_auto.on{background:none;box-shadow:none}
  #b_auto.on img,#b_auto.on .gear{filter:drop-shadow(0 0 7px #5ad86aaa) drop-shadow(0 2px 4px #000c)}
  #b_auto.on .au-lb{color:#8cf59a}

  /* 상단바 설정 버튼 — 스테이지 텍스트 자리를 물려받았다.
     같은 정보(스테이지)가 전투 화면 진행도에 이미 크게 떠 있어 두 번 적을 이유가 없다. */
  /* 우편도 같은 규격으로 옆에 선다 */
  .topIc{position:relative;flex:0 0 auto;width:34px;height:34px;padding:0;cursor:pointer;
    background:none;border:0;border-radius:9px;font-size:18px;color:var(--dim);
    line-height:34px;text-align:center}
  .topIc img{width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 2px 4px #000a)}
  .topIc:active{transform:translateY(1px) scale(.94)}
  /* 안 읽은 우편 빨간 점. 사이드 버튼의 .hasnew 와 같은 규칙이다 */
  .topIc.hasnew::after{content:'';position:absolute;top:0;right:0;
    width:9px;height:9px;border-radius:50%;background:var(--warn);
    box-shadow:0 0 6px var(--warn)}

  /* ── 시즌 패스 ─────────────────────────────────────────────────
     한 줄에 [티어][무료][프리미엄]. 유료를 오른쪽에 두는 이유 — 무료를 누르러 오면
     시선이 자연히 옆으로 간다. 위아래로 나누면 유료가 화면 밖으로 밀린다. */
  .ps-top{display:flex;align-items:baseline;gap:10px;padding:2px 4px 8px}
  .ps-tinfo b{font-family:"Black Han Sans",system-ui,sans-serif;font-size:26px;color:var(--gold)}
  .ps-tinfo span{font-size:11px;color:var(--dim);margin-left:4px}
  .ps-tnext{margin-left:auto;font-size:11px;color:var(--dim)}
  .ps-buy{display:flex;gap:6px;margin-bottom:10px}
  .ps-buy .fgbtn{flex:1;min-height:42px}
  .ps-buy .mdBuy{flex:0 0 auto;min-height:42px;padding:1px 12px}
  .ps-own{flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;
    font-weight:800;color:var(--gold);background:var(--card);border:1px solid var(--gold);
    border-radius:9px;min-height:42px}
  .ps-head{display:grid;grid-template-columns:44px 1fr 1fr;gap:5px;
    font-size:10px;color:var(--dim);text-align:center;padding-bottom:4px}
  .ps-row{display:grid;grid-template-columns:44px 1fr 1fr;gap:5px;margin-bottom:5px;
    align-items:stretch}
  .ps-row.now .ps-tier{border-color:var(--gold);color:var(--gold)}
  .ps-tier{display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 0}
  .ps-tier b{font-size:14px;font-weight:900;line-height:1}
  .ps-tier span{font-size:9px;color:var(--dim)}
  .ps-cell{position:relative;display:flex;flex-wrap:wrap;align-items:center;
    justify-content:center;gap:4px;padding:8px 6px 16px;cursor:pointer;font-family:inherit;
    background:none;border-style:solid;border-width:10px;border-radius:0;
    border-image:var(--f-card) 122 fill stretch;color:var(--txt);min-height:64px}
  .ps-cell.off{opacity:.45;cursor:default}
  .ps-cell.done{opacity:.6}
  .ps-c{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:800}
  .ps-c img{width:14px;height:14px;object-fit:contain}
  .ps-deco{color:var(--gold);font-size:10px}
  .ps-mark{position:absolute;left:0;right:0;bottom:1px;font-style:normal;
    font-size:9px;font-weight:800;color:var(--dim)}
  .ps-mark.ps-go{color:#2a1c05;background:linear-gradient(180deg,#ffd76a,#e8a72c);
    border-radius:0 0 4px 4px;padding:1px 0}


  /* ── 좁은 세로(≤720px) 최종 조정 ───────────────────────────────
     반드시 파일 끝. 패널 마감 블록이 .side button 을 44px 로 다시 키우므로
     그보다 뒤에서 줄여야 이긴다 — 한 번 당한 특이도/순서 함정이다.
     좌 3개 x 34px + 2 x 3px = 108px. 우 2개 = 71px. 배속(≈120~140)과 겹치지 않게
     우측 열을 배속 아래에서 시작한다. */
  @media (max-height: 720px){
    /* 전투 패널이 205px 까지 줄어든다. 사이드가 9개에서 5개로 줄어 26px 상한은
       필요 없어졌지만, 좁은 화면에서 글자를 접는 규칙은 그대로 둔다 */
    .side{top:3px;gap:2px}
    /* 우측은 배속(4)·타이머(34~56) 아래서 시작해야 한다 */
    #sideR{top:60px}
    #timer{position:absolute;top:32px;right:8px;margin:0;font-size:17px}
    .side button{width:26px;height:26px}
    .side button span{display:none}
    #speed .sbtn{padding:2px 7px;font-size:10px}
    #eqR{display:none}
    #eq{grid-template-columns:1fr}
    #skAuto{width:30px;height:30px;font-size:8px}
    /* 스킬 줄이 사이드 열(우측 26px 폭) 밑으로 들어가지 않게 더 줄인다.
       30+6+8*26+7*6 = 286px → 좌우 여백 37px, 열(34px)과 안 만난다 */
    .sk{width:26px}
    #skRow{gap:5px}
  }

  /* ── 참고 배치 (버섯커 스크린샷) ──────────────────────────────────
     스킬바 왼쪽 AUTO · 인벤토리 2줄(아랫줄 = 추후 시스템 잠금 칸). */
  #skRow{display:flex;align-items:center;justify-content:center;gap:6px;pointer-events:auto}
  #skAuto{flex:0 0 auto;width:40px;height:40px;border-radius:50%;cursor:pointer;
    font-family:inherit;font-size:9px;font-weight:900;line-height:1.1;color:var(--dim);
    background:var(--card)cc;border:2px solid var(--line);padding:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  #skAuto i{font-style:normal;font-size:8px}
  #skAuto.on{color:#3a2a08;background:radial-gradient(circle at 40% 35%,#ffe9a8,#e8a72c);
    border-color:#ffd76a;box-shadow:0 0 8px #ffc94a88}
  /* 쿨타임 와이프 — 시전 직후 어두운 원뿔이 시계 방향으로 걷힌다.
     --cd 는 남은 각도(360deg → 0). rAF 가 깎는다 */
  .sk .cdwipe{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    display:none;background:conic-gradient(#0009 var(--cd,0deg),#0000 0)}
  .sk.cool .cdwipe{display:block}
  .sk.flash{box-shadow:0 0 12px #ffe9a8cc!important;border-color:#ffe9a8!important}

  /* 수동 모드에서 준비된 스킬 — 눌러 달라고 빛난다 */
  .sk.ready{cursor:pointer;box-shadow:0 0 10px #ffc94aaa!important;border-color:var(--gold)!important}

  /* 인벤토리 아랫줄 — 추후 시스템. 잠긴 칸도 격자를 유지해야 "생길 자리"로 읽힌다 */
  .slot.future{cursor:default;opacity:.55}
  .slot.future img.lk{width:16px;height:16px;opacity:.8;
    filter:grayscale(.3) brightness(.9)}
  .slot.future span{position:absolute;bottom:2px;font-size:8px;color:var(--dim)}

  /* 장비 확대(정보) 패널 — 아이콘의 등급 액자(fre-)가 카드 프레임과 겹쳐
     지저분했다. 정보 화면에서는 액자 없이 아이콘만 크게. */
  .ei-top{padding:6px 0 14px;justify-content:center}
  .ei-ic{width:86px;height:86px;border-width:2px;overflow:hidden;border-radius:15px;
    box-shadow:0 0 14px -2px var(--au)}
  .ei-ic img{width:64px;height:64px}


  /* ══ 좁은 화면(360×640) 최종 보정 ═════════════════════════════
     UI 킷 규칙 **뒤**라야 이긴다 — 앞에 두면 킷이 덮어써서 겹침이 남는다.
     360 에서 실측으로 잡힌 것: 사이드열 x 퀘스트/스킬바/보물상자,
     스테이지 텍스트 x 배속 버튼, 스킬 행이 스킬바 밖으로 39px.

     **@media 가 아니라 @container 다.** 게임은 #app 안에서 살고 데스크톱에서는
     뷰포트가 넓어도 앱이 480px 로 잘린다 — 뷰포트를 재면 정작 좁은 건 앱인데
     규칙이 안 걸린다 (검사기가 그래서 같은 겹침을 계속 뱉었다). */
  @container app (max-width: 440px){
    /* 사이드 열 — 더 작게 + 위로. 전투 중앙을 비운다.
       문턱이 440 인 이유: 앱 최대폭이 480 이고 412(픽셀7 계열)에서도 같은
       겹침이 났다. 480 미만은 사실상 전부 "좁은 폰"이다 */
    .side button{width:30px;height:30px}
    .side button img{width:22px;height:22px}
    .side button span{display:none}
    #sideL,#sideR{gap:3px}
    /* 우측 열을 조금 더 위로 — 스킬바 상단과 6px 스치던 것 */
    #sideR{top:52px}
    /* 퀘스트·상자를 사이드 안쪽으로 더 밀고 낮춘다 */
    #chest{right:40px;bottom:100px;width:38px;height:38px}
    /* HUD 상단 — 스테이지 글자와 배속 줄을 세로로 분리 */
    #hudTop{align-items:flex-start}
    #stg{font-size:10px;max-width:40cqw}
    #enc{font-size:9px}
    /* 배속은 절대배치 그대로 둔다 — static 으로 풀면 HUD 흐름에 들어가
       사이드열·보물상자와 새로 겹친다 (실측). 자리만 왼쪽·위로 당긴다 */
    /* 배속·타이머를 사이드 열 **왼쪽**으로 완전히 뺀다. 우측 사이드가 44px 이라
       right:40px 은 여전히 그 밑이었다 */
    /* 폭을 안 묶으면 #hudTop 의 flex 늘어남 때문에 133px 까지 벌어져
       중앙 스테이지 글자를 침범한다 (실측) */
    #speed{right:auto;left:44px;top:2px;width:auto;max-width:104px;gap:2px}
    #speed .sbtn{padding:1px 5px;font-size:9px;flex:0 0 auto}
    #timer{position:absolute;top:2px;right:44px;font-size:15px;margin:0}
    /* 중앙 HUD 는 배속 줄(≈96px)과 사이드(40px)를 뺀 폭 안에서만 산다.
       안 그러면 스테이지 글자가 배속 버튼 밑으로 파고든다 */
    /* 중앙 HUD 는 좌(배속 96px)·우(타이머+사이드 80px)를 뺀 폭 안에서만 산다 */
    #hudC{max-width:calc(100cqw - 200px);margin:0 auto}
    #stg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
    /* 퀘스트 이름이 37px 폭에서 잘렸다 — 배너를 넓히고 글자를 줄인다 */
    /* 조우 아이콘 줄이 아래로 자라 퀘스트 배너와 부딪힌다 — 크기와 간격을 줄여
       HUD 상단 안에 가둔다 (360 실측) */
    #enc{margin-top:0;gap:3px;transform:scale(.72);transform-origin:top center}
    /* 640 높이에서는 전투 패널이 ~205px 라 HUD(위)와 퀘스트 배너(아래)가
       어디에 두든 부딪힌다. 배너를 **전투 영역 밖(하단 패널 위)** 로 옮겨
       충돌원 자체를 없앤다 — 세로가 모자랄 때는 자리를 옮기는 게 답이다 */
    #quest{padding:3px 8px}
    #qbar{height:4px}
    /* 배너가 하단을 쓰므로 스킬바를 그 위로 올린다 (배너 높이 ≈28px + 여유) */
    #skillbar{bottom:34px}
    #qname{max-width:none}
    /* 퀘스트 이름은 줄이지 말고 **말줄임**으로. 폰트를 더 줄이면 안 읽힌다 */
    /* 이름은 배너 폭을 다 쓰고 넘치면 말줄임. 진행도(#qprog)가 자리를 먼저 잡는다 */
    #qname{font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      flex:1 1 auto;min-width:0;display:block}
    #qtop{display:flex;gap:4px;align-items:baseline}
    #qprog{flex:0 0 auto}
    /* 스킬바는 폭을 줄이면 8칸이 안쪽에서 넘친다. 대신 **사이드 열을 위로**
       끌어올려 스킬바 높이대(하단)와 안 겹치게 한다 */
    #sideL,#sideR{max-height:52cqh;overflow:visible}
    /* 스킬바가 우측 사이드 아래를 스친다 — 스킬 행만 안쪽으로 (바 자체는 그대로) */
    /* 스킬 8칸 + AUTO. 칸 폭 계산이 max-width 와 어긋나면 마지막 칸이 삐져나온다
       — 둘을 같은 식으로 묶는다 (여백 96px = 사이드 2 x 30 + 간격) */
    #skills{max-width:calc(100cqw - 96px);flex-wrap:nowrap}
    /* 네비 아이콘이 빨간 점 배지 상자를 넘던 것 */
    .nv.hasnew{overflow:visible}
    /* 스킬바 — 8칸이 가로로 안 넘치게. bottom 은 위(배너 자리 확보)에서 정한다 */
    #skRow{max-width:100%;flex-wrap:nowrap}
    #skills{gap:3px}
    .sk{width:clamp(18px,calc((100cqw - 150px)/8),30px)}
    #skAuto{width:26px;height:26px;font-size:7px}
    #dpsInfo{font-size:9px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="row">
      <span id="capbox"><img id="cap" alt=""><span id="caplv">1</span></span>
      <div style="flex:1">
        <div class="sub" id="topNick">단장</div>
        <div id="cpwrap"><span id="cp">0</span></div>
        <div id="xpbar"><div id="xpfill"></div></div>
      </div>
      <!-- 우편은 사이드가 아니라 프로필 줄이다. 사이드는 "지금 눌러야 하는 것"만
           남기고, 우편처럼 언제 봐도 되는 수령함은 프로필 옆에 둔다 -->
      <button id="topMail" class="topIc" data-s="mail" title="우편"><img
        src="/assets/ui/IC-MAIL.png" alt=""
        onerror="this.replaceWith(document.createTextNode('✉'))"></button>
      <button id="topSet" class="topIc" title="설정"><img src="/assets/ui/IC-SETTINGS.png" alt=""
        onerror="this.replaceWith(document.createTextNode('⚙'))"></button>
    </div>
    <div class="row" style="gap:13px">
      <span class="cur"><img class="cui" src="/assets/ui/CU-01.png" alt=""><b id="c_dia">0</b><button
        id="diaPlus" title="다이아 충전">+</button></span>
      <span class="cur"><img class="cui" src="/assets/ui/CU-04.png" alt=""><b id="c_gold">0</b><button
        id="goldPlus" title="골드 획득">+</button></span>
    </div>
  </div>

  <div id="battle">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div id="hudTop">
        <div class="hudSide"></div>
        <div id="hudC"><div id="stg">스테이지 1</div><div id="enc"></div>
          <button id="bossGo">보스 도전</button></div>
        <div class="hudSide" style="text-align:right">
          <div id="timer">60</div>
          <div id="speed">
            <button class="sbtn on" data-sp="1">1x</button>
            <button class="sbtn" data-sp="2">2x</button>
            <button class="sbtn" data-sp="3">3x</button>
            <!-- 절전 — 렌더만 6fps. 방치형은 화면을 몇 시간씩 켜 둔다 (skipBattle) -->
            <button class="sbtn" id="pwrSave" title="절전 모드"><img
              src="/assets/ui/IC-POWERSAVE.png" alt="절전"
              onerror="this.onerror=null;this.replaceWith('💤')"></button>
          </div>
        </div>
      </div>
      <div id="hudBot"></div>
    </div>
    <!-- 보스 도전 VS 연출 -->
    <div id="vs">
    <div id="vsBoss"><img id="vsBossImg" src="" alt=""></div>
    <div id="vsCap"><img id="vsCapImg" src="/assets/captain/captain_warrior.png" alt=""></div>
    <div id="vsMark">VS</div>
    </div>
    <!-- 퀘스트 배너는 하단 제작대 줄로 옮겼다 (#fgRow 안).
         전투 영역에 두면 사이드 열·조우 점과 자리를 다퉜고, 좁은 화면에서는
         어디에 놓아도 부딪혔다.
         **옛 마크업은 지웠다** — hidden 으로만 두면 #qname·#qrw 가 문서에 둘이 되고
         querySelector 가 숨은 쪽을 먼저 잡아 화면이 영영 안 갱신된다 (실제로 났다) -->
    <!-- 사이드는 축으로 가른다. 좌 = 기간이 있는 것(놓치면 사라진다 → 빨간 점이
         의미를 갖는다), 우 = 경쟁·수령. 훈련소·도감은 성장 시스템이라 용병 시트
         안으로, 우편은 프로필 줄로 옮겼다. 9개 → 5개 -->
    <div class="side" id="sideL">
      <button data-s="mission"><img src="/assets/ui/IC-QUEST.png" alt=""
        onerror="this.onerror=null;this.src='/assets/ui/IC-ATTEND.png'"><span>임무</span></button>
      <button data-s="attend"><img src="/assets/ui/IC-ATTEND.png" alt="" onerror="this.remove()"><span>출석</span></button>
      <button data-s="event"><img src="/assets/ui/IC-EVENT.png" alt="" onerror="this.remove()"><span>이벤트</span></button>
      <button data-s="pass"><img src="/assets/ui/IC-PASS.png" alt="" onerror="this.remove()"><span>패스</span></button>
    </div>
    <div class="side" id="sideR">
      <button data-s="arena"><img src="/assets/ui/IC-ARENA.png" alt="" onerror="this.remove()"><span>아레나</span></button>
      <button data-s="rank"><img src="/assets/ui/IC-RANK.png" alt="" onerror="this.remove()"><span>랭킹</span></button>
    </div>
    <button id="chest"><img id="chestImg" src="/assets/ui/CH-01.png" alt=""><span id="chestT">0분</span></button>
    <div id="skillbar"><div id="skRow"><button id="skAuto" class="on" title="스킬 자동 사용">AUTO<i>ON</i></button><div id="skills"></div></div><span id="dpsInfo"></span></div>
    <div id="result"></div>
    <!-- 벽 안내 — 보스 실패 뒤 요구/현재 CP 와 탈출구. 탭하면 닫힌다 -->
    <div id="wall">
      <div id="wallCard">
        <b>전투력이 부족합니다</b>
        <div class="w-row"><span>요구</span><i id="wallNeed"></i></div>
        <div class="w-row"><span>현재</span><i id="wallMy"></i></div>
        <div class="w-barbox"><div id="wallBar"></div></div>
        <div id="wallGate"></div>
        <div class="lbl" style="margin:8px 0 4px">추천</div>
        <div id="wallGo"></div>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div class="lbl"><span>장비</span><span id="eqInfo"></span></div>
    <div id="eq"><div id="eqL"></div><div id="eqR"></div></div>

    <!-- 퀘스트 — 제작대 왼쪽. 둘 다 "지금 할 일"이라 같은 줄이 제자리다 -->
    <div id="fgRow">
    <div id="quest">
      <div id="qtop"><span id="qname">퀘스트 1</span><span id="qprog">0 / 0</span></div>
      <div id="qbar"><div id="qfill"></div></div>
      <div id="qrw"></div>
    </div>
    <div id="fgDock">
      <button id="fgObj" title="탭하여 장비 소환">
        <!-- 전 단계가 4프레임 시트(FO-0N-STRIP) 재생이다. 유휴 = 마지막(휴지) 프레임.
             컷아웃 회전·FG-HAMMER 오버레이는 폐기했다. -->
        <div id="foAnim"></div>
        <span class="badge" id="fgBadge" style="display:none">!</span>
        <span id="fgSpark"></span>
      </button>
      <button id="fgLv">Lv 1</button>
      <button id="b_auto" title="자동 소환"><img src="/assets/ui/UI-GEAR.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'gear',textContent:'⚙'}))"><span class="au-lb">자동</span></button>
      <div id="fgTicket">
        <img class="tk-bg" src="/assets/ui/UI-PILL.png" alt="" onerror="this.remove()">
        <img class="tk-ic" src="/assets/ui/CU-07.png" alt="">
        <b id="fgTicketN">0</b>
      </div>
    </div>
    </div><!-- /#fgRow -->
  </div>

  <!-- 채팅 — 제작대 패널 밖. 가로로 길게 한 줄 -->
  <div id="chat"><span class="who">공지</span><span id="chatline">냥냥 용병단에 오신 걸 환영합니다.</span></div>


  <div id="nav">
    <!-- 아이콘이 아직 없으면 onerror 로 스스로 사라지고 글자만 남는다.
         에셋을 넣으면 코드 수정 없이 붙는다 (에셋_생성_프롬프트.md 9-5) -->
    <div class="nv on" data-tab="merc"><img src="/assets/ui/IC-MERC.png" alt="" onerror="this.remove()"><span>용병</span></div>
    <div class="nv" data-tab="skill"><img src="/assets/ui/IC-SKILL.png" alt="" onerror="this.remove()"><span>스킬</span></div>
    <div class="nv" data-tab="dungeon"><img src="/assets/ui/IC-DUNGEON.png" alt="" onerror="this.remove()"><span>던전</span></div>
    <div class="nv" data-tab="alliance"><img src="/assets/ui/IC-ALLIANCE.png" alt="" onerror="this.remove()"><span>연합</span></div>
    <div class="nv" data-tab="shop"><img src="/assets/ui/IC-SHOP.png" alt="" onerror="this.remove()"><span>상점</span></div>
  </div>

  <!-- 편성 시트 — 용병/스킬 탭. 아래에서 올라와 화면 60% 를 덮는다 -->
  <div id="sheetBg"></div>
  <div id="sheet">
    <div id="shHead">
      <!-- 제목과 요약은 한 덩어리다. 요약을 독립 줄로 두면 22px 를 통째로 먹는데
           담는 건 회색 한 줄이라, 그만큼 목록에서 빠진다 -->
      <div id="shHeadL"><span id="shT"></span><div id="shSum"></div></div>
      <!-- 훈련소·도감은 사이드에서 여기로 왔다. 둘 다 용병·스킬 성장이라
           편성 화면이 제자리다. 글자 대신 사이드와 같은 아이콘 — 같은 그림이
           자리만 옮겼다는 게 읽힌다 -->
      <button class="sh-go" data-go="training" title="훈련소"><img
        src="/assets/ui/IC-TRAIN.png" alt="훈련소" onerror="this.replaceWith(document.createTextNode('훈련소'))"></button>
      <button class="sh-go" data-go="codex" title="도감"><img
        src="/assets/ui/IC-CODEX.png" alt="도감" onerror="this.replaceWith(document.createTextNode('도감'))"></button>
      <button class="sh-go" data-go="promo" title="전직"><img
        src="/assets/ui/IC-PROMO.png" alt="전직"
        onerror="this.onerror=null;this.src='/assets/ui/IC-TRAIN.png'"></button>
      <button id="shX">닫기</button>
    </div>
    <!-- 프리셋 3칸 — 탭하면 불러오고 [저장]으로 현재 편성을 기록한다 -->
    <div id="shPre"></div>
    <div id="shEq"></div>
    <div id="shBody"></div>
    <div id="shAct">
      <button class="rt-b" id="shEqBtn">자동장착</button>
      <button class="rt-b go" id="shUp">자동강화</button>
    </div>
  </div>

  <!-- 소환 레벨 상세 — 확률표 + 레벨 보상 수령. 상점(z70) 위에 뜬다 -->
  <div id="smPop">
    <div id="smCard">
      <div id="smHead"><b id="smTitle">소환 레벨</b><button id="smX">✕</button></div>
      <div id="smBody"></div>
    </div>
  </div>

  <!-- 모래시계 사용 — 제작대 패널(#ov z60) **위**에 뜨는 별도 창.
       인라인으로 펼치면 제작대 카드가 늘었다 줄었다 하며 아래 내용이 밀린다 -->
  <div id="hgPop">
    <div id="hgCard">
      <div id="hgHead"><b>시간 단축</b><button id="hgX">✕</button></div>
      <div id="hgBody"></div>
    </div>
  </div>

  <!-- 유닛 상세 — 용병은 도감 일러(-ART)를 배경으로 크게. 시트(z65) 위 -->
  <div id="unit">
    <div id="unitCard">
      <button id="unitX">✕</button>
      <div id="unitArt"><img id="unitImg" src="" alt=""></div>
      <div id="unitBody">
        <div id="unitHead"><b id="unitName"></b><i id="unitGrade"></i></div>
        <div id="unitTags"></div>
        <!-- 스킬 설명 문장. 용병은 비워 두고 display:none 으로 접는다 -->
        <div id="unitDesc"></div>
        <div id="unitRows"></div>
        <div id="unitAct"></div>
      </div>
    </div>
  </div>

  <div id="ov">
    <div id="ovcard">
      <div id="ovh">
        <span id="ovt"></span>
        <span id="ovcur"></span>
        <button id="ovi" title="해금 정보">i</button>
        <button id="ovx">닫기</button>
      </div>
      <div id="ovb"></div>
      <div id="ovinfo"></div>
    </div>
  </div>
  <div id="idle"><div class="id-card">
    <h3>방치 보상</h3>
    <div class="id-time" id="idTime"></div>
    <div class="id-row"><img src="/assets/ui/CU-04.png" alt=""><b id="idGold">0</b></div>
    <div class="id-btns">
      <button id="idOk">수령</button>
      <button id="idAd" class="ad">광고 보고 2배</button>
    </div>
    <div class="id-alt">
      <span><b>2시간 보상 즉시 수령</b><span id="idFreeN"></span></span>
      <button id="idFree">받기</button>
    </div>
    <div class="id-alt">
      <span><b>광고 보고 2시간 더</b><span id="idAdN"></span></span>
      <button id="idAdInstant" class="ad">광고</button>
    </div>
    <button id="idClose" style="margin-top:10px;width:100%;background:none;border:none;
      color:var(--dim);font-size:11px;cursor:pointer;font-family:inherit">닫기</button>
  </div></div>
  <div id="lvup"><div><b></b><span></span></div></div>
</div><!-- /#app — 아래 넷은 **app 밖**이다. 절전이 #app 을 display:none 하므로
     안에 두면 덮개까지 같이 사라진다 (실제로 그랬다) -->

  <!-- 부트 로딩 — 데이터·씬이 서기 전까지 이게 화면의 전부다.
     첫 실행이면 진행이 끝난 뒤 언어 선택이 겹쳐 뜬다 -->
<div id="boot">
  <!-- 표준 모바일 로딩 구도: 중앙 = 타이틀(간판), 하단 = 진행바.
       바를 중앙에 두면 타이틀과 싸운다 -->
  <div id="bootMain">
    <img id="bootCap" src="/assets/captain/captain_warrior.png" alt="">
    <b id="bootTitle">냥냥 용병단</b>
    <span id="bootSub">NYANG NYANG MERCENARIES</span>
  </div>
  <div id="bootBottom">
    <div id="bootBar"><i id="bootFill"></i></div>
    <span id="bootMsg">냥이들을 깨우는 중…</span>
  </div>
  <div id="bootLang">
    <b>언어 / Language</b>
    <!-- 버튼은 i18n.js > LANGS 가 만든다 -->
    <div id="bootLangBtns"></div>
    <span>부분 번역입니다 — 없는 문구는 한국어로 표시됩니다</span>
  </div>
</div>

<!-- 절전 덮개 — #app **밖**이다. 안에 두면 VS(z30)·상단바·네비가 덮개 위로
     새고, #app 을 통째로 숨기는 것도 불가능해진다. 밀어서 해제 -->
<div id="pwrveil">
  <div class="pv-cat">
    <img src="/assets/captain/captain_sleep.png" alt=""
      onerror="this.onerror=null;this.src='/assets/captain/captain_warrior.png';this.classList.add('fallback')">
    <span class="pv-z"><i>z</i><i>z</i><i>Z</i></span>
  </div>
  <div class="pv-clock">00:00</div>
  <b>절전 중</b>
  <span>전투·보상은 계속 진행됩니다</span>
  <div class="pv-stats"><span id="pvStage"></span><span id="pvGold"></span></div>
  <div id="pvTrack"><div id="pvHandle">💤</div><i>밀어서 해제</i></div>
</div>
<div id="toast"></div>
<div id="gains"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
