<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>냥냥 용병단 — 프로토타입</title>
<style>
  :root{
    --bg:#12161f; --panel:#1b2230; --panel2:#232c3d; --line:#2f3a4f;
    --txt:#e8edf5; --dim:#93a0b5; --gold:#ffc94a; --dia:#5ad8ff; --ore:#ff8a4a;
    --up:#5ad86a; --warn:#ff5a6a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0a0d13;color:var(--txt);
    font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden}
  #app{position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;
    background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

  /* 상단바 12% */
  #topbar{flex:0 0 12%;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;justify-content:center;padding:6px 10px;gap:4px}
  .row{display:flex;align-items:center;gap:8px}
  #cap{width:34px;height:34px;border-radius:50%;background:#33405a;object-fit:cover;
    border:2px solid var(--gold)}
  #cpbox{font-weight:700;font-size:17px;color:var(--gold)}
  #cpdelta{font-size:12px;color:var(--up);opacity:0;transition:opacity .3s}
  .cur{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--dim)}
  .cur b{color:var(--txt);font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}

  /* 전투 40% */
  #battle{flex:0 0 40%;position:relative;overflow:hidden;background:#1a2436}
  #stagebar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;
    align-items:center;justify-content:space-between;padding:5px 9px;font-size:12px;
    background:linear-gradient(#0009,#0000)}
  #enc{display:flex;gap:4px}
  .encdot{width:8px;height:8px;border-radius:50%;background:#4a5670}
  .encdot.on{background:var(--gold)}
  .encdot.boss{width:11px;height:11px;background:#6a3040}
  .encdot.boss.on{background:var(--warn)}
  #speed{position:absolute;bottom:6px;right:8px;z-index:5;display:flex;gap:4px}
  .sbtn{background:#0008;border:1px solid var(--line);color:var(--txt);border-radius:6px;
    padding:3px 8px;font-size:11px;cursor:pointer}
  .sbtn.on{background:var(--gold);color:#000;border-color:var(--gold)}

  /* 하단 40% */
  #bottom{flex:0 0 40%;background:var(--panel);border-top:1px solid var(--line);
    padding:6px 8px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
  .lbl{font-size:10px;color:var(--dim);letter-spacing:.5px}
  #eqrow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
  #inv{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
  .slot{aspect-ratio:1;background:var(--panel2);border:2px solid var(--line);border-radius:7px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:9px;color:var(--dim);position:relative;overflow:hidden}
  .slot .t{font-size:13px;font-weight:700;line-height:1}
  .slot .e{font-size:8px;color:var(--gold)}
  .slot.up{border-color:var(--up);box-shadow:0 0 6px #5ad86a66}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .slot.new{animation:pop .28s ease-out}

  #forge{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
  #fgtop{display:flex;justify-content:space-between;align-items:center;font-size:11px}
  #fgbar{height:5px;background:#0006;border-radius:3px;margin-top:4px;overflow:hidden}
  #fgfill{height:100%;width:0;background:linear-gradient(90deg,var(--ore),var(--gold))}
  #btns{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  button.act{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:7px;padding:7px 2px;font-size:11px;font-weight:600;cursor:pointer;position:relative}
  button.act:active{transform:translateY(1px)}
  button.act.primary{background:linear-gradient(#3c5ea8,#2c4680);border-color:#4a6fc0}
  button.act:disabled{opacity:.35}
  .badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:8px;
    background:var(--warn);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 3px}

  /* 네비 8% */
  #nav{flex:0 0 8%;display:grid;grid-template-columns:repeat(5,1fr);
    background:#151b27;border-top:1px solid var(--line)}
  .nv{display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:11px;color:var(--dim);cursor:pointer;position:relative}
  .nv.on{color:var(--gold)}

  /* 오버레이 */
  #ov{position:absolute;inset:0;z-index:50;background:#0b0f17f2;display:none;
    flex-direction:column;padding:10px}
  #ov.show{display:flex}
  #ovhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  #ovtitle{font-size:16px;font-weight:700}
  #ovclose{background:none;border:1px solid var(--line);color:var(--txt);
    border-radius:6px;padding:4px 10px;cursor:pointer}
  #ovbody{flex:1;overflow-y:auto;font-size:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:7px 9px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
  .card.eq{border-color:var(--gold)}
  .gd{font-weight:700;padding:1px 6px;border-radius:4px;font-size:10px}
  .toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);z-index:99;
    background:#000c;border:1px solid var(--gold);border-radius:10px;padding:10px 16px;
    font-size:14px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .25s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="row">
      <img id="cap" alt="">
      <div style="flex:1">
        <div style="font-size:12px;color:var(--dim)">냥이 단장 <span id="capform">검사</span></div>
        <div><span id="cpbox">0</span> <span id="cpdelta"></span></div>
      </div>
      <div style="text-align:right;font-size:11px;color:var(--dim)">
        <div>스테이지 <b id="stg" style="color:var(--txt)">1</b></div>
      </div>
    </div>
    <div class="row" style="gap:12px">
      <span class="cur"><i class="dot" style="background:var(--dia)"></i><b id="c_dia">0</b> 다이아</span>
      <span class="cur"><i class="dot" style="background:var(--gold)"></i><b id="c_gold">0</b> 골드</span>
      <span class="cur"><i class="dot" style="background:var(--ore)"></i><b id="c_key">0</b> 열쇠</span>
    </div>
  </div>

  <div id="battle">
    <div id="stagebar">
      <span id="stgname">스테이지 1</span>
      <span id="enc"></span>
    </div>
    <canvas id="cv"></canvas>
    <div id="speed">
      <button class="sbtn on" data-sp="1">1x</button>
      <button class="sbtn" data-sp="2">2x</button>
      <button class="sbtn" data-sp="3">3x</button>
    </div>
  </div>

  <div id="bottom">
    <div class="lbl">장착 6부위</div>
    <div id="eqrow"></div>
    <div class="lbl">획득 대기 <span id="invinfo" style="float:right"></span></div>
    <div id="inv"></div>
    <div id="forge">
      <div id="fgtop">
        <span>⚒ 대장간 <b id="fglv">Lv1</b> → <span id="fgnext">Lv2</span></span>
        <span id="fgtime" style="color:var(--dim)">5:00</span>
      </div>
      <div id="fgbar"><div id="fgfill"></div></div>
      <div style="font-size:10px;color:var(--dim);margin-top:3px" id="fghint"></div>
    </div>
    <div id="btns">
      <button class="act primary" id="b_sum1">소환 x1</button>
      <button class="act primary" id="b_sum10">10연</button>
      <button class="act" id="b_auto">자동 OFF</button>
      <button class="act" id="b_speedup">즉시완료</button>
    </div>
  </div>

  <div id="nav">
    <div class="nv" data-ov="merc">용병<span class="badge" id="nb_merc" style="display:none">!</span></div>
    <div class="nv" data-ov="skill">스킬<span class="badge" id="nb_skill" style="display:none">!</span></div>
    <div class="nv" data-ov="equip">장비<span class="badge" id="nb_equip" style="display:none">!</span></div>
    <div class="nv" data-ov="shop">상점</div>
    <div class="nv" data-ov="info">정보</div>
  </div>

  <div id="ov">
    <div id="ovhead"><span id="ovtitle"></span><button id="ovclose">닫기</button></div>
    <div id="ovbody"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
